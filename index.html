<!doctype html>
<html lang="ko" class="gating">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8f1">
<title>Daynua</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* 첫 화면(gate)이 어떤 이유로든 12초 안에 시작되지 않으면 앱을 그냥 보여준다 — 빈 화면에 갇히지 않게 */
setTimeout(function(){ if(!window.__gate) document.documentElement.classList.remove('gating'); }, 12000);
</script>
<style>
:root{
  --bg:#faf9f6; --card:#fff; --ink:#1b1b20; --sub:#63626c; --faint:#8a877f;
  --line:#e3e0d9; --fill:#efece5; --accent:#c9502f; --accent-ink:#b4441f; --on-accent:#fff;
  --sat:#35619f; --sun:#b4441f; --danger:#c93f2b;
  --r:14px;
  color-scheme:light;                 /* 날짜/시간 입력 같은 기본 위젯도 테마를 따르게 */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131316; --card:#1c1c21; --ink:#edece8; --sub:#a2a1ac; --faint:#78777f;
    --line:#33333c; --fill:#26262d; --accent:#e8714d; --accent-ink:#e8714d; --on-accent:#111;
    --sat:#7ea6e8; --sun:#e8714d; --danger:#f2705a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131316; --card:#1c1c21; --ink:#edece8; --sub:#a2a1ac; --faint:#78777f;
  --line:#33333c; --fill:#26262d; --accent:#e8714d; --accent-ink:#e8714d; --on-accent:#111;
  --sat:#7ea6e8; --sun:#e8714d; --danger:#f2705a;
  color-scheme:dark;
}
/* ── 움직임 ──
   장식이 아니라 '무엇이 바뀌었는지' 를 잇는 선이다. 작게 · 빠르게 · 눈에 띄지 않게.
   같은 종류의 것은 같은 시간을 쓴다 — 그래야 앱이 한 덩어리로 느껴진다.
   다시 그릴 때마다 반복되면 안 되는 등장 효과는 CSS 가 아니라 animate() 가 한 번만 붙인다. */
:root{ --mo-fast:120ms; --mo:180ms; --mo-slow:240ms; --ease:cubic-bezier(.2,0,0,1) }
@keyframes moIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes moCk{from{transform:scale(.86)}to{transform:none}}
@keyframes moStepL{from{opacity:.55;transform:translateX(7px)}to{opacity:1;transform:none}}
@keyframes moStepR{from{opacity:.55;transform:translateX(-7px)}to{opacity:1;transform:none}}
@keyframes moMenu{from{opacity:0;transform:translateY(-3px) scale(.985)}to{opacity:1;transform:none}}
@keyframes moDlg{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes moSheet{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes moToast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.in{animation:moIn var(--mo) var(--ease)}
.pop{animation:moPop 170ms var(--ease)}
.vfade{animation:moIn 170ms var(--ease)}
#cal.stepL{animation:moStepL var(--mo) var(--ease)}
#cal.stepR{animation:moStepR var(--mo) var(--ease)}
/* 사라지는 것은 사라지는 게 보여야 한다 — 그래야 '뭐가 없어졌지' 가 안 된다 */
li.out,.subs .s.out{opacity:0;transform:scale(.985);
  transition:opacity var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}
.toast.out{opacity:0;transform:translate(-50%,6px);
  transition:opacity var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}

/* 빠르게 두 번 눌러도 화면이 확대되지 않게 (체크·별을 연달아 누를 때) */
html{touch-action:manipulation}
/* 설치해서 쓸 때는 화면을 아래로 당겨 새로고침되는 일이 없게 — 끌기·쓸기와 겹치고 쓰던 글이 날아간다 */
@media (display-mode:standalone){ html{overscroll-behavior-y:contain} }
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{opacity:.75;cursor:pointer}
@media (hover:hover){input[type=date]:hover::-webkit-calendar-picker-indicator,input[type=time]:hover::-webkit-calendar-picker-indicator{opacity:1}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

#app{max-width:560px;margin:0 auto;padding:18px 16px 84px}
/* 오른쪽 아래 설정 단추가 목록의 마지막 줄을 덮고 있었다 */
@media (min-width:600px){ #app{max-width:640px} }      /* 큰 폰·좁은 창: 560 에 갇혀 양옆이 비지 않게 */
@media (max-width:719px){ #app{padding-bottom:72px} }
/* 2단(달력 + 옆 패널)은 720px 부터. 설치한 앱 창이 800px 쯤으로 열려도 세로 한 줄로 좁아지지 않는다.
   옆 패널은 좁은 창에서는 340px, 넓어지면 400px. */
@media (min-width:720px){
  #app{max-width:1180px;padding:26px 24px 40px;display:grid;gap:0 20px;
    grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"top top" "bar bar" "cal side";align-items:start}
  .top{grid-area:top} .bar2{grid-area:bar;margin-bottom:14px}
  #cal{grid-area:cal;margin:0;padding:16px;min-width:0}
  #side{grid-area:side;position:sticky;top:26px;max-height:calc(100vh - 52px);overflow-y:auto;padding:16px}
  /* 주간은 7칸이 나란히 서야 하므로 달력 쪽에 조금 더 준다 */
  @media (min-width:1000px){ #app{grid-template-columns:minmax(0,1fr) 400px} }
  @media (min-width:1100px){ #app.v-week{grid-template-columns:minmax(0,1fr) 366px} }
  /* 1년 화면은 옆칸 없이 전체 폭 — 그래야 날짜 칸이 누를 만한 크기가 된다 */
  #app.overview{grid-template-columns:1fr;grid-template-areas:"top" "bar" "cal"}
  #app.overview #side{display:none}
  .bar2 h1{font-size:30px}
  .grid{gap:7px}
  li{padding:8px 2px}
}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:6px}
.brand{font-size:15px;font-weight:800;letter-spacing:3px;flex:1;min-width:0}
.brand b{color:var(--accent-ink)}
.iconbtn{width:34px;height:34px;border-radius:10px;color:var(--sub);font-size:15px;flex:none;
  display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn,.nav,.chip,.acct,.vseg button,.dnbtn,.ch,.res .again,.nudge .acts button,
.impbox,.qcat button,.danger,#menu button,.ymt,.fold{
  transition:background var(--mo-fast) var(--ease),color var(--mo-fast) var(--ease),
             border-color var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}
/* 눌렸다는 것만 알려주면 된다. 달력 칸이나 할 일 줄 전체에는 쓰지 않는다 — 화면이 들썩인다 */
.iconbtn:active,.nav:active,.chip:active,.acct:active,.vseg button:active,
.dnbtn:active,.row button:active,#sheet button:active,.days button:active{transform:scale(.97)}
@media (hover:hover){.iconbtn:hover{background:var(--fill);color:var(--ink)}}
.iconbtn.on{background:var(--ink);color:var(--bg)}
.iconbtn .cnt{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;
  background:var(--accent);color:var(--on-accent);font-size:9.5px;font-weight:800;line-height:15px;padding:0 3px}
.acct{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--sub);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;max-width:170px;flex:none}
@media (hover:hover){.acct:hover{border-color:var(--faint)}}
.acct .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 좁은 화면에서는 이름이 윗줄을 다 먹지 않게 아바타만 — 누르면 계정 창에서 보인다.
   단, 로그인하지 않았을 때는 글자를 남긴다. 이건 상태가 아니라 해야 할 일이다. */
@media (max-width:560px){ .acct{padding:4px;max-width:none} .acct:not(.out) .nm{display:none}
  .acct.out{padding:4px 10px 4px 4px} }
.acct.out{border-color:var(--accent);color:var(--accent)}
.acct.out .av{background:transparent;border:1px dashed var(--accent);color:var(--accent)}

#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:17px;background:var(--ink);border:0;
  box-shadow:0 8px 24px rgba(0,0,0,.22);line-height:0;color:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:5;transition:transform .18s}
#fab svg{width:23px;height:23px}
@media (hover:hover){#fab:hover{transform:rotate(45deg) scale(1.06)}}
#fab:active{transform:scale(.96)}
/* 폰에서는 설정 단추를 위로 올린다. 오른쪽 아래에 떠 있던 톱니가 목록 줄의 ☆·⋯ 바로 위에 올라앉아
   그 줄의 ⋯ 를 누르면 메뉴 대신 설정이 열렸다. 자주 쓰는 동작도 아니라 목록 위에 떠 있을 이유가 없다. */
#btnCfg{display:none}
@media (max-width:999px), (hover:none){ #btnCfg{display:flex} #fab{display:none} }
/* 아주 좁은 화면(폴드 바깥 화면 등)에서는 윗줄이 넘치지 않게 여백부터 줄인다 */
@media (max-width:359px){ .top{gap:3px} .brand{letter-spacing:1.5px} }
@media (max-width:340px){ .acct.out .nm{display:none} .acct.out{padding:4px} }

.bar2{display:flex;align-items:center;gap:8px;row-gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* '오늘'과 보기 선택기는 한 덩어리로 오른쪽 끝. 자리가 모자라면 둘이 함께 아랫줄로 내려가고,
   제목이 점 세 개로 잘리는 일은 없다 (영어는 Week/Month/Year 라 한국어보다 넓다) */
.vgroup{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
/* 좁은 화면에서는 한 줄을 지키되 여백부터 줄인다 — 제목이 잘리는 것보다 낫다.
   연도는 접는다 ('년' 보기에서 본다). 영어는 Week/Month/Year 라 한국어보다 넓어 더 조인다. */
@media (max-width:420px){
  .bar2{gap:4px}
  .bar2 h1 small{display:none}
  .nav{width:26px;height:28px;font-size:18px}
  .vseg button{padding:6px 6px}
  #today{padding:6px 7px}
}
.bar2 h1{font-size:clamp(17px, 5.2vw, 25px);margin:0;font-weight:800;letter-spacing:-.6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:92px}
.bar2 h1 small{font-size:.54em;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:5px}
.nav{width:30px;height:32px;border-radius:9px;color:var(--sub);font-size:19px;line-height:1;flex:none}
@media (hover:hover){.nav:hover{background:var(--fill)}}
.chip{font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:9px;padding:6px 10px;flex:none}
@media (hover:hover){.chip:hover{border-color:var(--faint)}}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 주 · 월 · 년 — 지금 보고 있는 것만 강조. '오늘'과 역할이 다르므로 생김새도 다르다.
   (설정 안의 토글도 .seg 를 쓰므로 이름을 따로 둔다 — 스타일이 새지 않게) */
.vseg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px}
.vseg button{font-size:12px;font-weight:700;color:var(--sub);padding:6px 10px;line-height:1.1;
  border-right:1px solid var(--line);white-space:nowrap}
.vseg button:first-child{border-radius:8px 0 0 8px}
.vseg button:last-child{border-right:0;border-radius:0 8px 8px 0}
@media (hover:hover){.vseg button:hover{background:var(--fill);color:var(--ink)}}
.vseg button.on{background:var(--accent);color:var(--on-accent)}
@media (max-width:359px){ .vseg button{padding:6px 5px;font-size:11.5px} .chip{padding:6px 6px;font-size:11.5px} }

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
#cal{margin-bottom:12px;touch-action:pan-y pinch-zoom}
/* 쓸어 넘길 때 아주 짧게 따라 움직인다 — 넘어갔다는 걸 손이 알아채게 */
@keyframes slideL{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-26px);opacity:.4}to{transform:none;opacity:1}}
#cal.slideL{animation:slideL .2s cubic-bezier(.2,.9,.3,1)}
#cal.slideR{animation:slideR .2s cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion:reduce){ #cal.slideL,#cal.slideR{animation:none} }
#app.overview #side{display:none}

/* ── 달력 ──
   색 = 무슨 종류의 일인가 · 취소선 = 그 할 일을 했는가 · ✓ = 그날 계획을 다 끝냈는가.
   셋은 서로 의미를 겹치지 않는다. 배경을 완료율로 채우던 방식은 없앴다. */
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.wk span{text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{position:relative;min-height:60px;user-select:none;-webkit-touch-callout:none;border-radius:14px;background:none;overflow:hidden;
  cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;
  padding:6px 2px 4px;
  transition:border-color var(--mo) var(--ease),background var(--mo-fast) var(--ease)}
@media (hover:hover){.cell:hover{background:var(--line)}}
/* 폰에서는 달력이 첫 화면의 절반을 먹어 할 일이 한 줄도 안 보였다 */
@media (max-width:999px){ .cell{min-height:50px} }
/* 길게 누르기 — 500ms 동안 아무 반응이 없으면 이상하다. 살짝 눌린 티만 낸다 */
@media (hover:none){ .cell:active,.wcard:active{background:var(--line);transition-delay:90ms} }
/* 칸에는 날짜와 표시 하나만 둔다 — 무엇이 있는지는 고른 날의 목록이 말한다 */
.cell .n{font-size:13px;font-weight:600;line-height:22px;min-width:22px;height:22px;text-align:center;border-radius:50%}
.mk{display:flex;gap:3px;justify-content:center;align-items:center;height:12px;margin-top:3px}
.cell.fin .mk{height:auto;margin-top:2px}
.mk i{display:block;width:5px;height:5px;border-radius:50%;background:var(--c)}
.mk i.fd{opacity:.35}
.mk b{font-size:9px;line-height:1;font-weight:700;color:var(--sub);margin-left:1px}
/* ✓ 는 동그라미 없이 갈고리만 — 칸 크기에 맞춰 키운다 */
.cell .chk{position:static;width:20px;height:20px;padding:0;flex:none;border:0;border-radius:0;background:none}
.cell .chk path{stroke-width:2.6}
/* 끝낸 날 — 칸을 그날 분류 색으로 은은하게 채우고(JS 가 --fill 대신 background 를 준다) ✓ 는 잉크색으로 또렷하게 */
.cell.fin .chk{background:none;color:var(--ink)}
.cell.fin.soft .chk{border:0;color:var(--ink);opacity:.5}
.cell.tint{border-color:transparent}
.cell.tint.out{opacity:.5}
/* ✓ 는 날짜를 밀어내지 않게 오른쪽 위에 얹는다 */
/* 그날 계획을 다 끝냈다는 표시.
   10px 짜리 갈고리는 있어도 눈에 안 들어왔다 — 채운 동그라미로 바꾼다.
   (✓ 는 다시 그릴 때마다 튀면 안 된다 — 끝낸 그 순간에만 animate 가 .pop 을 붙인다) */
.chk{position:absolute;right:-1px;top:2px;width:17px;height:17px;padding:3.5px;
  border-radius:50%;background:var(--accent);color:var(--on-accent)}
/* 온전히 끝낸 날은 꽉 찬 배지, 미룬 게 있어 '남은 것만 없는' 날은 테두리만.
   둘을 같은 모양으로 그리면 ✓ 가 거짓말이 되고, 하나만 그리면 며칠씩 아무 표시도 안 남는다. */
.fin.soft .chk{background:none;border:2px solid var(--accent);color:var(--accent-ink)}
/* 폰에서는 '남은 개수'가 서던 줄이 완료한 날엔 비어 있다 — 그 자리를 쓴다.
   달력 배경을 완료율로 칠하던 방식은 예전에 없앴다(색은 '분류'의 몫). 자리만 빌린다. */
/* 숫자 색은 건드리지 않는다. 지금도 일요일·공휴일·오늘이 강조색을 쓰고 있어서
   완료까지 같은 색을 쓰면 무엇을 뜻하는 색인지 알 수 없게 된다 — 뜻은 배지 하나로 족하다. */
.cell.out{background:none}                     @media (hover:hover){/* 다른 달은 '옅게'가 아니라 '비워서' 구분 */
.cell.out:hover{background:var(--fill)}}
.cell.out .n{color:var(--sub)}                 /* 흐려 보여도 며칠인지는 읽혀야 한다 */
.cell.out .mk{opacity:.4}                     /* 다른 달 표시는 옅게 */
.cell.out .e,.cell.out .more{opacity:.7}
/* 오늘과 '고른 날'은 다른 것을 말한다 — 둘이 겹쳐도 둘 다 보이게 테두리와 숫자로 나눈다 */
.cell.sel,.wcard.sel{border-color:var(--ink)}
.cell.today .n{background:var(--accent);color:var(--on-accent)!important;font-weight:800}
.wcard.today .wn{color:var(--accent-ink)!important;font-weight:800}
.wcard.today .wn::after{content:"";position:absolute;left:50%;bottom:-3px;
  transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cell .n,.wcard .wn{position:relative}
/* 끄는 중인 칸은 테두리로만 말한다 — 달력이 커졌다 작아지면 어디에 놓는지 알 수 없다 */
.cell.over{border-color:var(--accent);border-style:dashed;background:var(--line)}
.cell .hn,.cell .dn,.ev,.more{display:none}
/* 그날의 구성 — 완료 여부와 무관하게 '무엇을 계획했는지'만 말한다 */
.strip{margin:5px 3px 0;display:flex;gap:1px;height:3px;border-radius:2px;overflow:hidden}
.strip i{display:block;background:var(--c)}
.strip i.none{background:var(--faint)}
/* 칸 안에 제목이 들어가려면 칸이 70px 은 되어야 한다 — 그 폭이 되는 1000px 부터 */
@media (min-width:1000px){
  .cell{min-height:72px;padding:8px 4px 6px}
  .cell .n{font-size:14px}
  .mk{margin-top:5px}
  .mk i{width:6px;height:6px}
  .cell .chk{width:24px;height:24px}
  .cell .hn{display:block;font-size:9px;font-weight:700;color:var(--sun);max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ev{display:flex;flex-direction:column;gap:2px;margin-top:3px;align-items:stretch}
  .e{font-size:10.5px;line-height:1.45;font-weight:600;padding-left:5px;color:var(--ink);
    border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .e.done{opacity:.75;text-decoration:line-through;text-decoration-thickness:1px}
  .more{display:block;font-size:9.5px;font-weight:700;color:var(--sub);padding-left:7px;margin-top:1px}
  .strip{height:4px;margin:7px 4px 0}
}

/* ── 1년 ──
   12개의 작은 달력. 색은 '그날 끝낸 일의 수' 하나만 말한다 (분류 색은 월·주의 몫).
   여기서는 할 일을 적지 않는다 — 날짜를 누르면 그 달로 내려간다. */
.year{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 20px}
.ym{min-width:0}
.ymt{display:block;width:100%;text-align:left;font-size:13px;font-weight:800;padding:0 2px 5px;
  color:var(--ink);border-radius:6px}
@media (hover:hover){.ymt:hover{color:var(--accent-ink)}}
.ywd,.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ywd span{text-align:center;font-size:9px;font-weight:700;color:var(--sub);padding-bottom:2px}
.yd{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:var(--sub);border-radius:5px;background:var(--fill);
  min-height:22px;isolation:isolate}
.yd.out{background:none}
.yd::before{content:"";position:absolute;inset:0;border-radius:5px;background:var(--accent);
  opacity:0;z-index:-1;transition:opacity var(--mo-slow) var(--ease)}
.yd.a1::before{opacity:.45}
.yd.a2::before{opacity:.62}
.yd.a3::before{opacity:.92}
.yd.a1,.yd.a2{color:var(--ink)}
.yd.a3{color:var(--on-accent)}
.yd{transition:box-shadow var(--mo-fast) var(--ease),color var(--mo-slow) var(--ease)}
@media (hover:hover){.yd[data-k]:hover{box-shadow:0 0 0 1.5px var(--faint)}}
.yd.today{box-shadow:0 0 0 2px var(--accent);font-weight:800}
@media (min-width:600px){ .year{grid-template-columns:repeat(3,1fr);gap:20px 24px} }
@media (min-width:900px){
  .year{grid-template-columns:repeat(4,1fr);gap:22px 20px}
  .yd{font-size:12px;min-height:26px}
  .ywd span{font-size:10px}
  .ymt{font-size:14.5px}
}
@media (max-width:359px){ .year{grid-template-columns:1fr;gap:14px} }
/* 1년 화면 아래 범례 — 색이 무슨 뜻인지만 한 줄로 */
.ylegend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--sub)}
.ylegend .sp{flex:1;min-width:8px}
.ylegend .n{font-weight:700}
.ylegend i{width:11px;height:11px;border-radius:3px;display:block;background:var(--fill);flex:none}
.ylegend i.a1{background:var(--accent);opacity:.45}
.ylegend i.a2{background:var(--accent);opacity:.62}
.ylegend i.a3{background:var(--accent);opacity:.92}

/* ── 오른쪽 패널 ── */
.dh{display:flex;align-items:baseline;gap:8px;margin:2px 2px 6px;flex-wrap:wrap}
.dh b{font-size:17px}
.dh .meta{font-size:12.5px;color:var(--sub)}
.dh .pct{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.hol{font-size:12px;font-weight:700;color:var(--sun);margin:0 2px 6px}
.daynote{display:flex;align-items:center;gap:6px;margin:0 2px 8px;font-size:12.5px;color:var(--sub)}
.daynote input{flex:1;border:0;outline:none;background:none;font-size:12.5px;font-style:italic;padding:3px 0}
.daynote input::placeholder{color:var(--faint);font-style:normal}
.daynote.ro{font-style:italic;cursor:pointer}
@media (hover:hover){.daynote.ro:hover{color:var(--ink)}}
.dnbtn{font-size:12px;color:var(--faint);padding:0 4px;line-height:1}
.dnbtn.on{color:var(--accent-ink)}
@media (hover:hover){.dnbtn:hover{color:var(--accent-ink)}}
.qadd.main{background:none;border:1.5px dashed var(--line);border-radius:12px;margin:0 0 2px;padding:2px 13px}
.qadd.main input{font-size:15.5px;padding:12px 0;font-weight:500}
.qadd.main{transition:border-color var(--mo) var(--ease),background var(--mo) var(--ease)}
.qadd.main:focus-within{border-color:var(--accent);border-style:solid;background:var(--card)}
.qadd.main span{color:var(--faint);font-weight:700;font-size:17px}
/* 분류가 많아도 빠른 입력 위를 여러 줄로 덮지 않게 — 모바일은 한 줄 가로 스크롤 */
.qcat{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:-9px 0 -2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:9px 0}
.qcat::-webkit-scrollbar{display:none}
/* 옆으로 더 있다는 걸 잘린 단면이 아니라 흐려짐으로 알린다 (칩이 적으면 흐려질 것도 없다) */
.qcat{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
      mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
.qcat button{flex:none}
@media (min-width:900px){ .qcat{flex-wrap:wrap;overflow:visible} }
.qcat button{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  color:var(--sub);background:var(--fill);border-radius:999px;padding:5px 11px;line-height:1.3}
.qcat button i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
@media (hover:hover){.qcat button:hover{color:var(--ink)}}
.qcat button.on{background:var(--ink);color:var(--bg)}
.qcat button.on i{box-shadow:0 0 0 1px var(--bg)}
.qcat button.newc{background:none;border:1px dashed var(--line);color:var(--faint)}
@media (hover:hover){.qcat button.newc:hover{border-color:var(--accent);color:var(--accent-ink)}}
@media (min-width:1600px){ .qcat button{font-size:12.5px;padding:6px 13px} }
.tip{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:11px;
  padding:10px 13px;margin:8px 0 2px;font-size:12.5px;color:var(--sub);line-height:1.5}
.tip button{flex:none;font-size:12px;font-weight:800;color:var(--accent-ink)}
.note.ro{cursor:default}
.pbar{height:4px;background:var(--fill);border-radius:4px;margin:0 2px 8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);
  transition:width var(--mo-slow) var(--ease)}

.sec{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--sub);
  margin:14px 2px 4px;display:flex;align-items:center;gap:6px}
.must{background:var(--fill);border-radius:12px;padding:4px 8px 6px;margin:10px 0 4px}
.must .sec{margin:6px 2px 2px;color:var(--accent-ink)}

.nudge{background:var(--fill);border-radius:12px;padding:11px 12px;margin:10px 0 4px}
.nudge .h{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5}
.nudge .h span{color:var(--accent-ink)}
.nudge .acts{display:flex;gap:6px;flex-wrap:wrap}
.nudge .acts button{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
@media (hover:hover){.nudge .acts button:hover{border-color:var(--faint);color:var(--ink)}}

.cat{margin-top:12px}
.ch{display:flex;align-items:center;gap:7px;border-radius:8px;cursor:pointer;margin:0 -4px;padding:4px 6px 5px}
@media (hover:hover){.ch:hover{background:var(--fill)}}
.ch .sq{width:9px;height:9px;border-radius:3px;flex:none}
.ch .nm{font-size:12.5px;font-weight:700}
.cat.over{outline:1.5px dashed var(--accent);outline-offset:5px;border-radius:10px}
.qcat button.over{box-shadow:0 0 0 2px var(--accent)}
.qcat button.drag{opacity:.35}
.qcat button[draggable]{cursor:grab}
.ch .edit{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;opacity:0;
  transition:opacity var(--mo-fast) var(--ease)}
@media (hover:hover){.ch:hover .edit{opacity:1}}
@media (hover:none){.ch .edit{opacity:1}}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:9px;padding:6px 2px;border-radius:8px;flex-wrap:wrap;
  transition:background var(--mo-fast) var(--ease),opacity var(--mo-fast) var(--ease)}
li.drag{opacity:.6}
/* 손가락으로 들어 올린 줄 — 원래 자리는 흐리게 남기고, 손가락을 따라오는 사본을 띄운다 */
li.lifted{opacity:.3}
li.ghost .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
li.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px;opacity:.97;
  box-shadow:0 12px 30px rgba(0,0,0,.4);will-change:transform;transform:scale(1.03);transition:none}
/* 끄는 동안에는 화면이 같이 밀리지 않게 하고(스크롤은 가장자리에 대면 저절로), 글자 선택도 막는다 */
html.td{overflow:hidden}
html.td *{user-select:none;-webkit-user-select:none}
html.td #fab{opacity:0;pointer-events:none}
/* 끌어서 순서를 바꿀 때 어디에 놓이는지 — 줄 위/아래에 선 하나 */
li.dropA{box-shadow:inset 0 2px 0 var(--accent)}
li.dropB{box-shadow:inset 0 -2px 0 var(--accent)}
/* 휴대폰에서 할 일을 꾹 누르면 iOS 가 글자 선택(돋보기·복사 메뉴)을 먼저 띄워
   앱의 꾹 누르기를 가로챈다. 달력 칸에는 있던 보호가 할 일 줄에는 없었다.
   글자를 직접 고치는 중일 때만 선택할 수 있게 둔다. */
@media (hover:none){
  li .tx,li .took,li .lag,li .subn{-webkit-touch-callout:none;user-select:none}
  li.editing .tx{-webkit-touch-callout:default;user-select:text}
  /* 500ms 동안 아무 반응이 없으면 고장난 걸로 보인다 — 눌리고 있다는 것만 알려준다 */
  li:active{background:var(--fill);transition-delay:90ms}
}
/* 체크한 그 순간에만. 클래스는 animate() 가 그 render 한 번만 붙인다 */
li.ckd .ck{animation:moCk 140ms var(--ease)}
li.ckd .tx{animation:moFade 190ms var(--ease)}
li.edin{animation:moFade 150ms var(--ease)}
/* 윗줄 버튼도 마찬가지 — 보이는 크기는 그대로 두고 위아래로만 넓힌다.
   (좌우로 넓히면 나란히 선 주/월/년이 서로의 터치를 가져간다) */
@media (hover:none){
  .nav,.chip,.acct,.vseg button,.qcat button{position:relative}
  .nav::after,.chip::after,.iconbtn::after,.acct::after,
  .vseg button::after,.qcat button::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
}
/* 보이는 크기는 그대로 두고 누르는 범위만 넓힌다 — 손가락으로도 빗나가지 않게 */
li .ck,li .st,li .mv,.dnbtn,li .subn,.subs .s .sck,.subs .s .sx{position:relative}
li .ck::before,li .st::before,li .mv::before,.dnbtn::before,li .subn::before,
.subs .s .sck::before,.subs .s .sx::before{content:"";position:absolute;inset:-10px -8px}
li .ck{width:18px;height:18px;border-radius:6px;border:2px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:background-color var(--mo-fast) var(--ease),border-color var(--mo-fast) var(--ease),
             transform var(--mo-fast) var(--ease)}
li .ck:active,.subs .s .sck:active{transform:scale(.9)}
li.done .ck{background:currentColor;border-color:currentColor}
li.done .ck::after{content:"✓";color:var(--card);font-size:11px;font-weight:800;line-height:1}
li.skip .ck{border-style:dashed}
li.skip .ck::after{content:"–";color:var(--faint);font-size:12px;font-weight:800}
li .tx{flex:1;min-width:90px;font-size:15px;outline:none;word-break:break-all;padding:1px 0;color:var(--ink);
  transition:color var(--mo) var(--ease),opacity var(--mo) var(--ease)}
li.editing{background:var(--fill)}
li.editing .tx{box-shadow:inset 0 -1.5px 0 var(--accent);cursor:text}
li.done .tx,li.skip .tx{color:var(--sub);text-decoration:line-through}
li.wait .tx{color:var(--sub)}
li .rp,li .wi{color:var(--faint);flex:none;display:flex;align-items:center;line-height:0}
.ch .edit,.dnbtn{line-height:0;display:flex;align-items:center}
.iconbtn svg,.qadd span svg{display:block}
.lag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;flex:none;
  background:var(--fill);color:var(--sub)}
.lag.hot{background:var(--accent);color:var(--on-accent)}
li .st,li .mv{color:var(--faint);font-size:15px;padding:0 4px;flex:none;line-height:1;
  transition:color var(--mo-fast) var(--ease)}
li .st.on{color:var(--accent-ink)}
@media (hover:hover){li .st:hover,li .mv:hover{color:var(--accent-ink)}}
li .mv{opacity:0;font-weight:800;transition:opacity var(--mo-fast) var(--ease)}
@media (hover:hover){/* 폰에서도 점 세 개(⋯)는 보인다. 꾹 누르기는 '끌어 옮기기'에 쓰고, 메뉴는 이 단추로 연다.
   (꾹 누르기에 메뉴까지 얹으면 우클릭처럼 떠서 끌려던 손이 메뉴를 만난다) */
li:hover .mv{opacity:1}}
@media (hover:none){li .mv{opacity:1}}
.note{flex-basis:100%;margin-left:27px;font-size:11.5px;color:var(--sub);outline:none;
  padding:1px 0 2px;min-height:15px;text-decoration:none!important}
.note:empty::before{content:attr(data-ph);color:var(--faint)}
.note:focus{color:var(--ink)}
li .subn{font-size:10.5px;font-weight:800;color:var(--sub);background:var(--fill);
  border-radius:5px;padding:2px 6px;flex:none;text-decoration:none!important}
@media (hover:hover){li .subn:hover{color:var(--ink)}}
.subs{flex-basis:100%;margin:2px 0 4px 27px;text-decoration:none!important}
.subs .s{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:var(--ink)}
.subs .s.d span{color:var(--sub);text-decoration:line-through}
.subs .s button.sck{width:14px;height:14px;border-radius:4px;border:2px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;color:currentColor}
.subs .s.d button.sck{background:currentColor;border-color:currentColor}
.subs .s.d button.sck::after{content:"✓";color:var(--card);font-size:9px;font-weight:800;line-height:1}
.subs .s span{flex:1;outline:none;word-break:break-all}
.subs .s .sx{color:var(--faint);font-size:13px;padding:0 3px}
@media (hover:hover){.subs .s .sx:hover{color:var(--accent-ink)}}
.subs input{width:100%;border:0;outline:none;background:none;font-size:13px;padding:4px 0 4px 22px;color:var(--ink)}
.subs input::placeholder{color:var(--faint)}
.add{width:100%;border:0;outline:none;background:none;font-size:15px;padding:6px 2px 6px 27px}
.add::placeholder{color:var(--faint)}

/* 끝낸 일은 목록 맨 아래 접어둔다 — Google Tasks·Microsoft To Do 와 같은 자리.
   위로 올리면 '끝낸 일'이 '남은 일'보다 먼저 읽혀 순서가 뒤집힌다.
   대신 흘러가는 꼬리처럼 보이지 않게 위의 분류 제목(.sec)과 같은 무게로 맞춘다. */
.fold{width:100%;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;
  letter-spacing:.3px;color:var(--sub);padding:11px 4px 10px;margin-top:10px;
  border-top:1px solid var(--line);border-radius:0 0 8px 8px}
@media (hover:hover){.fold:hover{color:var(--ink);background:var(--fill)}}
.fold .ar{line-height:0;display:flex;transition:transform var(--mo) var(--ease)}
.fold.open .ar{transform:rotate(180deg)}      /* 펼치면 위를 가리킨다 (접기) */
.fold .k{margin-left:auto;font-weight:800;color:var(--faint);
  background:var(--fill);border-radius:6px;padding:1px 7px;line-height:1.6}
@media (hover:hover){.fold:hover .k{color:var(--sub)}}

.qadd{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:2px 12px;margin-bottom:6px}
.qadd input{flex:1;border:0;outline:none;background:none;font-size:15px;padding:11px 0}
.qadd input::placeholder{color:var(--faint)}
.empty{font-size:13px;color:var(--sub);padding:14px 4px;line-height:1.6}
/* 빈 화면도 안내다 — '아무것도 없는 날'과 '다 끝낸 날'을 구분해서 말한다 */
.dayempty{display:flex;flex-direction:column;gap:3px;padding:16px 4px 10px;font-size:13px;color:var(--sub)}
.dayempty b{font-weight:700;color:var(--ink);font-size:13.5px}
.dayempty.done{flex-direction:row;align-items:center;gap:7px}
.dayempty.done .chk{position:static;flex:none}
li .took{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--fill);
  border-radius:6px;padding:1px 6px;flex:none;white-space:nowrap}

.res{padding:10px 2px;border-bottom:1px solid var(--line)}
.res .t{font-size:15px;font-weight:700;margin-bottom:3px}
.res .last{font-size:12px;color:var(--accent-ink);font-weight:700}
.res .last.none{color:var(--faint)}
.res .hist{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.res .hist div{display:flex;gap:8px}
.res .hist b{font-weight:700;cursor:pointer;flex:none}
@media (hover:hover){.res .hist b:hover{color:var(--accent-ink);text-decoration:underline}}
.res .hist i{font-style:normal;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .open{font-size:11.5px;color:var(--sub);margin-top:4px}
.res .again{font-size:11.5px;font-weight:700;color:var(--accent-ink);margin-top:7px;
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
@media (hover:hover){.res .again:hover{border-color:var(--accent)}}

.tiles{display:flex;gap:8px;margin:8px 0 4px}
.tile{flex:1;background:var(--fill);border-radius:12px;padding:12px 10px;text-align:center}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
.tile span{font-size:10.5px;font-weight:700;color:var(--sub)}
.barrow{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:13px}
.barrow .nm{width:78px;flex:none;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bg{flex:1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.barrow .bg i{display:block;height:100%;border-radius:4px}
.barrow .v{width:28px;text-align:right;font-size:12px;color:var(--sub);font-weight:700}

/* ── 빠른 이동 메뉴 ── */
#menu{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:13px;box-shadow:0 12px 34px rgba(0,0,0,.24);padding:6px;min-width:184px;
  animation:moMenu 140ms var(--ease)}
/* 닫히는 동안에도 클릭을 먹지 않게 — 안 보이는 판이 남으면 다음 클릭이 사라진다 */
#menu.closing{opacity:0;transform:translateY(-2px) scale(.99);pointer-events:none;animation:none;
  transition:opacity 110ms var(--ease),transform 110ms var(--ease)}
#menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  font-size:13.5px;font-weight:600;text-align:left}
@media (hover:hover){#menu button:hover{background:var(--fill)}}
#menu button .k{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700}
#menu .sep{height:1px;background:var(--line);margin:5px 4px}
#menu input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);outline:none;font-size:13px;margin:2px 0}
#menu .rm,#sheet .rm{color:var(--danger)}
.mh{padding:9px 10px 7px;font-size:13.5px;font-weight:800;display:flex;
  align-items:baseline;gap:8px;flex-wrap:wrap}
.mh span{font-size:11.5px;font-weight:700;color:var(--sub)}
#menu input[type=date],#sheet input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);outline:none;font-size:13px;margin:2px 0}

#sheetWrap{position:fixed;inset:0;z-index:25}
.sbd{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:moFade 150ms var(--ease)}
/* 바닥 시트 — Material 3 의 기준을 따른다: 위쪽 모서리 28px · 손잡이 32×4 · 최대 폭 640px · 줄 높이 48px 이상.
   (이전엔 모서리 20px·손잡이 없음·줄마다 같은 글자 크기로 이어져 딱딱했다) */
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);
  border-radius:28px 28px 0 0;padding:0 12px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 34px rgba(0,0,0,.3);animation:moSheet 200ms var(--ease);
  max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@supports (height:1dvh){ #sheet{max-height:88dvh} }
/* 시트는 이미 화면 아래에 붙어 있다 — 200px 씩 올라올 이유가 없다 */
#sheetWrap.closing{pointer-events:none}
#sheetWrap.closing .sbd{opacity:0;animation:none;transition:opacity 150ms var(--ease)}
#sheetWrap.closing #sheet{opacity:0;transform:translateY(10px);animation:none;
  transition:opacity 150ms var(--ease),transform 150ms var(--ease)}
/* 손잡이 — 아래로 끌면 닫힌다. 이 영역과 머리만 끌 수 있게 해서 목록 스크롤과 겹치지 않는다 */
.grab{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:10px 0 4px;
  margin:0 -12px;background:var(--card);border-radius:28px 28px 0 0;touch-action:none}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--faint);opacity:.5}
/* 머리: 어떤 할 일의 메뉴인지 — 분류 색 점 + 제목(두 줄까지) + 날짜·분류 */
.sh-head{display:flex;align-items:center;gap:12px;padding:6px 4px 14px;touch-action:none}
.sh-head .dot{width:11px;height:11px;border-radius:4px;flex:none}
.sh-head .ttl{flex:1;min-width:0}
.sh-head .ttl b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  font-size:17px;font-weight:800;line-height:1.35;letter-spacing:-.2px}
.sh-head .ttl span{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-top:3px}
#sheet .sh-head .x{width:40px;height:40px;min-height:0;padding:0;justify-content:center;border-radius:50%;
  flex:none;color:var(--sub)}
.qlbl{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:var(--faint);padding:0 6px 8px}
/* 빠른 날짜 — Todoist·TickTick 처럼 메뉴 맨 위에 '내일 · 모레 …' 를 타일로 */
.qgrid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:0 0 8px}
#sheet .qt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:auto;min-height:62px;padding:8px 2px;border-radius:16px;background:var(--fill);
  font-size:14px;font-weight:700;text-align:center;color:var(--ink);cursor:pointer;user-select:none}
#sheet .qt small{font-size:11px;font-weight:600;color:var(--faint)}
#sheet .qt svg{color:var(--sub)}
#sheet .qt:active{background:var(--line)}
/* '날짜 선택' 타일 위에 날짜 입력을 투명하게 깔아 둔다 — 누르면 곧바로 달력이 열린다 */
#sheet label.qt input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
/* 항목 줄 — 아이콘 + 글자, 높이 52px */
#sheet button{display:flex;width:100%;align-items:center;gap:14px;min-height:52px;padding:0 12px;
  border-radius:14px;font-size:15.5px;font-weight:600;text-align:left}
#sheet button:active{background:var(--fill)}
#sheet button svg{flex:none;color:var(--sub)}
#sheet button .k{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;
  color:var(--faint);font-weight:600}
#sheet button .k svg{color:var(--faint)}
#sheet .rm,#sheet .rm svg{color:var(--danger)}
#sheet .sep{height:1px;background:var(--line);margin:6px 8px;opacity:.8}
#sheet .ogrid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:8px 0 2px}
#sheet .ob{justify-content:center;gap:8px;min-height:48px;background:var(--fill);border-radius:14px;font-size:14.5px}
#sheet .cdot{width:12px;height:12px;border-radius:4px;flex:none;margin:0 4px}
#sheet .cdot.none{border:1.5px dashed var(--faint)}
/* 날짜 시트(달력 칸을 꾹 눌렀을 때)의 머리도 같은 결로 */
#sheet .mh{padding:4px 6px 12px;font-size:17px;font-weight:800;flex-direction:column;align-items:flex-start;gap:3px}
#sheet .mh span{font-size:12.5px}
#sheet input[type=date]{width:100%;min-height:52px;padding:0 14px;margin:6px 0;border:1px solid var(--line);
  border-radius:14px;background:var(--bg);font-size:15px;outline:none}

/* ── 다이얼로그: 화면이 넓으면 넓게 ── */
dialog{border:1px solid var(--line);border-radius:18px;padding:20px;width:min(88vw,340px);
  background:var(--card);color:var(--ink);max-height:86vh;box-shadow:0 18px 50px rgba(0,0,0,.28)}
dialog[open]{animation:moDlg 200ms var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(2px);animation:moFade 150ms var(--ease)}
/* 닫는 쪽은 조금 빠르게. 다 사라진 뒤에 실제로 닫는다 (closeDlg 가 시간을 맞춘다) */
dialog.closing{opacity:0;transform:translateY(2px) scale(.99);pointer-events:none;animation:none;
  transition:opacity 130ms var(--ease),transform 130ms var(--ease)}
dialog.closing::backdrop{opacity:0;transition:opacity 130ms var(--ease);animation:none}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 14px;font-size:12.5px;color:var(--sub);line-height:1.55}
dialog input[type=text],dialog input[type=email],dialog input[type=password],
dialog input[type=number],dialog input[type=time],dialog select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);outline:none;margin-bottom:9px;font-size:14px}
dialog input:focus,dialog select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:4px}
.row button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700}
.primary{background:var(--accent);color:var(--on-accent)}
.plain{background:var(--fill);color:var(--sub)}
.alt{display:flex;justify-content:space-between;margin-top:11px;gap:10px}
.alt button{font-size:12px;color:var(--sub);text-decoration:underline;text-align:left}

.grp{margin-bottom:15px;min-width:0}
.lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--sub);margin-bottom:7px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;background:var(--fill);font-size:12.5px;
  font-weight:700;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:28px;height:28px;border-radius:9px;border:2.5px solid transparent;
  transition:transform var(--mo-fast) var(--ease),border-color var(--mo-fast) var(--ease)}
@media (hover:hover){.sw button:hover{transform:scale(1.12)}}
.sw button.on{border-color:var(--ink)}
.sw.big{gap:9px;margin-bottom:6px}
.sw.big button{width:34px;height:34px;border-radius:11px;position:relative}
.sw.big button.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:15px;font-weight:800;
  text-shadow:0 0 3px rgba(0,0,0,.6)}
.sw input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;
  background:none;padding:2px;cursor:pointer}
.danger{color:var(--danger);font-weight:700}
.danger.armed{background:var(--danger);color:var(--bg);padding:5px 10px;border-radius:8px;text-decoration:none}
.preview{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--fill);
  border-radius:10px;margin-bottom:12px;font-size:13.5px;font-weight:700}
.preview .sq{width:10px;height:10px;border-radius:3px;flex:none}
.scroll{max-height:54vh;overflow-y:auto;margin:0 -4px;padding:0 12px 0 4px}
/* 휴대폰에서는 위아래가 240px 씩 비는데 안쪽만 굴러가고 있었다 */
@media (max-width:899px){ .scroll{max-height:64vh} }
.hint{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:8px;
  overflow-wrap:break-word;word-break:keep-all}
.ver{font-size:10.5px;color:var(--sub);text-align:right;margin-top:8px}
/* 동기화가 되고 있는지 한 줄로 — '왜 안 되지'를 추측하지 않게 */
.syncline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin:-4px 2px 10px}
.syncline i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.syncline i.on{background:#2f8f5b;box-shadow:0 0 0 3px rgba(47,143,91,.18)}
.syncline span{margin-left:auto}
.cfgsec{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--sub);
  margin:16px 2px 8px;text-transform:uppercase}
.cfgsec:first-child{margin-top:2px}
.snaps{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.snap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.snap span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{font-size:12.5px;color:var(--accent-ink);font-weight:600;margin:2px 0 8px;line-height:1.5}
.ok{color:#2f8f6b}

@media (min-width:900px){
  dialog{width:min(86vw,560px);padding:26px 28px;border-radius:22px}
  dialog h3{font-size:19px;margin-bottom:6px}
  dialog p{font-size:13px;margin-bottom:18px}
  dialog input[type=text],dialog input[type=email],dialog input[type=password],
  dialog input[type=number],dialog input[type=time],dialog select{padding:12px 14px;font-size:14.5px}
  .row button{padding:13px;font-size:14.5px}
  .scroll{max-height:58vh;padding-right:14px}
  .seg button{padding:11px 6px;font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .grid2 .wide{grid-column:1 / -1}
  .hint{font-size:12px}
  #menu{min-width:210px}
  #menu button{padding:10px 12px;font-size:14px}
}

.rt{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.rt .sq{width:9px;height:9px;border-radius:3px;flex:none}
.rt .t{flex:1;font-size:14px}
.rt .d{font-size:11px;color:var(--sub);flex:none}
.rt .x{color:var(--faint);padding:0 4px}
@media (hover:hover){.rt .x:hover{color:var(--accent-ink)}}
.days{display:flex;gap:5px;margin-bottom:9px}
.days button{flex:1;padding:8px 0;border-radius:8px;background:var(--fill);font-size:12px;
  font-weight:700;color:var(--sub)}
.days button.on{background:var(--accent);color:var(--on-accent)}
.impbox{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  color:var(--sub);font-size:13px;cursor:pointer;line-height:1.7}
@media (hover:hover){.impbox:hover{border-color:var(--accent);color:var(--ink)}}
.impstat{background:var(--fill);border-radius:12px;padding:14px;margin:12px 0;font-size:13px;line-height:1.9}
.impstat b{font-size:16px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;display:flex;
  align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:11px 16px;
  border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);
  animation:moToast var(--mo) var(--ease);max-width:min(90vw,420px)}
.toast button{color:var(--bg);text-decoration:underline;font-weight:800;flex:none;opacity:.9}
@media (hover:hover){.toast button:hover{opacity:1}}
/* 화면이 넓어지면 여백만 늘리지 말고 글자·칸도 같이 키운다 */
@media (min-width:1280px){
  #app{max-width:1320px;grid-template-columns:1fr 430px;gap:0 24px}
  .cell{min-height:84px}
  .cell .n{font-size:15px}
  .e{font-size:11px}
  .bar2 h1{font-size:34px}
  li .tx{font-size:15.5px}
  .dh b{font-size:18px}
}
@media (min-width:1600px){
  #app{max-width:1560px;grid-template-columns:1fr 480px;padding:32px 28px 48px}
  .panel{border-radius:18px;padding:20px}
  .cell{min-height:96px;border-radius:18px}
  .cell .n{font-size:16px}
  .cell .hn{font-size:10px}
  .e{font-size:12px;padding:2px 5px}
  .wk span{font-size:12.5px}
  .grid{gap:9px}
  .bar2 h1{font-size:38px}
  .bar2 h1 small{font-size:15px}
  .chip{font-size:13px;padding:7px 12px}
  li{padding:9px 2px}
  li .tx{font-size:16.5px}
  li .ck{width:20px;height:20px}
  .dh b{font-size:20px}
  .dh .meta{font-size:13.5px}
  .qadd.main input{font-size:16.5px;padding:13px 0}
  .sec{font-size:11.5px}
  .brand{font-size:17px}
  .iconbtn{width:38px;height:38px;font-size:17px}
  .acct{font-size:13.5px;max-width:200px}
  #fab{width:58px;height:58px;font-size:23px;right:26px;bottom:26px}
}
/* ── 손가락용 터치 크기 ──
   CSS 는 같은 강도면 뒤에 있는 것이 이긴다. 그래서 앞에서 정한 '눌리는 범위'를 고치는 규칙은
   반드시 스타일시트 끝에 둔다 (앞에 두었더니 조용히 덮여서 아무 일도 하지 않았다).
   보이는 크기는 그대로, 눌리는 범위만 바꾼다. */
@media (hover:none){
  /* 줄 오른쪽의 ☆ 와 ⋯ 는 딱 붙어 있다. 같은 크기로 사방을 넓히면 뒤에 있는 ⋯ 가 ☆ 의 오른쪽 반을 가져간다.
     그래서 각자 '바깥쪽'으로만 넓히고 세로는 44px 근처까지 키운다. */
  html li .ck::before{inset:-14px -10px -14px -14px}
  html li .st::before{inset:-14px 0 -14px -14px}
  html li .mv::before{inset:-14px -14px -14px 0}
  li{padding-top:7px;padding-bottom:7px}
  .nav::after{left:-7px;right:-7px}                      /* ‹ › 는 좌우가 좁았다 */
  .ymt{position:relative}
  .ymt::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-4px}   /* 1년 화면의 월 이름 */
  .tip button{padding:10px 6px}                          /* '알겠어요' 는 높이 18px 였다 */
  .sw button{width:34px;height:34px}                     /* 강조색 견본 */
  input[type=range]{height:32px}                         /* 불투명도 슬라이더 */
  #accHex{padding:10px 9px!important}
}

/* 움직임을 줄여달라고 설정한 사람에게는 주지 않는다. 기능은 하나도 달라지지 않는다. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;
    transition-duration:1ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}
}
@media (min-width:1900px){
  #app{max-width:1760px;grid-template-columns:1fr 540px}
  .cell{min-height:108px}
  .e{font-size:12.5px}
  li .tx{font-size:17.5px}
  .bar2 h1{font-size:42px}
}
/* 창이 세로로 넉넉하면 달력 칸이 그만큼 자란다 — 설치 앱 창(약 930×1000)에서 아래가 텅 비던 것을 메운다.
   (머리글·여백·요일줄 ≈ 280px 를 뺀 높이를 줄 수로 나눈다. 너무 작거나 커지지 않게 한도를 둔다.) */
@media (min-width:720px){
  /* 칸이 세로로만 길어진 기둥처럼 되지 않게, 칸 너비의 1.2배를 넘기지 않는다 */
  #cal{container-type:inline-size}
  #cal .cell{min-height:clamp(62px, min(calc((100dvh - 280px) / var(--rows,6) - 6px), calc((100cqw - 36px) / 7 * 1.2)), 168px)}
  #cal .cell .n{font-size:15px}
}
@media (min-width:1600px){ #cal .cell .chk{width:30px;height:30px} }
/* ── 첫 화면: 로고가 써지고 → 로그인 → 앱이 켜지듯 열린다 ── */
html.gating body > :not(#gate):not(script){visibility:hidden}
#gate{position:fixed;inset:0;z-index:3000;background:var(--bg);overflow-y:auto;
  display:flex;transition:opacity .55s var(--ease)}
#gate[hidden]{display:none}
#gate.out{opacity:0;pointer-events:none}
.g-in{margin:auto;width:100%;max-width:380px;padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center}
.g-logo{width:min(78vw,340px);height:auto;overflow:visible;transition:width .7s var(--ease)}
.g-logo text{font-family:inherit}
.g-logo .a{color:var(--ink)} .g-logo .b{color:var(--accent)}
.g-logo tspan{fill:transparent;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;
  stroke-dasharray:480;stroke-dashoffset:480;
  animation:gdraw .85s cubic-bezier(.4,.1,.3,1) forwards, gfill .55s ease forwards;
  animation-delay:calc(var(--i) * .11s + .1s), calc(var(--i) * .11s + .85s)}
@keyframes gdraw{to{stroke-dashoffset:0}}
@keyframes gfill{to{fill:currentColor;stroke-width:.4}}
#gate.static .g-logo tspan,
#gate.reduce .g-logo tspan{animation:none;fill:currentColor;stroke-width:.4;stroke-dashoffset:0}
#gate.show-card .g-logo{width:min(54vw,220px)}
.g-card{width:100%;max-height:0;opacity:0;overflow:hidden;transform:translateY(8px);
  transition:max-height .7s var(--ease),opacity .5s var(--ease) .1s,transform .6s var(--ease) .1s;
  visibility:hidden}
#gate.show-card .g-card{max-height:520px;opacity:1;transform:none;visibility:visible;margin-top:26px}
.g-card input[type=email],.g-card input[type=password]{display:block;width:100%;box-sizing:border-box;
  margin:0 0 10px;padding:14px 15px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;outline:none;transition:border-color .15s var(--ease)}
.g-card input:focus{border-color:var(--accent)}
.g-err{font-size:13px;color:var(--danger);margin:0 2px 10px;line-height:1.45}
.g-err.ok{color:var(--accent-ink)}
.g-auto{display:flex;align-items:center;gap:9px;margin:4px 2px 14px;font-size:14px;color:var(--sub);cursor:pointer;user-select:none}
.g-auto input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.g-go{display:block;width:100%;padding:14px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:14px;
  background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .12s var(--ease),opacity .15s}
.g-go:active{transform:scale(.98)} .g-go:disabled{opacity:.6}
.g-alt{display:flex;justify-content:space-between;margin:14px 2px 0}
.g-alt button,.g-guest{background:none;border:0;padding:8px 2px;font:inherit;font-size:14px;color:var(--sub);cursor:pointer}
.g-guest{display:block;margin:6px auto 0;font-size:13px;color:var(--faint)}
@media (hover:hover){.g-alt button:hover,.g-guest:hover{color:var(--ink)}}
/* 앱이 '켜지듯' 열린다 */
html.entering #app,html.entering #fab{animation:appIn .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .g-card,.g-logo,#gate{transition:none} html.entering #app,html.entering #fab{animation:none} }

/* ── 월 달력 A안: 칸·틀 없이 숫자만. 끝낸 날은 분류 색으로 칠한 원 + 작은 ✓ ── */
#cal{--disc:34px}
#cal:has(> .grid){background:none;border:0;box-shadow:none;padding-left:2px;padding-right:2px}
#cal .grid{gap:0}
#cal .cell{background:none;border:0;border-radius:0;overflow:visible;min-height:52px;padding:4px 0 2px;justify-content:flex-start}
#cal .cell .n{width:var(--disc);height:var(--disc);min-width:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;line-height:1;position:relative;background:var(--tc,transparent);transition:background var(--mo-fast) var(--ease)}
#cal .cell.out .n{font-weight:500}
#cal .cell.today .n{background:var(--accent)!important;color:var(--on-accent)!important;font-weight:800}
#cal .cell.sel .n{outline:1.5px solid var(--ink);outline-offset:2px}
#cal .cell.sel{border:0}
@media (hover:hover){
  #cal .cell:hover{background:none}
  #cal .cell:not(.today):not(.tint):hover .n{background:var(--fill)}
}
#cal .cell:active .n{transform:scale(.94)}
#cal .cell.over{outline:2px dashed var(--accent);outline-offset:-3px;border-radius:12px;background:none}
#cal .cell.fin .mk{display:none}
#cal .cell .mk{height:8px;margin-top:3px}
#cal .cell .mk i{width:4px;height:4px}
/* ✓ — 숫자 원 오른쪽 아래의 작은 배지. 일부만 끝낸 날(미룬 것이 남은 날)은 옅게 */
#cal .cell .n .chk{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;padding:3px;margin:0;
  border:0;border-radius:50%;background:var(--ink);color:var(--bg)}
#cal .cell .n .chk path{stroke-width:3.2}
#cal .cell.fin.soft .n .chk{opacity:.55}
#cal .cell.today .n .chk{background:var(--ink);color:var(--bg)}
#cal .cell.tint.out{opacity:.5}
@media (min-width:720px){
  #cal{--disc:36px}
  #cal .cell{min-height:clamp(56px, calc((100dvh - 300px) / var(--rows,6)), 112px);padding-top:6px}
  #cal .cell .mk i{width:5px;height:5px}
}
@media (min-width:1000px){
  #cal{--disc:40px}
  #cal .cell .n{font-size:16px}
  #cal .cell .n .chk{width:17px;height:17px;padding:3.5px}
  #cal .cell .hn{font-size:9.5px;margin-top:2px}
}
@media (min-width:1600px){
  #cal{--disc:46px}
  #cal .cell .n{font-size:18px}
  #cal .cell .n .chk{width:19px;height:19px}
}

/* ── PC(720px~): 칸이 넓어서 원 하나로는 허전하다 — 부드러운 타일로 다듬는다.
   숫자는 왼쪽 위, 점은 왼쪽 아래, 끝낸 날은 타일이 분류 색 띠로 물들고 ✓ 가 오른쪽 위에 선다 ── */
@media (min-width:720px){
  #cal .grid{gap:7px}
  #cal .cell{align-items:flex-start;border:1.5px solid transparent;border-radius:16px;background:var(--card);
    padding:9px 11px 9px;min-height:clamp(74px, calc((100dvh - 300px) / var(--rows,6) - 7px), 128px);
    transition:border-color var(--mo-fast) var(--ease),background var(--mo-fast) var(--ease)}
  #cal .cell.out{background:none}
  #cal .cell.tint{background:var(--tl)}
  #cal .cell .n{width:auto;height:auto;min-width:28px;min-height:28px;padding:0 4px;box-sizing:border-box;border-radius:14px;
    position:static;background:none;justify-content:flex-start;font-size:15px}
  #cal .cell.today .n{width:28px;height:28px;padding:0;justify-content:center;border-radius:50%}
  #cal .cell.sel{border:1.5px solid var(--ink)}
  #cal .cell.sel .n{outline:0}
  #cal .cell .hn{margin:2px 0 0 4px;max-width:100%}
  #cal .cell .mk{margin-top:auto;justify-content:flex-start;padding-left:4px;height:10px}
  #cal .cell .mk i{width:6px;height:6px}
  #cal .cell .mk b{font-size:10.5px}
  #cal .cell .n .chk{position:absolute;right:10px;top:8px;bottom:auto;width:26px;height:26px;padding:0;background:none;
    color:var(--ink)}
  #cal .cell.fin .n .chk path{stroke-width:2.8}
  #cal .cell.today .n .chk{background:none;color:var(--ink)}
  #cal .cell.fin.soft .n .chk{opacity:.5}
  #cal .cell.over{outline:0;border:1.5px dashed var(--accent)}
}
@media (hover:hover) and (min-width:720px){
  #cal .cell:hover{background:var(--card);border-color:var(--line)}
  #cal .cell.tint:hover{background:var(--tl);border-color:var(--line)}
  #cal .cell.out:hover{background:none;border-color:transparent}
  #cal .cell:not(.today):not(.tint):hover .n{background:none}
}
@media (min-width:1000px){
  #cal .grid{gap:9px}
  #cal .cell{border-radius:18px;padding:11px 13px 11px}
  #cal .cell .n{font-size:16px}
  #cal .cell .n .chk{width:30px;height:30px;right:12px;top:10px}
}
@media (min-width:1600px){
  #cal .grid{gap:11px}
  #cal .cell{border-radius:20px;padding:13px 15px 13px}
  #cal .cell .n{font-size:18px;min-width:32px;min-height:32px}
  #cal .cell.today .n{width:32px;height:32px}
  #cal .cell .n .chk{width:34px;height:34px}
}

/* ── 1년: 아직 할 일이 남은 날은 숫자 아래 점 ── */
.yd.has{padding-bottom:6px}
.yd.has::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;
  border-radius:50%;background:currentColor;opacity:.9}
.ylegend .yhas{display:inline-flex;align-items:center;gap:5px;margin-left:8px}
.ylegend .yhas u{display:block;width:5px;height:5px;border-radius:50%;background:var(--sub)}

/* ── 주간: 하루가 한 줄. 왼쪽에 날짜, 오른쪽에 그날 할 일. 비어 있는 날은 낮게 ── */
#cal:has(> .week){background:none;border:0;box-shadow:none;padding:0}
.week{display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:2px 12px;align-items:start;
  min-height:58px;padding:11px 14px 11px 10px;background:var(--card);border:1.5px solid transparent;border-radius:16px;
  cursor:pointer;user-select:none;-webkit-touch-callout:none;
  transition:border-color var(--mo-fast) var(--ease),background var(--mo-fast) var(--ease)}
@media (hover:hover){ .wcard:hover{background:var(--card);border-color:var(--line)} }
.wcard.today{background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.wcard.sel{border-color:var(--ink)}
.wcard.over{border-color:var(--accent);border-style:dashed}
.wcard .wh{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wcard .wd{font-size:11.5px;font-weight:700;color:var(--nc,var(--sub));line-height:1}
.wcard .wn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;line-height:1;position:relative;color:var(--nc,var(--ink));background:var(--tc,transparent)}
#cal .wcard.today .wn{background:var(--accent);color:var(--on-accent)!important;font-weight:800}
.wcard.empty .wn{font-weight:600}
.wcard .wn::after{display:none}
.wcard .wn .chk{position:absolute;right:-5px;top:-2px;bottom:auto;width:15px;height:15px;padding:3px;margin:0;border:0;
  border-radius:50%;background:var(--ink);color:var(--bg)}
.wcard .wn .chk path{stroke-width:3.2}
.wcard.fin.soft .wn .chk{opacity:.55}
.wcard .wl{display:flex;flex-direction:column;gap:6px;min-width:0;overflow:visible;white-space:normal;align-items:stretch;
  padding-top:2px}
.wcard .whn{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--sun);margin:0}
.wcard .none{grid-column:1/-1;font-size:13px;font-weight:500;color:var(--faint);padding:7px 0}
.wcard .wl .e{display:flex;align-items:center;gap:9px;min-width:0;padding:0;border:0;font-size:14.5px;line-height:1.35;
  font-weight:500;color:var(--ink);opacity:1;text-decoration:none;white-space:nowrap;overflow:visible}
.wcard .wl .e i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.wcard .wl .e .et{min-width:0;overflow:hidden;text-overflow:ellipsis}
.wcard .wl .e .star{flex:none;font-size:12px;color:var(--accent-ink)}
.wcard .wl .e.done .et{text-decoration:line-through;text-decoration-thickness:1px;color:var(--sub)}
.wcard .wl .e.done i{opacity:.4}
.wcard .wl .e[data-i="4"],.wcard .wl .e[data-i="5"]{display:none}
.wcard .wl .more{grid-column:1/-1;display:block;font-size:12px;font-weight:700;color:var(--sub);padding:0 0 0 17px;margin:0}
.wcard .wl .more.d{display:none}
.wcard .wleft{align-self:center;font-size:13px;font-weight:800;color:var(--ink);background:var(--fill);border-radius:999px;
  padding:3px 10px;white-space:nowrap;line-height:1.4}
.wcard .wleft small{font-size:11px;font-weight:700;color:var(--sub);margin-left:3px}
@media (min-width:720px){
  .week{gap:8px;min-height:calc(100dvh - 232px)}
  .wcard{flex:1 1 auto;grid-template-columns:62px minmax(0,1fr) auto;gap:2px 18px;align-items:center;
    min-height:62px;padding:12px 20px 12px 14px;border-radius:18px}
  .wcard .wh{gap:4px}
  .wcard .wd{font-size:12.5px}
  .wcard .wn{width:40px;height:40px;font-size:17px}
  .wcard .wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px 24px;padding:0}
  .wcard .wl .e{font-size:15px}
  .wcard .wl .e[data-i="4"],.wcard .wl .e[data-i="5"]{display:flex}
  .wcard .wl .more.m{display:none}
  .wcard .wl .more.d{display:block}
  .wcard .wleft{font-size:13.5px;padding:4px 12px}
}

/* ── 다듬기 ── */
@media (max-width:420px){ .bar2 h1 small.ky{display:inline} }
/* 이전·다음 달 날짜도 읽혀야 한다 — 흐리게 하되 숫자는 진하게 */
#cal .cell.tint.out{opacity:.78}
#cal .cell.out.tint .n{color:var(--ink)}
/* 1년: 할 일 없는 날은 칸 없이 숫자만. 있는 날만 색·점으로 말한다 */
.yd{background:none}
.yd.has::after{width:6px;height:6px;margin-left:-3px;bottom:2px;background:var(--ink);opacity:.7}
.yd.a3.has::after{background:var(--on-accent);opacity:.9}
/* PC 에서는 12개월이 스크롤 없이 한 화면에 들어온다 */
@media (min-width:900px){
  .year{gap:16px 20px}
  .yd{aspect-ratio:auto;height:clamp(20px, calc((100dvh - 470px) / 18), 34px);min-height:0}
}
@media (min-width:1000px){
  .year{grid-template-columns:repeat(6,1fr);gap:20px 22px}
  .yd{height:clamp(20px, calc((100dvh - 420px) / 12), 36px);font-size:12px}
  .ylegend .n{margin-left:14px}
}
/* 주간: 비어 있는 날은 한 줄로 낮게 (폰) */
@media (max-width:719px){
  .wcard.empty{min-height:0;padding:8px 14px 8px 10px;align-items:center}
  .wcard.empty .wh{flex-direction:row;gap:3px}
  .wcard.empty .wn{width:28px;height:28px;font-size:14px}
  .wcard.empty .none{padding:0}
}

/* ── 화면 전환: 옛 화면과 새 화면이 겹쳐 흐른다 ── */
#cal{view-transition-name:cal}
#side{view-transition-name:side}
html[data-vt]::view-transition-group(*),html[data-vt]::view-transition-old(*),html[data-vt]::view-transition-new(*){
  animation-duration:300ms;animation-timing-function:var(--ease)}
html[data-vt=pick]::view-transition-group(*),html[data-vt=pick]::view-transition-old(*),html[data-vt=pick]::view-transition-new(*){
  animation-duration:200ms}
@keyframes vtRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vtOutL{to{opacity:0;transform:translateX(-32px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes vtOutR{to{opacity:0;transform:translateX(32px)}}
@keyframes vtInR{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
html[data-vt=swap]::view-transition-new(cal),html[data-vt=swap]::view-transition-new(side){animation-name:vtRise}
html[data-vt=next]::view-transition-old(cal){animation-name:vtOutL}
html[data-vt=next]::view-transition-new(cal){animation-name:vtInL}
html[data-vt=prev]::view-transition-old(cal){animation-name:vtOutR}
html[data-vt=prev]::view-transition-new(cal){animation-name:vtInR}
html[data-vt=next]::view-transition-new(side),html[data-vt=prev]::view-transition-new(side){animation-name:vtRise}
@media (prefers-reduced-motion:reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important} }
</style>

/* 크롬·삼성 인터넷이 '설치할 수 있다'고 알려주는 이벤트. 동기화 라이브러리를 기다리는 동안
   지나가 버리지 않게 모듈 맨 위에서 받는다. */
/* 설치한 PC 앱 창이 작게 열리는 경우 — 처음 한 번만 알맞은 크기로 키운다.
   그 뒤의 창 크기는 브라우저가 기억하므로, 사용자가 줄여 놓은 것은 건드리지 않는다. */
(function(){
  try{
    if(!matchMedia('(display-mode: standalone)').matches || matchMedia('(hover:none)').matches) return;
    if(sessionStorage.getItem('daynua.sized')) return;      // 이 창에서는 한 번만 — 새로고침해도 다시 줄이지 않는다
    sessionStorage.setItem('daynua.sized', '1');
    const aw = screen.availWidth, ah = screen.availHeight;
    if(outerWidth >= aw - 16 && outerHeight >= ah - 16) return;   // 최대화 상태면 그대로
    const W = Math.min(1320, aw - 40), H = Math.min(860, ah - 20);
    if(W < 720 || H < 560) return;                                // 화면이 작으면 그대로
    resizeTo(W, H);
    moveTo((screen.availLeft || 0) + Math.round((aw - W) / 2), (screen.availTop || 0) + Math.round((ah - H) / 2));
  }catch{}
})();

/* ─── 순수 함수 (#test 로 자가검사) ─── */
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dOf = k => new Date(k + 'T00:00:00');
const isDateKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
const shift = (k, n) => { const d = dOf(k); d.setDate(d.getDate()+n); return key(d); };
const daysBetween = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);

/* ‹ › 의 뜻은 보기마다 다르다 — 주는 ±7일, 월은 ±1달, 년은 ±1년.
   달·해를 옮길 때 날짜를 1일로 맞춘다 (1월 31일에서 +1달 하면 3월로 튀는 걸 막는다).
   해를 넘길 때도 '보던 달'은 유지한다 — 년에서 월로 돌아올 자리가 되도록. */
function stepPeriod(view, d, n){
  if(view === 'week') return dOf(shift(key(d), n * 7));
  if(view === 'year') return new Date(d.getFullYear() + n, d.getMonth(), 1);
  return new Date(d.getFullYear(), d.getMonth() + n, 1);
}
/* 뒤로 미룬 것만 '미룬 횟수'로 센다 — 떠오른 일에서 날짜를 정하거나 앞당기는 건 미룬 게 아니다 */
const isPostpone = (from, to) =>
  isDateKey(from) && (to === 'later' || (isDateKey(to) && to > from));

/* 1년 화면의 색 단계 — '그날 끝낸 일의 수'만 말한다 (성적이 아니다) */
const actLevel = n => n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : 3;

/* 그 날이 속한 주의 첫날 — 주 시작 요일 설정을 따른다 */
function weekStart(k, ws = 0){
  const d = dOf(k);
  d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7));
  return key(d);
}
const weekGrid = (k, ws = 0) => { const s0 = weekStart(k, ws);
  return Array.from({length:7}, (_, i) => shift(s0, i)); };

function monthGrid(y, m, ws = 0){
  const lead = (new Date(y,m,1).getDay() - ws + 7) % 7;
  const days = new Date(y,m+1,0).getDate();
  return Array.from({length:Math.ceil((lead+days)/7)*7}, (_,i)=>new Date(y,m,1-lead+i));
}
function yearGrid(y, ws = 0){
  const d = new Date(y,0,1);
  d.setDate(d.getDate() - ((d.getDay()-ws+7)%7));
  const end = new Date(y,11,31), out = [];
  while(d<=end || ((d.getDay()-ws+7)%7)!==0){ out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function lagDays(fromK, toK, offSet){            // 주말·공휴일은 빼고 센다
  let n = 0;
  const d = dOf(fromK), end = dOf(toK);
  for(d.setDate(d.getDate()+1); d<=end; d.setDate(d.getDate()+1)){
    const w = d.getDay();
    if(w===0 || w===6 || offSet.has(key(d))) continue;
    n++;
  }
  return n;
}
/* 못 끝낸 일은 오늘로 따라온다. 반복(r)·건너뜀(sk)은 그날에 남기고,
   기다리는 일(w)은 따라오되 '놓침'으로는 세지 않는다. */
function rollover(todos, miss, todayK){
  let moved = 0;
  for(const k of Object.keys(todos)){
    if(!isDateKey(k) || k >= todayK) continue;
    const movers = todos[k].filter(t => !t.d && !t.r && !t.sk);
    if(!movers.length) continue;
    const rest = todos[k].filter(t => t.d || t.r || t.sk);
    if(rest.length) todos[k] = rest; else delete todos[k];
    for(const t of movers){ t.mv = (t.mv||0)+1; t.mvd = todayK; }
    (todos[todayK] ||= []).push(...movers);
    const missed = movers.filter(t => !t.w).length;
    if(missed) miss[k] = (miss[k]||0) + missed;
    moved += movers.length;
  }
  return moved;
}
/* 하루를 한 번만 센다. 달력 ✓ · 주간 ✓ · 진행 막대 · 알림 · 날짜 메뉴 · 기록이 전부 이걸 쓴다.
   '기다리는 중'은 지금 내가 할 수 있는 일이 아니므로 남은 일에도 분모에도 넣지 않는다. */
function daySummary(list, miss = 0){
  let done = 0, actionable = 0, waiting = 0, skipped = 0;
  for(const t of list){
    if(t.d) done++;
    else if(t.sk) skipped++;
    else if(t.w) waiting++;
    else actionable++;
  }
  return {done, actionable, waiting, skipped, missed:miss|0,
          total: done + actionable + (miss|0), all: list.length,
          /* cleared = 이 날에 더 할 게 남지 않았다 (날짜 패널이 '다 끝냈어요' 라고 말하는 기준).
             complete = 거기에 더해 다른 날로 미룬 것도 없다 — 온전히 끝낸 날.
             달력은 둘 다 표시하되 무게를 달리한다. 그래야 ✓ 가 거짓말을 하지 않는다. */
          cleared: actionable === 0 && done > 0,
          complete: actionable === 0 && done > 0 && !miss};
}
const dayComplete = (list, miss = 0) => daySummary(list, miss).complete;
/* 그날 '무엇을 계획했는지'의 구성 — 완료 여부로 다시 계산하지 않는다.
   분류가 많으면 상위 3개만 남기고 나머지는 분류 없음과 함께 묶는다. */
function catDist(list, cats, max = 4){
  const total = list.length;
  if(!total) return [];
  const n = new Map();
  for(const t of list){
    const id = cats.some(c => c.id === t.c) ? t.c : '';
    n.set(id, (n.get(id) || 0) + 1);
  }
  const named = [...n.entries()].filter(([id]) => id)
    .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const top = named.slice(0, max);
  const rest = (n.get('') || 0) + named.slice(max).reduce((s,[,v]) => s + v, 0);
  const out = top.map(([id, v]) => ({id, color: cats.find(c => c.id === id).c, ratio: v/total, n: v}));
  if(rest) out.push({id:'', color:null, ratio: rest/total, n: rest});
  return out;
}

/* 제목이 같은 것을 한 흐름으로 — 완료 날짜와 그때 메모까지 */
const norm = s => String(s).toLowerCase().replace(/\s+/g,' ').trim();
function searchTodos(todos, q){
  const nq = norm(q); if(!nq) return [];
  const by = new Map();
  for(const [k, list] of Object.entries(todos)){
    for(const t of list){
      if(!norm(t.t).includes(nq) && !norm(t.nt||'').includes(nq)) continue;
      const g = by.get(norm(t.t)) || {title:t.t, cat:t.c, done:[], open:[]};
      if(t.d) g.done.push({k: t.dd || (isDateKey(k) ? k : null), nt: t.nt || ''});
      else if(isDateKey(k)) g.open.push(k);
      if(t.c) g.cat = t.c;
      by.set(norm(t.t), g);
    }
  }
  return [...by.values()].map(g=>{
    g.done = g.done.filter(x=>x.k).sort((a,b)=>b.k.localeCompare(a.k));
    g.open.sort().reverse();
    g.last = g.done[0]?.k || null;
    return g;
  }).sort((a,b)=>(b.last||'').localeCompare(a.last||'') || b.done.length-a.done.length);
}
/* 나중에 함의 '조용한 재발견' — 오래 묵었고 최근에 들여다보지 않은 것부터 */
function rediscover(later, todayK, n = 3){
  return [...(later||[])]
    .map(t => ({t, age: daysBetween(t.rv || t.cr || t.o || todayK, todayK)}))
    .filter(x => x.age >= 14)
    .sort((a,b)=>b.age-a.age)
    .slice(0, n)
    .map(x => x.t);
}
/* CSV — 따옴표와 줄바꿈까지 (RFC4180) */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const DONE_WORDS = new Set(['1','true','yes','y','x','o','done','completed','complete','completed.','2']);
/* 어떤 앱의 파일인지 알아보고 공통 모양으로 바꾼다. 새 앱은 여기 한 갈래만 추가하면 된다. */
function readImport(name, text){
  if(/^\s*[{[]/.test(text)){
    let j; try{ j = JSON.parse(text); }catch{ return null; }
    if(j && j.todos) return {src:'daynua', doc:j};
    const lists = Array.isArray(j?.items) ? j.items : Array.isArray(j) ? j : null;
    if(lists?.some(l => Array.isArray(l?.items))){          // Google Takeout 의 Tasks.json
      const out = [];
      for(const l of lists) for(const t of (l.items || [])){
        const title = (t.title || '').trim();
        if(!title) continue;
        out.push({t:title,
          date: /^\d{4}-\d{2}-\d{2}/.test(t.due||'') ? t.due.slice(0,10) : null,
          done: t.status === 'completed',
          dd: /^\d{4}-\d{2}-\d{2}/.test(t.completed||'') ? t.completed.slice(0,10) : null,
          cat: (l.title || '').trim(),
          nt: (t.notes || '').trim().slice(0,200)});
      }
      if(out.length) return {src:'google', items:out};
    }
    return null;
  }
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const hi = rows.findIndex(r => r.some(c => /^(title|content|task name|name|subject)$/i.test(c.trim())));
  if(hi < 0) return null;
  const head = rows[hi].map(c => c.trim());
  const body = rows.slice(hi+1);
  /* 앞에 적은 이름을 먼저 쓴다 — TickTick 은 'Folder Name'(상위 폴더)보다 'List Name'이 카테고리 */
  const col = (...res) => { for(const re of res){ const i = head.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  const src = col(/^TYPE$/i) >= 0 && col(/^CONTENT$/i) >= 0 ? 'todoist'
            : col(/^List Name$/i) >= 0 ? 'ticktick' : 'csv';
  const iT = col(/^title$/i, /^content$/i, /^task name$/i, /^name$/i, /^subject$/i);
  const iD = col(/^due date$/i, /^date$/i, /^due$/i, /^deadline$/i);
  const iC = col(/^list name$/i, /^project$/i, /^category$/i, /^list$/i, /^folder name$/i);
  const iS = col(/^status$/i, /^completed$/i, /^is completed$/i, /^done$/i);
  const iDone = col(/^completed time$/i, /^completed at$/i, /^completion date$/i, /^date completed$/i);
  const iN = col(/^description$/i, /^note$/i, /^notes$/i, /^memo$/i, /^content$/i);
  const iType = col(/^TYPE$/i);
  const out = [];
  for(const r of body){
    if(iType >= 0 && !/^task$/i.test((r[iType]||'').trim())) continue;
    const t = (r[iT]||'').trim();
    if(!t) continue;
    const dd = iDone >= 0 ? (r[iDone]||'').slice(0,10) : '';
    const st = iS >= 0 ? (r[iS]||'').trim().toLowerCase() : '';
    const done = !!(dd && /^\d{4}-\d{2}-\d{2}$/.test(dd)) || DONE_WORDS.has(st);
    const date = iD >= 0 ? (r[iD]||'').slice(0,10) : '';
    out.push({
      t,
      date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null,
      done,
      dd: /^\d{4}-\d{2}-\d{2}$/.test(dd) ? dd : (done && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null),
      cat: iC >= 0 ? (r[iC]||'').trim() : (src === 'todoist' ? name.replace(/\.csv$/i,'') : ''),
      nt: iN >= 0 && iN !== iT ? (r[iN]||'').trim().slice(0,200) : ''
    });
  }
  return out.length ? {src, items:out} : null;
}

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
                 : Math.random().toString(36).slice(2,9) + Date.now().toString(36));
/* 처음 여는 사람의 기기 설정을 따른다 — 영어 사용자에게 한국어 기본값이 생기지 않게 */
const NAV = (navigator.languages?.[0] || navigator.language || 'en');
const UI_DEFAULT = {theme:'auto', accent:'', tint:0,
                    lang: /^ko/i.test(NAV) ? 'ko' : 'en',
                    country: (NAV.split('-')[1] || (/^ko/i.test(NAV) ? 'KR' : '')).toUpperCase(),
                    weekStart: /^ko|^ja|^zh|^en-US|^pt-BR/i.test(NAV) ? 0 : 1,
                    notify:false, notifyAt:'09:00',
                    rollover:false};     // 못 끝낸 일을 다음 날로 자동으로 넘기지 않는다 (했는데 체크를 안 한 날도 있어서)
/* 카테고리는 선택 사항이므로 처음엔 하나도 만들지 않는다 (필요해지면 사용자가 만든다) */
const FRESH = () => ({ts:0, rev:0, ui:{...UI_DEFAULT},
  cats:[], todos:{}, rout:[], miss:{}, notes:{}, imports:[], del:{}});

/* 옛 데이터도 그대로 열리게 — 없는 것만 채우고 기존 값은 손대지 않는다 */
const TOMB_TTL = 90 * 864e5;                 // 지운 기록은 90일이면 잊는다
function migrate(d){
  d.ui = {...UI_DEFAULT, ...(d.ui||{})};
  d.cats ||= []; d.todos ||= {}; d.rout ||= []; d.miss ||= {}; d.notes ||= {}; d.imports ||= [];
  d.rev |= 0; d.del ||= {};
  const cut = Date.now() - TOMB_TTL;
  for(const [id, at] of Object.entries(d.del)) if(!(at > cut)) delete d.del[id];
  if(d.todos.inbox && !d.todos.ideas){ d.todos.ideas = d.todos.inbox; delete d.todos.inbox; }
  for(const [k,list] of Object.entries(d.todos)){
    if(!Array.isArray(list)){ delete d.todos[k]; continue; }
    for(const t of list){
      t.mv ??= 0;
      if(t.d && !t.dd && isDateKey(k)) t.dd = k;
    }
  }
  for(const r of d.rout) r.mode ||= 'always';     // 이미 쓰던 반복은 동작이 바뀌면 안 된다
  return d;
}

/* ─── 저장 칸 ───
   게스트와 계정은 서로 다른 칸을 쓴다. A 로 쓰던 내용이 B 로 로그인했을 때
   화면에 남거나 B 의 서버로 올라가는 일이 없게. */
const GUEST_SLOT = 'daynua.doc';
const slotOf = u => u ? 'daynua.doc.' + u.id : GUEST_SLOT;
const readSlot = k => { try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch{ return null; } };
let slot = localStorage.getItem('daynua.slot') || GUEST_SLOT;   // 오프라인으로 열어도 제 칸을 찾게
const hasContent = d => !!d && (Object.values(d.todos||{}).some(l=>l?.length) || (d.cats||[]).length);

/* 두 문서를 합친다 — 한쪽을 통째로 버리지 않는다.
   같은 id 는 새 쪽 것만 · 한쪽에만 있는 것은 살린다 · 지운 기록이 부활을 막는다.
   새 쪽 판정은 rev(개정 번호) 우선 — 기기 시계가 틀려도 한쪽이 영원히 이기지 않게. */
function mergeDocs(a, b){
  const newer = ((b.rev|0) > (a.rev|0) || ((b.rev|0) === (a.rev|0) && (b.ts||0) >= (a.ts||0))) ? b : a;
  const older = newer === b ? a : b;
  const del = {...(older.del||{})};
  for(const [id, t] of Object.entries(newer.del||{})) if(t > (del[id]||0)) del[id] = t;

  const out = {ts: Math.max(a.ts||0, b.ts||0), rev: Math.max(a.rev|0, b.rev|0),
    ui: {...(older.ui||{}), ...(newer.ui||{})},
    notes: {...(older.notes||{}), ...(newer.notes||{})},
    miss: {...(older.miss||{}), ...(newer.miss||{})},
    cats: [], todos: {}, rout: [], imports: [], del};

  const seen = new Set();
  for(const src of [newer, older])
    for(const [k, list] of Object.entries(src.todos||{})){
      if(!Array.isArray(list)) continue;
      for(const t of list){
        if(!t?.id || seen.has(t.id) || del[t.id]) continue;
        seen.add(t.id); (out.todos[k] ||= []).push(t);
      }
    }
  const once = (key, arr) => {
    const got = new Set();
    for(const x of arr){ if(!x?.id || got.has(x.id) || del[x.id]) continue; got.add(x.id); out[key].push(x); }
  };
  once('cats', [...(newer.cats||[]), ...(older.cats||[])]);
  once('rout', [...(newer.rout||[]), ...(older.rout||[])]);
  once('imports', [...(newer.imports||[]), ...(older.imports||[])]);
  return out;
}

function save(){

  catch(e){                                            // 용량이 모자라면 복구 지점부터 버린다

function snapRing(why){
  try{
    const ring = JSON.parse(localStorage.getItem('daynua.snaps') || '[]');
    ring.unshift({at: Date.now(), why, doc});
    localStorage.setItem('daynua.snaps', JSON.stringify(ring.slice(0, 3)));

const tomb = (...ids) => { const t = Date.now(); for(const id of ids) if(id) doc.del[id] = t; };
function touch(){ doc.ts = Date.now(); save(); push(); render(); }

/* 빠른 입력에서 빠져나가며 저장할 때, 방금 누른 체크박스가 사라져 클릭을 잃는 일이 없게
   '손가락/마우스를 누르고 있는 동안'에는 다시 그리기를 클릭 처리 뒤로 미룬다. */
let pointerDown = false, pendingRender = false;
const flushRender = () => { if(pendingRender){ pendingRender = false; render(); } };
addEventListener('pointerdown', ()=>{ pointerDown = true; }, true);
addEventListener('pointerup', ()=>{ pointerDown = false; setTimeout(flushRender, 90); }, true);
addEventListener('click', flushRender);          // 눌린 곳이 먼저 반응한 뒤에 다시 그린다
const renderSoon = () => { if(pointerDown) pendingRender = true; else render(); };
function touchSoon(){ doc.ts = Date.now(); save(); push(); renderSoon(); }

/* 되돌리기 — 지우는 동작 직전의 문서를 한 벌만 들고 있는다 */
/* 실수를 두 번 해도 첫 번째를 되돌릴 수 있게 다섯 단계까지 쌓아둔다.
   문자열로 들고 있어 통째 복사보다 싸고, 오래된 것부터 버린다. */
let undoStack = [], undoTimer = null;
const UNDO_MAX = 5;
function snapshot(){
  undoStack.push(JSON.stringify(doc));
  if(undoStack.length > UNDO_MAX) undoStack.shift();
}
function undo(){
  const prev = undoStack.pop();
  if(!prev) return;
  doc = migrate(JSON.parse(prev));
  applyUI(); touch();
  flash(T('undone'), undoStack.length > 0);     // 더 남아 있으면 계속 되돌릴 수 있다
}
/* PC 에서는 Ctrl/⌘+Z 로도. 글자를 고치는 중이면 브라우저의 글자 되돌리기가 먼저다. */
document.addEventListener('keydown', e=>{
  if(e.key !== 'z' && e.key !== 'Z') return;
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  if(e.target.closest('input, textarea, select, [contenteditable]')) return;
  if(document.querySelector('dialog[open]')) return;
  if(!undoStack.length) return;
  e.preventDefault(); undo();
});
