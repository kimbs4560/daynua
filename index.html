/* ─── 색 대비 보정 ─── */
const rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b] = rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; });
                   return .2126*r + .7152*g + .0722*b; };
const mix = (h, to, amt) => '#' + rgb(h).map((v,i)=>
  Math.round(v + (rgb(to)[i]-v)*amt).toString(16).padStart(2,'0')).join('');
const isDarkMode = () => doc.ui.theme === 'dark' ||
  (doc.ui.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
const ratio = (a, b) => { const x = lum(a), y = lum(b);
  return (Math.max(x,y) + .05) / (Math.min(x,y) + .05); };
/* 대비를 재는 기준 배경. 달력 칸·'오늘 꼭' 등이 --fill 위에 앉는데
   라이트에서도 다크에서도 --fill 이 --card 보다 불리하므로 이쪽에 맞춘다.
   (테마 + 배경색 물들이기까지 반영. applyUI 가 갱신한다) */
let BASE = '#efece5';
function readBase(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--fill').trim();
  BASE = /^#[0-9a-fA-F]{3}$/.test(v) ? '#' + [...v.slice(1)].map(c=>c+c).join('')
       : /^#[0-9a-fA-F]{6}$/.test(v) ? v
       : (isDarkMode() ? '#26262d' : '#efece5');
}
/* 사용자가 고른 색을 최소한으로만 건드린다 — 배경과 4.5:1 이 되는 순간 멈춘다 */
const away = () => lum(BASE) < .18 ? '#ffffff' : '#000000';   // 배경 반대쪽으로 민다
function ink(h, target = 4.5){
  if(!/^#[0-9a-fA-F]{6}$/.test(h||'')) return 'var(--sub)';
  const to = away();
  for(let a = 0; a < 1; a += .04){
    const c = mix(h, to, a);
    if(ratio(c, BASE) >= target) return c;
  }
  return to;
}

/* ─── 반복 할 일 ─── */
const lastDoneOf = rid => {
  let last = null;
  for(const list of Object.values(doc.todos))
    for(const t of list) if(t.r === rid && t.d && t.dd && (!last || t.dd > last)) last = t.dd;
  return last;
};
const hasOpenOf = rid => Object.values(doc.todos)
  .some(list => list.some(t => t.r === rid && !t.d && !t.sk));

/* ponytail: 보이는 날 + 오늘 ±1년만 만든다. 커지면 가상 렌더로. */
function materialize(days){
  const now = Date.now(), tk = todayKey(); let added = 0;
  const blocked = new Set(doc.rout.filter(r => r.mode === 'once' && hasOpenOf(r.id)).map(r => r.id));
  for(const d of days){
    const k = key(d);
    /* 지나간 날에는 반복 할 일을 새로 만들지 않는다.
       달력을 뒤로 넘길 때마다 "못 한 일"이 과거에 새로 생기면 기록이 아니라 빚이 된다.
       (이미 만들어져 있던 것은 그대로 둔다 — 지우지 않는다) */
    if(k < tk) continue;
    if(Math.abs(dOf(k) - now) > 400*864e5) continue;
    const wd = d.getDay(), list = doc.todos[k];
    for(const r of doc.rout){
      if(r.every) continue;                                  // 주기형은 달력에 미리 깔지 않는다
      if(!r.days?.includes(wd) || (r.from && k < r.from)) continue;
      if(blocked.has(r.id) || (list||[]).some(t=>t.r===r.id)) continue;
      (doc.todos[k] ||= []).push({id:uid(), t:r.t, d:false, c:r.c, o:k, cr:k, r:r.id, mv:0});
      if(r.mode === 'once') blocked.add(r.id);
      added++;
    }
  }
  if(added){ doc.ts = Date.now(); save(); push(); }
  return added;
}
/* 주기형(약 N일마다): 마지막 완료로부터 N일이 지나면 조용히 알려준다 */
function dueGaps(todayK){
  return doc.rout.filter(r => r.every).map(r=>{
    const last = lastDoneOf(r.id) || r.from;
    const since = daysBetween(last, todayK);
    return {r, since, due: since >= r.every};
  }).filter(x => x.due && !hasOpenOf(x.r.id)).sort((a,b)=>b.since-a.since).slice(0,2);
}

/* ─── 공휴일 ─── */
async function loadHolidays(year){
  const c = doc.ui.country;
  if(!c) return;
  const ck = `${c}-${year}`;
  if(holLoaded.has(ck)) return;
  holLoaded.add(ck);
  const cached = localStorage.getItem('daynua.hol.'+ck);
  if(cached){ Object.assign(hol, JSON.parse(cached)); return renderKeepInput(); }
  try{
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${c}`);
    if(!r.ok) throw new Error('http');
    const m = {};
    for(const h of await r.json()) m[h.date] = [h.localName, h.name];
    localStorage.setItem('daynua.hol.'+ck, JSON.stringify(m));
    Object.assign(hol, m);
    renderKeepInput();
  }catch{ holLoaded.delete(ck); }
}
function resetHolidays(){
  hol = {}; holLoaded.clear();
  for(const k of Object.keys(localStorage)) if(k.startsWith('daynua.hol.')) localStorage.removeItem(k);
}

/* 배경을 강조색 쪽으로 물들이는 정도만 조절하면, 손대는 값은 하나인데 분위기는 다 바뀐다 */
const TINT_BASE = {
  light:{bg:'#faf9f6', card:'#ffffff', fill:'#efece5', line:'#e3e0d9'},
  dark: {bg:'#131316', card:'#1c1c21', fill:'#26262d', line:'#33333c'}
};
/* 배경을 물들이면 이 글자색들이 무너질 수 있다. 물들인 배경에 맞춰 되돌린다.
   [변수, 목표 대비] — 본문 7, 보조 4.5, 아이콘 3 */
const INK_BASE = {
  light:{'--ink':['#1b1b20',7], '--sub':['#63626c',4.5], '--faint':['#8a877f',3],
         '--sun':['#b4441f',4.5], '--sat':['#35619f',4.5]},
  dark: {'--ink':['#edece8',7], '--sub':['#a2a1ac',4.5], '--faint':['#78777f',3],
         '--sun':['#e8714d',4.5], '--sat':['#7ea6e8',4.5]}
};
function applyUI(){
  const root = document.documentElement;
  root.dataset.theme = doc.ui.theme === 'auto' ? '' : doc.ui.theme;
  root.lang = doc.ui.lang;
  const dark = isDarkMode();
  const acc = /^#[0-9a-fA-F]{6}$/.test(doc.ui.accent||'') ? doc.ui.accent : (dark ? '#e8714d' : '#c9502f');
  if(doc.ui.accent) root.style.setProperty('--accent', acc);
  else root.style.removeProperty('--accent');
  const tint = Math.max(0, Math.min(100, doc.ui.tint|0)) / 100;
  for(const [k, v] of Object.entries(TINT_BASE[dark ? 'dark' : 'light'])){
    if(!tint) root.style.removeProperty('--' + k);
    else root.style.setProperty('--' + k, mix(v, acc, tint * (dark ? .22 : .17) * (k === 'card' ? .45 : 1)));
  }
  readBase();
  for(const [v, [base, target]] of Object.entries(INK_BASE[dark ? 'dark' : 'light'])){
    if(tint) root.style.setProperty(v, ink(base, target)); else root.style.removeProperty(v);
  }
  root.style.setProperty('--accent-ink', ink(acc));
  root.style.setProperty('--on-accent',
    ratio('#ffffff', acc) >= ratio('#111111', acc) ? '#ffffff' : '#111111');
  const barBg = getComputedStyle(root).getPropertyValue('--bg').trim() || '#fff8f1';
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', barBg);
  if(APP) try{ APP.setBars(barBg, lum(barBg) > .5); }catch{}
  const [a,b] = T('brand');
  $('#brand').innerHTML = `${a}<b>${b}</b>`;
  $('#today').textContent = T('today');
  for(const b of [$('#fab'), $('#btnCfg')]){
    b.title = T('settings');
    b.innerHTML = ICON.gear;
    b.setAttribute('aria-label', T('settings'));
  }
  $('#btnSearch').title = T('search');
  $('#btnIdeas').title = T('archive');
  $('#btnStats').title = T('stats');
  setAcct();
}

/* 요약은 한 번 그리는 동안 한 번만 센다 — 칸마다 전체 기록을 다시 훑지 않게 */
let sumCache = new Map();
const sumOf = k => { let v = sumCache.get(k);
  if(!v){ v = daySummary(bucket(k), doc.miss[k] || 0); sumCache.set(k, v); } return v; };

/* 칸에 자리가 모자랄 때의 순서 — 오늘 꼭 > 아직 할 일 > 끝낸 일 > 기다림·건너뜀 */
const cellRank = t => (t.s && !t.d) ? 0 : (!t.d && !t.sk && !t.w) ? 1 : t.d ? 2 : 3;
const cellOrder = list => [...list].sort((a,b) => cellRank(a) - cellRank(b));

/* 제목은 보기마다 다르다 — 주는 기간, 월은 달, 년은 해 */
function viewTitle(){
  const y = cur.getFullYear();
  const ky = y === new Date().getFullYear() ? '' : ' class="ky"';     // 올해가 아니면 좁은 화면에서도 연도를 보인다
  if(calView === 'year') return `${y}`;
  if(calView === 'month')
    return `${new Intl.DateTimeFormat(loc(),{month:'long'}).format(cur)}<small${ky}>${y}</small>`;
  const w = weekGrid(key(cur), ws()), a = dOf(w[0]), b = dOf(w[6]);
  const ko = doc.ui.lang !== 'en';
  const mo = d => ko ? `${d.getMonth()+1}월` : new Intl.DateTimeFormat('en-US',{month:'short'}).format(d);
  const same = w[0].slice(0,7) === w[6].slice(0,7);
  const head = ko ? (same ? `${mo(a)} ${a.getDate()}–${b.getDate()}일`
                          : `${mo(a)} ${a.getDate()}일 – ${mo(b)} ${b.getDate()}일`)
                  : (same ? `${mo(a)} ${a.getDate()}–${b.getDate()}`
                          : `${mo(a)} ${a.getDate()} – ${mo(b)} ${b.getDate()}`);
  const yr = a.getFullYear() === b.getFullYear() ? `${a.getFullYear()}`
                                                 : `${a.getFullYear()}–${b.getFullYear()}`;
  return `${head}<small${a.getFullYear() === new Date().getFullYear() && b.getFullYear() === a.getFullYear() ? '' : ' class="ky"'}>${yr}</small>`;
}

/* ─── 움직임 ───
   다시 그릴 때마다 반복되면 안 되는 효과(등장·체크·사라짐)는 CSS 로 상시 걸지 않는다.
   사용자가 뭔가 한 그 순간에만 여기에 쌓아두고, 바로 다음 render 한 번에만 붙인다.
   그래서 다른 기기에서 동기화가 들어와도 화면이 춤추지 않는다. */
const reduceMo = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let animQ = [];
const animate = (sel, cls = 'in') => { if(!reduceMo()) animQ.push([sel, cls]); };
function flushAnim(){
  for(const [sel, cls] of animQ)
    for(const el of document.querySelectorAll(sel)) el.classList.add(cls);
  animQ = [];
}
/* 없어지는 것은 없어지는 게 보인 다음에 없앤다 */
function vanish(el, fn){
  if(!el || reduceMo()) return fn();
  el.classList.add('out');
  setTimeout(fn, 130);
}
/* 한 번만 재생하는 효과 — 연달아 눌러도 앞의 것이 남지 않게 매번 다시 건다 */
function once(el, cls, ms = 200){
  if(!el || reduceMo()) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), ms);
}
/* 화면을 바꾸는 동작(보기 전환·이전/다음·오늘·날짜 선택)은 한 번에 갈아끼우지 않고 부드럽게 이어 준다.
   브라우저의 View Transitions 가 옛 화면과 새 화면을 겹쳐 흘려 준다. 지원하지 않으면 예전 효과 그대로.
   mode: next/prev = 달력이 그 방향으로 밀려 들어온다 · swap = 다른 화면 · pick = 같은 화면 안에서 날짜만 */
let vtOn = false;
function smooth(fn, mode = 'swap', after){
  if(!document.startViewTransition || reduceMo()){ fn(); after?.(); return; }
  const h = document.documentElement;
  const end = () => { vtOn = false; delete h.dataset.vt; };
  h.dataset.vt = mode; vtOn = true;
  let t;
  try{ t = document.startViewTransition(fn); }catch{ end(); fn(); after?.(); return; }
  t.ready.catch(()=>{});
  t.finished.then(end, end);
  if(after) t.finished.then(after, after);
}
const fade = sel => { if(!vtOn) once($(sel), 'vfade', 200); };
const calStep = n => { if(!vtOn) once($('#cal'), n > 0 ? 'stepL' : 'stepR', 220); };

/* 다이얼로그는 다 사라진 뒤에 닫는다. 닫는 중에 다시 열면 닫기를 취소한다 —
   그래야 애니메이션이 안 보이거나 InvalidStateError 가 나는 일이 없다. */
for(const d of document.querySelectorAll('dialog')){
  const nClose = d.close.bind(d), nShow = d.showModal.bind(d);
  let t = null;
  d.close = v => {
    if(!d.open || d.classList.contains('closing')) return;
    if(reduceMo()) return nClose(v);
    d.classList.add('closing');
    t = setTimeout(()=>{ d.classList.remove('closing'); nClose(v); }, 130);
  };
  d.showModal = () => { clearTimeout(t); d.classList.remove('closing'); if(!d.open) nShow(); };
}

function render(){
  const tk = todayKey();
  sumCache = new Map();
  readBase();          // 대비 보정의 기준 배경은 '지금' 배경이어야 한다
                       // (테마가 바뀐 직후 applyUI 보다 render 가 먼저 와도 색이 틀어지지 않게)
  loadHolidays(cur.getFullYear());
  $('#title').innerHTML = viewTitle();
  $('#prev').setAttribute('aria-label', T('aPrev')[calView]);
  $('#next').setAttribute('aria-label', T('aNext')[calView]);
  $('#today').setAttribute('aria-label', T('aToday'));
  $('#viewSeg').setAttribute('aria-label', T('aViews'));
  for(const b of $('#viewSeg').children){
    const v = b.dataset.v, on = v === calView;
    b.textContent = T(v === 'week' ? 'vWeek' : v === 'month' ? 'vMonth' : 'vYear');
    b.className = on ? 'on' : '';

  }
  $('#btnIdeas').classList.toggle('on', view==='ideas');
  $('#btnSearch').classList.toggle('on', view==='search');
  $('#btnStats').classList.toggle('on', view==='stats');
  $('#btnSearch').setAttribute('aria-label', T('search'));
  $('#btnIdeas').setAttribute('aria-label', T('archive'));
  $('#btnStats').setAttribute('aria-label', T('stats'));
  const n = bucket('ideas').length;
  $('#btnIdeas').innerHTML = '💡' + (n ? `<span class="cnt">${n}</span>` : '');

  /* 1년은 훑어보는 화면이다 — 날짜 패널도 빠른 입력도 DOM 에서 아예 비운다
     (숨기기만 하면 Tab 으로 닿는 입력칸이 남는다). 검색·보관함을 연 동안만 옆칸이 살아난다. */
  const overview = calView === 'year' && view === 'day';
  const app = $('#app');
  app.classList.toggle('overview', overview);
  for(const v of VIEWS) app.classList.toggle('v-' + v, v === calView);
  calView === 'week' ? renderWeek(tk) : calView === 'year' ? renderYear(tk) : renderMonth(tk);
  if(overview) $('#side').innerHTML = '';
  else view === 'ideas' ? renderIdeas(tk) : view === 'search' ? renderSearch()
     : view === 'stats' ? renderStats() : renderDay(tk);
  flushAnim();                 // 이번 변화에만 해당하는 효과를 붙인다 (그리고 비운다)
  writeSummary();
}

const CHK = `<svg class="chk" width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path
  d="M3 8.6l3.3 3.3L13 5" fill="none" stroke="currentColor" stroke-width="2.3"
  stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* 사용자가 고른 색을 지우지 않되, 배경에 묻히거나 네온처럼 튀지 않을 만큼만 손본다 */
function stripColor(h, target = 3){
  if(!/^#[0-9a-fA-F]{6}$/.test(h||'')) return 'var(--faint)';
  const to = away();
  const from = to === '#ffffff' && lum(h) > .72 ? mix(h,'#000000',.22) : h;  // 어두운 배경에서 네온처럼 튀지 않게
  for(let a = 0; a < 1; a += .04){
    const c = mix(from, to, a);
    if(ratio(c, BASE) >= target) return c;
  }
  return to;
}
/* 한 칸에 필요한 것만 한 번에 계산한다 */
function cellData(k){
  const list = bucket(k), s = sumOf(k);
  return {list, complete:s.complete, cleared:s.cleared, left:s.actionable,
          dist:catDist(list, doc.cats)};
}
/* 날짜 아래 점 = 그날 일정 하나에 하나. 분류가 달라도 개수는 전체 개수 그대로.
   색은 그 일의 분류, 끝낸/건너뛴 일은 옅게. 4개를 넘으면 3개 + '+N' */
function dotsHTML(list){
  if(!list.length) return '';
  const ord = cellOrder(list), more = ord.length > 4 ? ord.length - 3 : 0;
  const dots = (more ? ord.slice(0, 3) : ord).map(t => {
    const c = catOf(t.c)?.c;
    return `<i${t.d || t.sk ? ' class="fd"' : ''} style="--c:${c ? stripColor(c) : 'var(--faint)'}"></i>`;
  }).join('');
  return dots + (more ? `<b>+${more}</b>` : '');
}
let monthHasComplete = false;

function renderMonth(tk){
  const days = monthGrid(cur.getFullYear(), cur.getMonth(), ws());
  materialize(days);
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  monthHasComplete = false;
  const cells = days.map(d=>{
    const k = key(d), s = cellData(k);
    if(s.complete && d.getMonth() === cur.getMonth()) monthHasComplete = true;
    const hn = holName(k), w = d.getDay();
    /* 분류 색이 1개면 한 색, 2개면 반반, 3개면 3등분 … 비율이 아니라 '균등' — 한눈에 몇 종류였는지가 읽히게 */
    /* 끝낸 날의 색 — 분류가 n 개면 n 등분. 폰은 숫자 원을 파이로, PC 는 타일을 가로 띠로 나눈다 */
    const tintOf = pct => {
      if(!(s.cleared && s.dist.length)) return null;
      const cs = s.dist.map(x => `color-mix(in srgb,${x.color ? stripColor(x.color) : 'var(--faint)'} ${pct}%,transparent)`);
      const n = cs.length, stops = cs.map((c,i)=>`${c} ${i*100/n}% ${(i+1)*100/n}%`).join(',');
      return {one: cs[0], n, stops};
    };
    const tC = tintOf(56), tL = tintOf(46);
    const tint = tC ? 1 : 0;
    const tvars = tC ? `--tc:${tC.n === 1 ? tC.one : `conic-gradient(${tC.stops})`};--tl:${tL.n === 1 ? tL.one : `linear-gradient(90deg,${tL.stops})`}` : '';
    const cls = ['cell', d.getMonth()!==cur.getMonth()?'out':'',
      k===tk?'today':'', k===sel?'sel':'',
      s.cleared ? (s.complete ? 'fin' : 'fin soft') : '', tint ? 'tint' : ''].join(' ');
    const nc = hn || w===0 ? 'var(--sun)' : w===6 ? 'var(--sat)' : '';
    const label = !s.list.length ? fmtDay.format(d)
      : s.complete ? `${fmtDay.format(d)}, ${T('aTasks')(s.list.length)}, ${T('aAllDone')}`
      : s.cleared ? `${fmtDay.format(d)}, ${T('aTasks')(s.list.length)}, ${T('aCleared')}`
      : `${fmtDay.format(d)}, ${T('aSomeDone')(s.list.length, s.list.filter(t=>t.d).length)}`;
    const nst = nc ? `color:${nc}` : '';
    return `<div class="${cls}" data-k="${k}" role="button" tabindex="0"${tvars ? ` style="${tvars}"` : ''}
        aria-pressed="${k===sel}" aria-label="${esc(label)}">
      <span class="n mono"${nst ? ` style="${nst}"` : ''}>${d.getDate()}${s.cleared ? CHK : ''}</span>
      ${hn?`<div class="hn" title="${esc(hn)}">${esc(hn)}</div>`:''}
      ${s.cleared ? '' : `<div class="mk">${dotsHTML(s.list)}</div>`}
    </div>`;
  }).join('');
  $('#cal').innerHTML = `<div class="wk">${wdNames().map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="grid" style="--rows:${days.length/7}">${cells}</div>`;
}

/* ── 주간: 이번 주 7일에 무엇을 하기로 했는지. 시간축은 만들지 않는다. ── */
function renderWeek(tk){
  const days = weekGrid(key(cur), ws());
  materialize(days.map(dOf));
  const wdS = new Intl.DateTimeFormat(loc(), {weekday:'short'});
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  const MAX = 6, MOBILE = 4;
  const cards = days.map(k=>{
    const d = dOf(k), s = sumOf(k), list = bucket(k);
    const hn = holName(k), w = d.getDay();
    const nc = hn || w===0 ? 'var(--sun)' : w===6 ? 'var(--sat)' : '';
    const dist = catDist(list, doc.cats);
    const ord = cellOrder(list);
    /* 끝낸 날은 월 달력과 같게 — 날짜 원이 분류 색으로 물든다 (n 개면 n 등분) */
    let tc = '';
    if(s.cleared && dist.length){
      const cs = dist.map(x => `color-mix(in srgb,${x.color ? stripColor(x.color) : 'var(--faint)'} 56%,transparent)`);
      const n = cs.length;
      tc = n === 1 ? cs[0] : `conic-gradient(${cs.map((c,i)=>`${c} ${i*100/n}% ${(i+1)*100/n}%`).join(',')})`;
    }
    const label = !list.length ? fmtDay.format(d)
      : s.complete ? `${fmtDay.format(d)}, ${T('aTasks')(list.length)}, ${T('aAllDone')}`
      : s.cleared ? `${fmtDay.format(d)}, ${T('aTasks')(list.length)}, ${T('aCleared')}`
      : `${fmtDay.format(d)}, ${T('aSomeDone')(list.length, s.done)}`;
    const restD = Math.max(0, ord.length - MAX), restM = Math.max(0, ord.length - MOBILE);
    const st = (tc ? `--tc:${tc};` : '') + (nc ? `--nc:${nc}` : '');
    return `<div class="wcard${k===tk?' today':''}${k===sel?' sel':''}${
        s.cleared ? (s.complete ? ' fin' : ' fin soft') : ''}${list.length ? '' : ' empty'}" data-k="${k}" role="button"
        tabindex="0" aria-pressed="${k===sel}" aria-label="${esc(label)}"${st ? ` style="${st}"` : ''}>
      <div class="wh"><span class="wd">${esc(wdS.format(d))}</span>
        <span class="wn mono">${d.getDate()}${s.cleared ? CHK : ''}</span></div>
      <div class="wl">
        ${hn ? `<span class="whn">${esc(hn)}</span>` : ''}
        ${ord.length ? ord.slice(0, MAX).map(evHTML).join('') : hn ? '' : `<span class="none">${T('weekNone')}</span>`}
        ${restM?`<span class="more m">${T('more')(restM)}</span>`:''}
        ${restD?`<span class="more d">${T('more')(restD)}</span>`:''}</div>
      ${!s.cleared && s.actionable ? `<span class="wleft">${s.actionable}<small>${T('leftTag')}</small></span>` : ''}
    </div>`;
  }).join('');
  $('#cal').innerHTML = `<div class="week">${cards}</div>`;
}

/* ── 1년: 성적표가 아니라 활동 기록. 12개의 작은 달력 + 그 해의 기록. ──
   색은 '그날 끝낸 일의 수' 하나만 말한다 (분류 색은 월/주의 몫). */
/* 연도 전체를 한 번만 훑는다 (날짜마다 다시 세지 않게).
   월·주 화면과 같은 기준 — 할 일이 놓인 '그 날짜' 칸에 센다.
   done = 끝낸 수(색), open = 아직 남은 날, any = 할 일이 있는 날(점) */
function doneMap(y){
  const pre = String(y) + '-', done = new Map(), open = new Set(), any = new Set();
  for(const [k, list] of Object.entries(doc.todos)){
    if(!k.startsWith(pre) || !isDateKey(k)) continue;
    for(const t of list){
      any.add(k);
      if(t.d) done.set(k, (done.get(k) || 0) + 1);
      else if(!t.sk) open.add(k);
    }
  }
  return {done, open, any};
}

function renderYear(tk){
  const y = cur.getFullYear();
  const ym = doneMap(y), dm = ym.done;
  const wd = wdNames().map(w => w.replace(/요일$/, '').slice(0, 1));
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  const months = Array.from({length:12}, (_, m)=>{
    const cells = monthGrid(y, m, ws()).map(d=>{
      if(d.getMonth() !== m) return '<span class="yd out"></span>';
      const k = key(d), n = dm.get(k) || 0, lv = actLevel(n), left = ym.open.has(k);
      const lab = `${fmtDay.format(d)}${n ? ` · ${T('impDone')} ${n}` : ''}${left ? ` · ${T('yHas')}` : ''}`;
      return `<button class="yd${lv?' a'+lv:''}${left?' has':''}${k===tk?' today':''}" data-k="${k}" tabindex="-1"
        title="${esc(lab)}" aria-label="${esc(lab)}">${d.getDate()}</button>`;
    }).join('');
    return `<section class="ym">
      <button class="ymt" data-m="${m}">${monthName(m)}</button>
      <div class="ywd">${wd.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <div class="yg">${cells}</div></section>`;
  }).join('');
  $('#cal').innerHTML = `<div class="year">${months}</div>${yearRecord(y, dm)}`;
  /* 날짜 수백 개를 전부 Tab 에 넣지 않는다 — 달마다 한 칸만 들어가고 안에서는 방향키로 */
  for(const g of $('#cal').querySelectorAll('.yg')){
    (g.querySelector('.yd.today') || g.querySelector('.yd[data-k]'))?.setAttribute('tabindex', '0');
  }
}

/* 한 줄 — 세 화면이 같은 모양을 쓴다. 부가 정보는 필요할 때만 붙는다. */
/* 한 줄. 제목이 주인공이고, 나머지는 있을 때만·약하게 붙는다.
   미룬 날수 배지는 줄에 달지 않는다 — 필요하면 안내 카드와 기록 화면에서 한 번만 말한다. */
function rowHTML(t, from, opt = {}){
  const c = catOf(t.c);
  const col = c ? ink(c.c) : 'var(--sub)';
  const cls = ['', t.d?'done':'', t.sk?'skip':'', t.w?'wait':''].join(' ').trim();
  const subs = t.sub || [];
  const subOpen = openSubs.has(t.id), noteOpen = openNotes.has(t.id);
  /* 평소엔 그냥 글자. 끌 수 있다. 수정은 더블클릭이나 ⋯ → 수정 으로 들어간다. */
  const canMove = canDrag && !t.d && !t.sk && !subOpen && editId !== t.id;
  return `<li class="${cls}" data-id="${t.id}" data-from="${from}" style="color:${col}"
      ${canMove ? 'draggable="true"' : ''}>
    <button class="ck"></button>
    <span class="tx" spellcheck="false">${esc(t.t)}</span>
    ${t.r?`<span class="rp" title="${T('routines')}">${ICON.repeat}</span>`:''}
    ${t.w?`<span class="wi" title="${T('waiting')}">${ICON.wait}</span>`:''}
    ${t.d && t.dd && t.o && daysBetween(t.o, t.dd) >= 1
        ? `<span class="took">${T('tookN')(daysBetween(t.o, t.dd))}</span>` : ''}
    ${subs.length ? `<button class="subn">${subs.filter(s=>s.d).length}/${subs.length}</button>` : ''}
    ${opt.star ? `<button class="st ${t.s?'on':''}">${t.s?'★':'☆'}</button>` : ''}
    <button class="mv" title="${T('moveTo')}" aria-label="${T('moveTo')}">⋯</button>
    ${subOpen ? `<div class="subs">
        ${subs.map((s,i)=>`<div class="s ${s.d?'d':''}" data-i="${i}">
          <button class="sck"></button>
          <span contenteditable="plaintext-only" spellcheck="false">${esc(s.t)}</span>
          <button class="sx">×</button></div>`).join('')}
        <input class="subadd" maxlength="120" placeholder="${T('subPh')}"></div>` : ''}
    ${noteOpen ? `<span class="note" contenteditable="plaintext-only" spellcheck="false"
          data-ph="${T('notePh')}">${esc(t.nt||'')}</span>`
      : t.nt ? `<span class="note ro">${esc(t.nt)}</span>` : ''}
  </li>`;
}

/* 날짜 화면. 순서 = 날짜 → 적기 → 오늘 꼭 → 할 일 → (있을 때만) 안내·기다림·완료.
   ★ 오늘 꼭은 위에서 한 번만 보여주고 아래 목록에서는 뺀다 (같은 줄이 두 번 보이지 않게). */
function renderDay(tk){
  materialize([dOf(sel)]);
  const d = dOf(sel);
  const list = bucket(sel);
  const done = list.filter(t=>t.d), skipped = list.filter(t=>t.sk && !t.d);
  const waiting = list.filter(t=>!t.d && !t.sk && t.w);
  const open = list.filter(t=>!t.d && !t.sk && !t.w);
  const sm = sumOf(sel), miss = sm.missed, tot = sm.total;
  const hn = holName(sel), note = doc.notes[sel] || '';
  const must = open.filter(t=>t.s);
  const rest = open.filter(t=>!t.s);
  const nag = rest.filter(t=>(t.mv||0) >= 5).sort((a,b)=>(b.mv||0)-(a.mv||0))[0];
  const gaps = sel === tk ? dueGaps(tk) : [];

  /* 완료한 일도 제 분류 안에 그대로 둔다 — 아래 '완료 N' 으로 접었다 폈다만 한다 */
  const everything = doneOpen ? [...rest, ...done, ...skipped] : rest;
  /* 한동안 앱을 안 쓰면 못 끝낸 일이 전부 오늘로 밀려온다. 천 줄을 한 번에 그리면
     화면도 손도 느려지므로 먼저 이만큼만 보여주고, 나머지는 눌러서 부른다.
     데이터는 하나도 건드리지 않는다 — 그리는 양만 줄인다. */

  const bucketOf = c => inGroups.filter(t => c ? t.c === c.id : !catOf(t.c))

    ${note && !noteShow ? `<div class="daynote ro" id="dnRead">${esc(note)}</div>` : ''}
    ${noteShow ? `<div class="daynote"><input id="dayNote" maxlength="120"
        placeholder="${T('dayNotePh')}" value="${esc(note)}"></div>` : ''}
    <div class="qcat" id="qcat">
      ${doc.cats.length ? `<button data-q="" class="${quickCat?'':'on'}">${T('noCat')}</button>` : ''}
      ${doc.cats.map(c=>`<button data-q="${c.id}" class="${quickCat===c.id?'on':''}"
          ${canDrag ? 'draggable="true"' : ''}><i style="background:${stripColor(c.c)}"></i>${esc(c.n)}</button>`).join('')}
      <button data-q="+" class="newc">${doc.cats.length ? '+' : T('addCat')}</button>
    </div>
    <div class="qadd main"><span>+</span><input id="qd" maxlength="200" placeholder="${T('quickAdd')}"></div>
    ${tipNow() ? `<div class="tip" id="tip${tipNow().id}"><span>${tipNow().text}</span>
        <button data-tip="${tipNow().id}">${T('gotIt')}</button></div>` : ''}
    ${!sm.all ? `<div class="dayempty"><b>${T('dayEmpty')}</b><span>${T('dayEmptyHint')}</span></div>`
      : !sm.actionable && sm.done ? `<div class="dayempty done">${CHK}<b>${sel===tk?T('dayAllDoneToday'):T('dayAllDone')}</b></div>`

    ${must.length ? `<div class="must"><div class="sec">★ ${T('mustDo')}</div>

    ${cats}
    ${capped ? `<button class="fold" id="showAll">

    ${gaps.map(({r,since})=>`<div class="nudge" data-gap="${r.id}">

/* 기록 = 평가가 아니라 회고. 연속 일수·달성률처럼 압박을 주는 숫자는 두지 않는다. */
function statsOf(){
  const tk = todayKey(), yr = tk.slice(0,4);
  let done30 = 0, doneYear = 0, doneAll = 0;
  const byCat = new Map(), oldest = [], recent = [];
  for(const [k, list] of Object.entries(doc.todos)){
    for(const t of list){
      if(t.d){
        doneAll++;
        byCat.set(t.c||'', (byCat.get(t.c||'')||0) + 1);
        const day = t.dd || (isDateKey(k) ? k : null);
        if(day){
          if(day.startsWith(yr)) doneYear++;
          if(daysBetween(day, tk) < 30 && day <= tk) done30++;
          recent.push({t, day});
        }
      } else if(t.o && isDateKey(k) && !t.sk && !t.w) oldest.push(t);
    }
  }
  oldest.sort((a,b)=>(a.o||'').localeCompare(b.o||''));
  recent.sort((a,b)=>b.day.localeCompare(a.day));
  return {done30, doneYear, doneAll,
          byCat:[...byCat.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6),
          oldest: oldest.slice(0,3), recent: recent.slice(0,6)};
}

/* 1년 화면의 주인공은 12개월 달력이다. 기록은 그 아래에 사실만 — 점수도 연속 일수도 없다. */

/* ─── 순서 바꾸기 ───
   같은 날 안에서 배열 순서를 바꾼다. 화면의 순서가 곧 배열 순서이기 때문에
   (분류로 나눠 보여줄 뿐 정렬 규칙은 '끝낸 것만 뒤로') 배열만 손대면 된다. */
function reorderTo(from, id, toId, before){
  const list = doc.todos[from]; if(!list) return;
  const t = list.find(x => x.id === id), tgt = list.find(x => x.id === toId);
  if(!t || !tgt || t === tgt) return;
  list.splice(list.indexOf(t), 1);
  const j = list.indexOf(tgt);
  list.splice(before ? j : j + 1, 0, t);
  /* 다른 분류의 줄 위에 놓았다면 그 분류로 간다 — 놓은 자리가 곧 뜻이다 */
  if((t.c || '') !== (tgt.c || '')){ if(tgt.c) t.c = tgt.c; else delete t.c; }
  touch();
}
/* 한 칸씩 — 손가락으로는 끌어놓기가 안 되므로 메뉴에서 이걸 쓴다.
   같은 분류 안에서만 움직인다. 분류를 넘나드는 건 '분류' 메뉴의 몫. */
function nudgeOrder(from, id, dir){
  const list = doc.todos[from]; if(!list) return;
  const t = list.find(x => x.id === id); if(!t) return;
  const same = list.filter(x => (x.c || '') === (t.c || '') && !x.d && !x.sk);
  const p = same.indexOf(t), q = p + dir;
  if(p < 0 || q < 0 || q >= same.length) return;
  const other = same[q];
  list.splice(list.indexOf(t), 1);
  const j = list.indexOf(other);
  list.splice(dir > 0 ? j + 1 : j, 0, t);
  touch();
}
/* 이 줄이 제 분류 안에서 몇 번째인지 — 메뉴에 위/아래를 보여줄지 정한다 */
function orderSpot(from, id){
  const list = doc.todos[from] || [];
  const t = list.find(x => x.id === id);
  if(!t || t.d || t.sk) return null;
  const same = list.filter(x => (x.c || '') === (t.c || '') && !x.d && !x.sk);
  return {i: same.indexOf(t), n: same.length};
}

/* 마우스로 끌어놓든 손가락으로 끌든 같은 결과가 나오도록 한 곳에 둔다 */
function moveToDay(from, id, k){
  if(!id || from === k) return;
  snapshot();                                  // 잘못 놓아도 한 번은 되돌릴 수 있게
  moveTodo(from, id, k);
}
function moveToCat(from, id, cid){
  const t = bucket(from).find(x => x.id === id); if(!t) return;
  if((t.c || '') === (cid || '')) return;
  if(cid) t.c = cid; else delete t.c;
  touch();
}

/* ─── 달력 클릭 & 드롭 ─── */
$('#cal').addEventListener('click', e=>{
  if(Date.now() - lpFired < 700){ lpFired = 0; return; }     // 길게 누른 직후 따라오는 클릭만 무시
  if(Date.now() - swipedAt < 700){ swipedAt = 0; return; }   // 쓸어 넘긴 직후도 마찬가지
  const mt = e.target.closest('.ymt');                 // 1년 화면의 월 이름 → 그 달로
  if(mt){ cur = new Date(cur.getFullYear(), +mt.dataset.m, 1); return setCalView('month'); }
  const k = e.target.closest('[data-k]')?.dataset.k; if(!k) return;
  /* 1년에서 날짜를 누르면 그 달로 내려간다 — 기록을 보다가 바로 그날을 정리할 수 있게 */
  const zoom = calView === 'year';
  smooth(() => {
    sel = k; cur = dOf(k); view = 'day';
    if(zoom){ calView = 'month'; localStorage.setItem('daynua.calView','month'); }
    render();
    if(zoom){ fade('#cal'); fade('#side'); }
  }, zoom ? 'swap' : 'pick', revealDay);
});
/* 달력 칸도 키보드로 — Enter·Space 는 브라우저가 button 에만 주므로 div 에는 직접 붙인다 */
$('#cal').addEventListener('keydown', e=>{
  const cell = e.target.closest('.cell, .wcard');
  if(cell && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); return cell.click(); }
  const yd = e.target.closest('.yd[data-k]');
  if(!yd) return;
  const D = {ArrowRight:1, ArrowLeft:-1, ArrowDown:7, ArrowUp:-7};
  if(!(e.key in D)) return;
  e.preventDefault();
  const cells = [...yd.closest('.yg').querySelectorAll('.yd[data-k]')];
  const next = cells[Math.max(0, Math.min(cells.length-1, cells.indexOf(yd) + D[e.key]))];
  if(!next || next === yd) return;
  yd.tabIndex = -1; next.tabIndex = 0; next.focus();
});
/* 달력으로 끌어다 놓기 — 월·주 칸만 받는다. 1년은 훑어보는 화면이라 받지 않는다. */
const dropDay = e => e.target.closest('.cell, .wcard');
$('#cal').addEventListener('dragover', e=>{
  const cell = dropDay(e); if(!cell) return;
  e.preventDefault();
  document.querySelectorAll('#cal .over').forEach(c=>c.classList.remove('over'));
  cell.classList.add('over');
});
$('#cal').addEventListener('dragleave', e=>dropDay(e)?.classList.remove('over'));
$('#cal').addEventListener('drop', e=>{
  const cell = dropDay(e); if(!cell) return;
  e.preventDefault(); cell.classList.remove('over');
  try{
    const {from, id} = JSON.parse(e.dataTransfer.getData('text/plain'));
    moveToDay(from, id, cell.dataset.k);
  }catch{}
});

/* ─── 오른쪽 패널 ─── */
$('#side').addEventListener('dragstart', e=>{
  const chip = e.target.closest('#qcat button[data-q]');
  if(chip?.dataset.q && chip.dataset.q !== '+'){        // 분류 칩끼리 끌어서 순서 바꾸기
    e.dataTransfer.setData('text/plain', JSON.stringify({cat: chip.dataset.q}));
    e.dataTransfer.effectAllowed = 'move';
    chip.classList.add('drag');
    return;
  }
  const li = e.target.closest('li'); if(!li?.dataset.from) return;
  e.dataTransfer.setData('text/plain', JSON.stringify({from:li.dataset.from, id:li.dataset.id}));
  e.dataTransfer.effectAllowed = 'move';
  li.classList.add('drag');
  dragRow = {from: li.dataset.from, id: li.dataset.id};   // dragover 에서는 내용을 못 읽는다
});
let dragRow = null;
const clearDropLine = () =>
  document.querySelectorAll('#side .dropA,#side .dropB')
    .forEach(x => x.classList.remove('dropA','dropB'));
$('#side').addEventListener('dragend', e=>{
  dragRow = null;
  clearDropLine();
  e.target.closest('li')?.classList.remove('drag');
  document.querySelectorAll('#side .drag').forEach(x=>x.classList.remove('drag'));
  document.querySelectorAll('#side .over').forEach(x=>x.classList.remove('over'));
});
/* 끌고 있는 줄이 같은 날의 다른 줄 위에 있으면 '순서 바꾸기' — 위/아래 어디에 놓을지 선으로 */
const dropRow = e => {
  if(!dragRow) return null;
  const row = e.target.closest('li[data-from]');
  if(!row || row.dataset.id === dragRow.id || row.dataset.from !== dragRow.from) return null;
  return row;
};
/* 분류 영역(머리글 + 그 아래 목록) 어디에 놓아도, 위쪽 분류 칩에 놓아도 그 분류로 옮긴다 */
const dropCat = e => {
  const chip = e.target.closest('#qcat button[data-q]');
  if(chip) return chip.dataset.q === '+' ? null : chip;
  return e.target.closest('.cat');
};
$('#side').addEventListener('dragover', e=>{
  const row = dropRow(e);
  if(row){                                     // 줄 위 — 순서 바꾸기가 먼저다
    e.preventDefault();
    clearDropLine();
    document.querySelectorAll('#side .over').forEach(x=>x.classList.remove('over'));
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? 'dropA' : 'dropB');
    return;
  }
  clearDropLine();
  const el = dropCat(e); if(!el) return;
  e.preventDefault();
  document.querySelectorAll('#side .over').forEach(x=>x.classList.remove('over'));
  el.classList.add('over');
});
$('#side').addEventListener('dragleave', e=>dropCat(e)?.classList.remove('over'));
$('#side').addEventListener('drop', e=>{
  const row = dropRow(e);
  if(row){
    e.preventDefault();
    const before = row.classList.contains('dropA');
    const src = dragRow;
    clearDropLine(); dragRow = null;
    return reorderTo(src.from, src.id, row.dataset.id, before);
  }
  const el = dropCat(e); if(!el) return;
  e.preventDefault();
  el.classList.remove('over');
  try{
    const p = JSON.parse(e.dataTransfer.getData('text/plain'));
    if(p.cat){                                          // 칩끼리 — 순서 바꾸기
      const to = el.dataset.q;
      if(!to || to === p.cat) return;
      const i = doc.cats.findIndex(c => c.id === p.cat);
      const j = doc.cats.findIndex(c => c.id === to);
      if(i < 0 || j < 0) return;
      const [c] = doc.cats.splice(i, 1);
      doc.cats.splice(j, 0, c);
      return touch();
    }
    const cid = el.classList.contains('cat') ? el.dataset.c : el.dataset.q;
    moveToCat(p.from, p.id, cid);
  }catch{}
});

/* ─── 휴대폰: 꾹 눌러서 끌어 옮기기 ───
   마우스의 끌어놓기(HTML5 drag)는 손가락으로는 아예 일어나지 않는다. 그래서 포인터 이벤트로 직접 만든다.
   · 할 일 줄을 TD_HOLD ms 누르고 있으면 줄이 '들려서' 손가락을 따라온다
   · 달력 칸 위에서 놓으면 그 날로 · 다른 줄 위에서 놓으면 그 자리로(순서) · 분류 위에서 놓으면 그 분류로
   · 화면 위·아래 끝에 대면 저절로 스크롤된다 — 달력이 화면 밖에 있어도 닿을 수 있게
   점 세 개(⋯)는 그대로 있다. 끌기가 안 되는 손에도 길이 하나는 있어야 한다. */
let tdrag = null, tdTimer = null, rowLpFired = 0;
const TD_HOLD = 380;
const tdBlock = e => { if(e.cancelable) e.preventDefault(); };        // 끄는 동안 화면이 같이 밀리지 않게

$('#side').addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse' || tdrag) return;
  const li = e.target.closest('li[data-from]');
  if(!li?.querySelector('.ck')) return;                               // 통계의 '오래 묵은 일' 같은 읽기 전용 줄은 뺀다
  if(li.classList.contains('done') || li.classList.contains('skip') || li.classList.contains('editing')) return;
  if(li.querySelector('.subs')) return;                               // 하위 항목을 펼친 줄은 PC 와 같이 끌지 않는다
  if(e.target.closest('button, input, .subs, .note, [contenteditable]')) return;
  const at = {x:e.clientX, y:e.clientY};
  rowLpFired = 0;
  clearTimeout(tdTimer);
  tdTimer = setTimeout(()=>{ tdTimer = null; tdLift(li, at); }, TD_HOLD);
  const pre = ev => {                                                  // 들어 올리기 전까지만 본다
    if(!tdrag && ev.type === 'pointermove' && Math.hypot(ev.clientX-at.x, ev.clientY-at.y) <= 10) return;
    if(!tdrag){ clearTimeout(tdTimer); tdTimer = null; }
    for(const n of ['pointermove','pointerup','pointercancel']) $('#side').removeEventListener(n, pre);
    removeEventListener('scroll', pre, true);
  };
  for(const n of ['pointermove','pointerup','pointercancel']) $('#side').addEventListener(n, pre);
  addEventListener('scroll', pre, true);      // 화면이 움직이기 시작하면 그건 넘기려던 손이다
});
// 꾹 누를 때 브라우저가 띄우는 기본 메뉴(복사·공유)가 끌기를 가로채지 않게
$('#side').addEventListener('contextmenu', e=>{
  if(!canDrag && e.target.closest('li[data-from]')) e.preventDefault();
});

function tdLift(li, at){
  if(!li.isConnected || tdrag) return;
  const r = li.getBoundingClientRect();
  const g = li.cloneNode(true);
  g.classList.remove('drag','in','ckd','edin');
  g.classList.add('ghost');
  g.querySelectorAll('.mv').forEach(x => x.remove());
  /* 사본은 좁게 만들어 손가락 '위'에 띄운다 — 손가락 밑에 두면 놓을 칸을 가린다 */
  Object.assign(g.style, {left:r.left+'px', top:r.top+'px', width:Math.min(r.width, 236)+'px'});
  document.body.appendChild(g);
  li.classList.add('lifted');
  const gr = g.getBoundingClientRect();
  tdrag = {from:li.dataset.from, id:li.dataset.id, li, g, x:at.x, y:at.y, hit:null, timer:0, x0:at.x, y0:at.y,
           gl:r.left, gt:r.top, gw:gr.width, gh:gr.height};
  rowLpFired = Date.now();                                             // 놓을 때 따라오는 클릭이 체크를 건드리지 않게
  try{ navigator.vibrate?.(16); }catch{}                               // 들어 올렸다는 걸 손이 알게
  document.documentElement.classList.add('td');
  document.addEventListener('touchmove', tdBlock, {passive:false});
  addEventListener('pointermove', tdMove);
  addEventListener('pointerup', tdEnd);
  addEventListener('pointercancel', tdEnd);
  tdAuto(tdrag);
  tdPaint(tdrag);
}
/* 손가락이 움직이는 즉시 사본을 붙이고 지금 어디 위에 있는지 본다 (한 프레임 늦게 따라오지 않게) */
function tdPaint(d){
  /* 손가락 위 14px 에 띄우되 화면 밖으로 나가지 않게 가둔다 */
  const gx = Math.max(8, Math.min(d.x - d.gw/2, innerWidth - 8 - d.gw));
  const gy = Math.max(4, d.y - d.gh - 14);
  d.g.style.transform = `translate3d(${gx-d.gl}px,${gy-d.gt}px,0) scale(1.03)`;
  tdHit(d);
}
function tdMove(e){ if(tdrag){ tdrag.x = e.clientX; tdrag.y = e.clientY; tdPaint(tdrag); } }
/* 화면 위·아래 끝에 손가락을 대고 있으면 저절로 스크롤한다. 스크롤하면 손가락 밑의 것이 바뀌므로 다시 본다. */
function tdAuto(d){
  d.timer = setInterval(()=>{
    const far = Math.hypot(d.x-d.x0, d.y-d.y0) > 12;                   // 들자마자 스크롤되지 않게
    const Z = 84, H = innerHeight;
    const v = d.y < Z ? -(Z-d.y)/Z : d.y > H-Z ? (d.y-(H-Z))/Z : 0;
    if(far && v){ scrollBy(0, Math.round(v * 18)); tdPaint(d); }
  }, 16);
}
function tdMark(h, on){
  if(h.kind === 'row'){ h.el.classList.remove('dropA','dropB'); if(on) h.el.classList.add(h.before ? 'dropA' : 'dropB'); }
  else h.el.classList.toggle('over', on);
}
function tdHit(d){
  const el = document.elementFromPoint(d.x, d.y);                      // 사본은 pointer-events:none 이라 건너뛴다
  let h = null;
  const row = el?.closest('li[data-from]');
  if(row && row !== d.li && row.dataset.id !== d.id && row.dataset.from === d.from){
    const r = row.getBoundingClientRect();
    h = {kind:'row', el:row, id:row.dataset.id, before: d.y < r.top + r.height/2};
  }else{
    const day = el?.closest('.cell[data-k], .wcard[data-k]');
    if(day && day.dataset.k !== d.from) h = {kind:'day', el:day, k:day.dataset.k};
    else{
      const chip = el?.closest('#qcat button[data-q]');
      const cat = chip || el?.closest('.cat');
      if(chip && chip.dataset.q === '+') {}
      else if(cat){
        const cid = chip ? chip.dataset.q : cat.dataset.c;
        const t = bucket(d.from).find(x => x.id === d.id);
        if(t && (t.c || '') !== (cid || '')) h = {kind:'cat', el:cat, cid};
      }
    }
  }
  const p = d.hit;
  if(p && h && p.el === h.el && p.before === h.before) return;
  if(p) tdMark(p, false);
  if(h) tdMark(h, true);
  d.hit = h;
}
function tdEnd(e){
  const d = tdrag; if(!d) return;
  if(e.type === 'pointerup'){ d.x = e.clientX; d.y = e.clientY; tdHit(d); }
  const h = d.hit, ok = e.type === 'pointerup';
  clearInterval(d.timer);
  d.g.remove(); d.li.classList.remove('lifted');
  if(h) tdMark(h, false);
  document.documentElement.classList.remove('td');
  document.removeEventListener('touchmove', tdBlock);
  removeEventListener('pointermove', tdMove);
  removeEventListener('pointerup', tdEnd);
  removeEventListener('pointercancel', tdEnd);
  tdrag = null;
  rowLpFired = Date.now();
  if(!ok || !h) return;
  try{ navigator.vibrate?.(8); }catch{}
  if(h.kind === 'row') reorderTo(d.from, d.id, h.id, h.before);
  else if(h.kind === 'day') moveToDay(d.from, d.id, h.k);
  else moveToCat(d.from, d.id, h.cid);
}
$('#side').addEventListener('click', e=>{
  if(Date.now() - rowLpFired < 700){ rowLpFired = 0; return; }   // 길게 누른 뒤 따라오는 클릭은 무시
  const li = e.target.closest('li'), cat = e.target.closest('.cat'), nudge = e.target.closest('.nudge');
  const tk = todayKey();

  if(nudge?.dataset.gap && e.target.dataset.a){
    const r = doc.rout.find(x=>x.id===nudge.dataset.gap); if(!r) return;
    const to = e.target.dataset.a === 'do' ? tk : shift(tk,1);
    (doc.todos[to] ||= []).push({id:uid(), t:r.t, d:false, c:r.c, o:to, cr:tk, r:r.id, mv:0});
    return touch();
  }
  if(nudge?.dataset.rd && e.target.dataset.a === 'keep'){
    for(const t of rediscover(bucket('later'), tk)) t.rv = tk;      // 봤다고만 기록하고 그대로 둔다
    return touch();
  }
  if(nudge?.dataset.id && e.target.dataset.a){
    const id = nudge.dataset.id, a = e.target.dataset.a;
    const to = a==='tomorrow' ? shift(tk,1) : a==='d2' ? shift(tk,2) : a==='later' ? 'later' : null;
    return moveTodo(sel, id, to);
  }
  if(e.target.closest('#showAll')){ dayAll = sel; return render(); }
  if(e.target.closest('#foldDone')){
    doneOpen = !doneOpen;
    localStorage.setItem('daynua.doneOpen', doneOpen ? '1' : '0');
    /* 접었다 펴는 높이까지 애니메이션하면 목록이 출렁인다 — 펼쳐지는 줄만 조용히 들어오게 */
    if(doneOpen) animate('li.done, li.skip');
    return render();
  }
  if(e.target.dataset.tip){
    const n = e.target.dataset.tip;
    if(n === '1') firstRun = false;
    else if(n === '2'){ ideasHintSeen = true; localStorage.setItem('daynua.hint2','1'); }
    else if(n === '3'){ calHintSeen = true; localStorage.setItem('daynua.hint3','1'); }
    else if(n === '4'){ moveHintSeen = true; localStorage.setItem('daynua.hint4','1'); }
    else { catHintSeen = true; localStorage.setItem('daynua.hint5','1'); }
    localStorage.setItem('daynua.tipDay', todayKey());   // 오늘 몫의 안내는 여기까지
    return render();
  }
  if(e.target.id === 'dnToggle' || e.target.id === 'dnRead'){
    noteShow = !noteShow; noteFocus = noteShow;
    return render();
  }
  if(e.target.matches('.again')){
    const res = e.target.closest('.res');
    const cid = res.dataset.cat && catOf(res.dataset.cat) ? res.dataset.cat : undefined;
    (doc.todos[tk] ||= []).push({id:uid(), t:res.dataset.title, d:false, c:cid, o:tk, cr:tk, mv:0});
    view = 'day'; sel = tk; cur = new Date();
    return touch();
  }
  if(li?.dataset.from){
    const from = li.dataset.from, id = li.dataset.id;
    const t = bucket(from).find(x=>x.id===id);
    if(!t) return;
    if(e.target.matches('.ck')){
      if(t.sk){ delete t.sk; return touch(); }
      t.d = !t.d;
      /* 지난 날짜에 있는 일을 나중에 체크하는 건 대개 '그날 했는데 체크를 안 한' 경우다.
         완료일을 오늘로 적으면 그날이 안 끝난 날로 남고 1년 잔디도 오늘로 잡힌다 — 그 날짜에 적는다. */
      if(t.d){ t.dd = isDateKey(from) && from < tk ? from : tk; t.s = false; delete t.w; } else delete t.dd;
      animate(`li[data-id="${id}"]`, 'ckd');
      /* ✓ 는 그날 마지막 하나를 끝냈을 때만. 체크 효과와 겹쳐 요란해지지 않게 */
      if(t.d && daySummary(bucket(from), doc.miss[from] || 0).complete)
        animate('.dayempty.done .chk, .cell.sel .chk, .wcard.sel .chk', 'pop');
      return touch();
    }
    if(e.target.matches('.st')){
      if(!t.s && bucket(from).filter(x=>x.s && !x.d).length >= 3) flash(T('mustFull'));
      t.s = !t.s;
      return touch();
    }
    if(e.target.matches('.mv')){
      const r = e.target.getBoundingClientRect();
      return openMenu(r.right, r.bottom + 6, from, id);
    }
    if(e.target.matches('.subn')){
      openSubs.has(id) ? openSubs.delete(id) : openSubs.add(id);
      return render();
    }
    const s = e.target.closest('.subs .s');
    if(s){
      const i = +s.dataset.i;
      if(e.target.matches('.sck')){ t.sub[i].d = !t.sub[i].d; return touch(); }
      if(e.target.matches('.sx')){
        return vanish(s, ()=>{
          snapshot();
          t.sub.splice(i,1);
          if(!t.sub.length){ delete t.sub; openSubs.delete(id); }
          touch(); flash(T('del'), true);
        });
      }
    }
    return;
  }
  const chip = e.target.closest('#qcat button');
  if(chip){
    if(Date.now() - chipLpFired < 700){ chipLpFired = 0; return; }   // 꾹 누른 직후만 무시
    if(chip.dataset.q === '+'){ catForQuick = true; return openCat(null); }
    setQuickCat(chip.dataset.q);
    chip.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b === chip));
    return $('#qd')?.focus();                 // 적던 내용을 잃지 않게 다시 그리지 않는다
  }
  const jump = e.target.closest('[data-k]');
  if(jump){ sel = jump.dataset.k; cur = dOf(sel); view='day'; render(); }
});

$('#side').addEventListener('dblclick', e=>{
  if(!canDrag || !e.target.matches('.tx')) return;        // PC 에서만 더블클릭 수정
  const li = e.target.closest('li');
  if(!li?.dataset.from) return;
  startEdit(li.dataset.from, li.dataset.id, {x:e.clientX, y:e.clientY});
});
$('#side').addEventListener('contextmenu', e=>{
  const li = e.target.closest('li'); if(!li?.dataset.from || !canDrag) return;
  e.preventDefault();
  openMenu(e.clientX, e.clientY, li.dataset.from, li.dataset.id);
});

$('#side').addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode === 229) return;          // 한글 조합 중에는 아무것도 확정하지 않는다
  if(e.key === 'Escape'){
    if(e.target.matches('.tx')) return commitEdit(true);
    if(e.target.matches('.add, .note, .subs span, .subadd, #qi, #sq, #dayNote')) return e.target.blur();
  }
  if(e.target.matches('.tx') && e.key === 'Enter'){ e.preventDefault(); return commitEdit(); }
  if(e.target.matches('.note, .subs span') && e.key === 'Enter'){ e.preventDefault(); return e.target.blur(); }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'dayNote') return e.target.blur();
  if(e.target.matches('.subadd')){
    const v = e.target.value.trim(); if(!v) return;
    const li = e.target.closest('li');
    const t = bucket(li.dataset.from).find(x=>x.id===li.dataset.id);
    if(!t) return;
    (t.sub ||= []).push({t:v, d:false});
    e.target.value = '';
    subFocus = t.id;
    animate(`li[data-id="${t.id}"] .subs .s:last-of-type`);
    return touch();
  }
  if(e.target.id === 'qi' || e.target.id === 'qd') return addQuick(e.target, true);
});

/* 새 할 일 만들기 — Enter 로도, 다른 곳을 눌러 빠져나가도 똑같이 만들어진다.
   value 를 먼저 비우므로 Enter 뒤 따라오는 blur 로 두 번 만들어지지 않는다.
   다만 뒷처리는 다르다: Enter 는 이어서 적으라고 입력칸을 지키고,
   빠져나간 경우는 붙잡지 않는다 (모바일에서 키보드가 다시 올라오면 안 된다). */
function addQuick(el, keep){
  const t = el.value.replace(/\s+/g,' ').trim().slice(0, 200);
  el.value = '';
  if(!t) return;
  const ideas = el.id === 'qi';
  const c = !ideas && catOf(quickCat) ? quickCat : undefined;
  const nid = uid();
  (doc.todos[ideas ? 'ideas' : sel] ||= []).push(
    ideas ? {id:nid, t, d:false, cr:todayKey(), mv:0}
          : {id:nid, t, d:false, c, o:sel, cr:todayKey(), mv:0});
  firstRun = false;
  animate(`li[data-id="${nid}"]`);
  if(keep){ touch(); (ideas ? $('#qi') : $('#qd'))?.focus(); }
  else touchSoon();
}

let searchTimer = null;
$('#side').addEventListener('input', e=>{
  if(e.target.id !== 'sq') return;
  query = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ renderSearch(); once($('#side'), 'vfade', 130); }, 160);

$('#side').addEventListener('focusout', e=>{
  if(e.target.id === 'qd' || e.target.id === 'qi'){
    if(e.relatedTarget?.closest('#qcat')) return;     // 분류 칩을 고르는 중이면 아직 만들지 않는다
    return addQuick(e.target, false);
  }
  if(e.target.id === 'dayNote'){
    const v = e.target.value.trim();
    noteShow = false;                                 // 다 적었으면 한 줄로 접힌다
    if((doc.notes[sel]||'') === v) return renderSoon();
    if(v) doc.notes[sel] = v; else delete doc.notes[sel];
    return touchSoon();
  }
  const li = e.target.closest('li');
  if(!li?.dataset.from) return;
  const t = bucket(li.dataset.from).find(x=>x.id===li.dataset.id);
  if(!t) return;
  if(e.target.matches('.note')){
    const v = e.target.textContent.trim();
    openNotes.delete(t.id);                           // 다 적었으면 작은 한 줄로 접힌다
    if((t.nt||'') === v) return renderSoon();
    if(v) t.nt = v; else delete t.nt;
    return touchSoon();
  }
  if(e.target.matches('.subs span')){
    const i = +e.target.closest('.s').dataset.i;
    const v = e.target.textContent.trim();
    if(!t.sub?.[i] || v === t.sub[i].t) return;
    if(v) t.sub[i].t = v;
    else { t.sub.splice(i,1); if(!t.sub.length) delete t.sub; }
    return touch();
  }
  if(e.target.matches('.tx')) commitEdit();
});

/* ─── 제목 수정 ───
   평소(Normal)엔 글자일 뿐이고 끌 수 있다. 명시적으로 들어간 Edit 에서만 편집·드래그 해제.
   한 번에 하나만, 저장은 commitEdit 한 곳에서만 일어난다. */
let editId = null, editFrom = null, editDone = true, routineHinted = false;
const editRow = () => editId &&
  document.querySelector(`li[data-id="${editId}"][data-from="${CSS.escape(editFrom)}"]`);

function startEdit(from, id, pt){
  if(editId) commitEdit();
  const li = document.querySelector(`li[data-id="${id}"][data-from="${CSS.escape(from)}"]`);
  const t = bucket(from).find(x => x.id === id);
  if(!li || !t) return;
  editId = id; editFrom = from; editDone = false;
  const tx = li.querySelector('.tx');
  tx.setAttribute('contenteditable', 'plaintext-only');
  li.setAttribute('draggable', 'false');
  li.classList.add('editing');
  tx.focus();
  const r = pt && (document.caretRangeFromPoint?.(pt.x, pt.y));
  const s = getSelection();
  s.removeAllRanges();
  if(r && tx.contains(r.startContainer)) s.addRange(r);
  else { const e2 = document.createRange(); e2.selectNodeContents(tx); e2.collapse(false); s.addRange(e2); }
  animate(`li[data-id="${id}"]`, 'edin');
  if(t.r && !routineHinted){ routineHinted = true; flash(T('thisOneOnly')); }
}
function commitEdit(cancel){
  if(editDone) return;
  editDone = true;
  const li = editRow(), tx = li?.querySelector('.tx');
  const t = bucket(editFrom).find(x => x.id === editId);
  const v = (tx?.textContent || '').replace(/\s+/g,' ').trim().slice(0, 200);
  editId = editFrom = null;
  if(tx){ tx.removeAttribute('contenteditable'); tx.blur(); }
  li?.classList.remove('editing');
  if(!t) return render();
  if(cancel || !v || v === t.t) return render();   // 빈 제목이면 원래대로 (지우려면 ⋯ → 삭제)
  t.t = v;
  touch();
}

function flash(msg, canUndo){
  document.querySelector('.toast')?.remove();
  clearTimeout(undoTimer);
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${canUndo ? `<button>${T('undo')}</button>` : ''}`;
  const bye = ()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 150); };
  el.querySelector('button')?.addEventListener('click', ()=>{ bye(); undo(); });
  document.body.appendChild(el);
  undoTimer = setTimeout(bye, canUndo ? 7000 : 2600);
}

/* ─── 빠른 이동 메뉴 ─── */
let menuCtx = null, menuCats = false, menuMore = false, menuAt = [0,0];
const md2 = k => { const d = dOf(k); return (d.getMonth()+1) + '/' + d.getDate(); };

/* 폰의 ⋯ 시트. 위에서 아래로: 머리(무슨 할 일인가) → 날짜 옮기기 타일 → 항목 → 위/아래 → 삭제.
   Material 3 바닥 시트 규격 + Todoist·TickTick 처럼 '내일'이 맨 위에 오게. */
function todoSheetHTML(t, from, spot){
  const tk = todayKey(), c = catOf(t.c);
  const where = isDateKey(from) ? md2(from) : from === 'later' ? T('later') : T('archive');
  const head = (title, sub, back) => `<div class="grab"><i></i></div>
    <div class="sh-head">
      ${back ? `<button class="x" data-a="back" aria-label="${T('category')}">${SI.back}</button>`
             : c ? `<span class="dot" style="background:${stripColor(c.c)}"></span>` : ''}
      <div class="ttl"><b>${esc(title)}</b><span>${sub}</span></div>
      <button class="x" data-a="close" aria-label="${T('close')}">${SI.x}</button></div>`;

  if(menuCats){                                       // 분류 고르기
    const row = (id, name, col) => `<button data-cat="${id}">
      <span class="cdot${col ? '' : ' none'}" ${col ? `style="background:${stripColor(col)}"` : ''}></span>
      <span>${esc(name)}</span>${(t.c || '') === id ? `<span class="k">${SI.check}</span>` : ''}</button>`;
    return head(T('category'), esc(t.t || ''), true)
      + row('', T('noCat'), null) + doc.cats.map(x => row(x.id, x.n, x.c)).join('')
      + `<div class="sep"></div><button data-a="newcat">${T('newCatShort')}</button>`;
  }

  const tiles = [];
  if(tk !== from)          tiles.push(['today',    T('today'),    md2(tk)]);
  if(shift(tk,1) !== from) tiles.push(['tomorrow', T('tomorrow'), md2(shift(tk,1))]);
  if(from !== 'later')     tiles.push(['later',    T('later'),    T('qtNoDate')]);
  const row = (a, icon, label, k, cls = '') =>
    `<button data-a="${a}" ${cls ? `class="${cls}"` : ''}>${icon}<span>${label}</span>${k ? `<span class="k">${k}</span>` : ''}</button>`;
  /* 자주 쓰는 것만 위에 — 나머지는 '더보기' 안에. 순서 바꾸기는 꾹 눌러 끌면 되므로 뺐다. */
  const more = (t.d ? '' : row('wait', SI.wait, t.w ? T('waitOff') : T('waitOn')))
    + row('sub', SI.list, T('subs'))
    + row('note', SI.note, T('note'))
    + (t.r && !t.d ? row('skip', SI.skip, T('skip')) : '')
    + (from !== 'ideas' ? row('ideas', SI.bulb, T('toIdeas')) : '');

  return head(t.t || '', where + (c ? ' · ' + esc(c.n) : ''), false)
    + `<div class="qlbl">${T('sheetMove')}</div>
       <div class="qgrid">
         ${tiles.map(([a, l, sub]) => `<button class="qt" data-a="${a}">${l}<small>${sub}</small></button>`).join('')}
         <label class="qt">${SI.cal}<span>${T('pickDate')}</span>
           <input type="date" id="menuDate" value="${isDateKey(from) ? from : tk}"></label>
       </div>`
    + row('edit', SI.edit, T('edit'))
    + row('cats', SI.tag, T('category'), `${esc(c?.n || T('noCat'))}${SI.chev}`)
    + row('more', menuMore ? SI.up : SI.down, T(menuMore ? 'menuLess' : 'menuMore'))
    + (menuMore ? more : '')
    + `<div class="sep"></div>` + row('del', SI.trash, T('del'), '', 'rm');
}

/* 시트를 아래로 끌어 닫기 — 손잡이와 머리에서만 시작한다 (목록 스크롤과 겹치지 않게).
   손가락을 놓을 때 90px 넘게 내려왔으면 닫고, 아니면 제자리로 돌아간다. */
function sheetDrag(){
  $('#sheet').addEventListener('pointerdown', e=>{
    if(e.pointerType === 'mouse' || !e.target.closest('.grab, .sh-head, .mh') || e.target.closest('button')) return;
    const sh = $('#sheet'), bd = $('#sheetWrap .sbd'), y0 = e.clientY;
    let dy = 0;
    sh.style.animation = 'none'; sh.style.transition = 'none';
    const mv = ev => {
      dy = Math.max(0, ev.clientY - y0);
      sh.style.transform = `translateY(${dy}px)`;
      bd.style.opacity = String(Math.max(.15, 1 - dy / 320));
    };
    const up = ()=>{
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      const go = dy > 90;
      sh.style.transition = 'transform 180ms var(--ease)';
      if(go) closeMenu(), closeSheet();
      else{ sh.style.transform = ''; bd.style.opacity = ''; }
      setTimeout(()=>{ sh.style.animation = sh.style.transition = sh.style.transform = ''; bd.style.opacity = ''; }, 260);
    };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
sheetDrag();
function openMenu(x, y, from, id){
  menuCtx = {from, id};
  menuAt = [x, y];
  const t = bucket(from).find(v=>v.id===id) || {};
  const tk = todayKey();
  const spot = orderSpot(from, id);            // 제 분류 안에서 몇 번째인가
  const opts = [
    ['today',    T('today'),     tk],
    ['tomorrow', T('tomorrow'),  shift(tk,1)],
  ].filter(([,,k]) => k !== from);
  const body = menuCats
    ? `<button data-a="back">‹ ${T('category')}</button><div class="sep"></div>
       <button data-cat="">${T('noCat')}</button>
       ${doc.cats.map(c=>`<button data-cat="${c.id}">
          <span class="sq" style="background:${stripColor(c.c)};width:9px;height:9px;border-radius:3px"></span>
          ${esc(c.n)}</button>`).join('')}
       <div class="sep"></div><button data-a="newcat">${T('newCatShort')}</button>`
    : `<button data-a="edit">${T('edit')}</button><div class="sep"></div>` +
    opts.map(([a,label,k])=>`<button data-a="${a}">${label}<span class="k">${k.slice(5)}</span></button>`).join('') +
    `<input type="date" id="menuDate" value="${isDateKey(from)?from:tk}">
     ${from!=='later' ? `<button data-a="later">${T('later')}</button>` : ''}
     <div class="sep"></div>
     <button data-a="cats">${T('category')}<span class="k">${esc(catOf(t.c)?.n || T('noCat'))}</span></button>
     <button data-a="more">${T(menuMore ? 'menuLess' : 'menuMore')}<span class="k">${menuMore ? '▴' : '▾'}</span></button>
     ${menuMore ? `${t.d ? '' : `<button data-a="wait">${t.w ? T('waitOff') : T('waitOn')}</button>`}
       <button data-a="sub">${T('subs')}</button>
       <button data-a="note">${T('note')}</button>
       ${t.r && !t.d ? `<button data-a="skip">${T('skip')}</button>` : ''}
       ${from!=='ideas' ? `<button data-a="ideas">${T('toIdeas')}</button>` : ''}` : ''}
     <div class="sep"></div>
     <button data-a="del" class="rm">${T('del')}</button>`;

  /* 손가락으로 쓸 때는 날짜 메뉴와 똑같이 바닥에서 올라온다.
     마우스용 팝업은 손가락에 너무 작고, 누른 줄에서 멀리 떨어진 곳에 떠서 무엇에 대한
     메뉴인지 알 수 없었다. 시트에는 어떤 할 일인지 제목을 얹는다. */
  if(!canDrag){
    todoSheet = true;
    $('#sheet').innerHTML = todoSheetHTML(t, from, spot);
    clearTimeout(sheetHideT);
    $('#sheetWrap').classList.remove('closing');
    $('#sheetWrap').hidden = false; ovOpen();
    return;
  }
  const m = $('#menu');
  clearTimeout(menuHideT); m.classList.remove('closing');   // 닫는 중이었으면 되살린다
  m.innerHTML = body;
  m.setAttribute('role', 'menu');
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x - w, innerWidth - w - 8)) + 'px';
  m.style.top  = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
let menuHideT = null, todoSheet = false;
function closeMenu(){
  const mm = $('#menu');
  menuCtx = null; menuCats = false; menuMore = false; catCtx = null;
  if(todoSheet){ todoSheet = false; closeSheet(); }
  if(mm.hidden) return;
  if(reduceMo()) return void (mm.hidden = true);
  mm.classList.add('closing');                   // 보이지 않는 판이 다음 클릭을 삼키지 않게
  clearTimeout(menuHideT);
  menuHideT = setTimeout(()=>{ mm.hidden = true; mm.classList.remove('closing'); }, 110);
}
const onTodoAction = e=>{
  const btn = e.target.closest('button'); if(!btn || !menuCtx) return;
  const a = btn.dataset.a, tk = todayKey(), {from, id} = menuCtx;
  if(a === 'close') return closeMenu();
  const t = bucket(from).find(v=>v.id===id);

  if(btn.dataset.cat !== undefined){               // 카테고리 고르기
    closeMenu();
    if(!t) return;
    if(btn.dataset.cat) t.c = btn.dataset.cat; else delete t.c;
    return touch();
  }
  if(a === 'more'){ menuMore = !menuMore; return openMenu(menuAt[0], menuAt[1], from, id); }
  if(a === 'cats'){ menuCats = true; return openMenu(menuAt[0], menuAt[1], from, id); }
  if(a === 'back'){ menuCats = false; return openMenu(menuAt[0], menuAt[1], from, id); }
  if(btn.dataset.cat === undefined && todoSheet && ['edit','newcat','sub','note'].includes(a)){
    todoSheet = false; closeSheet();               // 다른 화면으로 넘어가는 동작은 시트를 걷는다
  }
  if(a === 'newcat'){ closeMenu(); catForTodo = {from, id}; return openCat(null); }
  if(a === 'edit'){ closeMenu(); return startEdit(from, id); }
  if(a === 'wait' || a === 'skip' || a === 'sub' || a === 'note'){
    closeMenu();
    if(!t) return;
    if(a === 'sub'){ openSubs.add(id); subFocus = id; return render(); }
    if(a === 'note'){ openNotes.add(id); if(t.d && !doneOpen){ doneOpen = true; } return render(); }
    if(a === 'wait'){ if(t.w) delete t.w; else { t.w = true; t.s = false; } }
    else { t.sk = true; t.s = false; }
    return touch();
  }
  const to = a==='today' ? tk : a==='tomorrow' ? shift(tk,1) : a==='d2' ? shift(tk,2)
           : a==='later' ? 'later' : a==='ideas' ? 'ideas' : null;
  const row = document.querySelector(`li[data-id="${id}"]`);
  closeMenu();
  const go = ()=>{ snapshot(); moveTodo(from, id, to); if(to === null) flash(T('del'), true); };
  return to === null ? vanish(row, go) : go();
};
$('#menu').addEventListener('click', onTodoAction);
$('#sheet').addEventListener('click', onTodoAction);
const onTodoDate = e=>{
  if(e.target.id !== 'menuDate' || !menuCtx) return;
  const {from, id} = menuCtx, to = e.target.value;
  closeMenu();
  if(isDateKey(to)){ snapshot(); moveTodo(from, id, to); }
};
$('#menu').addEventListener('change', onTodoDate);
$('#sheet').addEventListener('change', onTodoDate);
document.addEventListener('pointerdown', e=>{
  if(!$('#menu').hidden && !e.target.closest('#menu') && !e.target.closest('.mv')) closeMenu();
});

/* ─── 날짜 단위 정리 (PC 우클릭 · 모바일 길게 누르기) ───
   평소 달력에는 아무 버튼도 늘어나지 않는다. 필요할 때만 나타난다. */
let dateCtx = null, dateSheet = false, copyMode = false;
const md = k => new Intl.DateTimeFormat(loc(), {month:'numeric', day:'numeric'}).format(dOf(k));

function dateMenuHTML(k){
  const tk = todayKey();
  const act = actionable(k), n = act.length;
  const total = bucket(k).length;
  const long = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'}).format(dOf(k));
  const quick = [[tk, T('today')], [shift(tk,1), T('tomorrow')]]
    .filter(([d]) => d !== k)
    .map(([d,label]) => `<button data-da="to" data-to="${d}">${T('moveAllTo')(label)}<span class="k">${md(d)}</span></button>`)
    .join('');
  const sm = sumOf(k);
  const state = n ? T('remainN')(n)
    : sm.waiting ? T('onlyWaiting')
    : sm.done && !sm.missed ? T('allDoneDay')
    : T('nothingLeft');
  const head = `<div class="mh">${long}<span>${state}</span></div>`;
  if(copyMode)                                          // 복사할 날짜를 고르는 중
    return `<div class="mh">${T('copyDay')}<span>${long}</span></div>
      <input type="date" id="copyDate" value="${shift(k,7)}">
      <button data-da="cancelCopy">${T('cancel')}</button>`;
  const copy = total ? `<div class="sep"></div><button data-da="copy">${T('copyDay')}</button>` : '';
  /* '이 날 기록 지우기'는 완료한 일까지 지운다.
     남은 일만 지우는 것과 결과가 같을 때는 둘을 겹쳐 두지 않는다. */
  const clear = total && total > n
    ? `<button data-da="clear" class="rm">${T('delDay')}<span class="k">${total}</span></button>` : '';
  return head +
    (n ? `${quick}
      <input type="date" id="bulkDate" value="${k}">
      <button data-da="later">${T('allLater')}</button>
      ${copy}
      <div class="sep"></div>
      <button data-da="del" class="rm">${T('delAll')}<span class="k">${n}</span></button>
      ${clear}`
       : `${copy.replace('<div class="sep"></div>','')}
      ${clear ? `<div class="sep"></div>${clear}` : ''}`);
}
let menuAtXY = [0,0];
function openDateMenu(x, y, k, sheet){
  if(!bucket(k).length){                       // 정리할 게 없는 날 — 대신 적을 수 있게 열어준다
    closeMenu(); closeSheet();
    /* 꾹 눌렀는데 아무 반응이 없으면 고장난 걸로 보인다.
       빈 날에 대고 할 수 있는 일은 '적기' 하나뿐이니 거기로 데려간다. */
    if(sheet){
      sel = k; cur = dOf(k); view = 'day';
      render(); revealDay();
      setTimeout(()=>$('#qd')?.focus(), 80);
    }
    return;
  }
  dateCtx = k; dateSheet = !!sheet;
  if(!sheet) menuAtXY = [x, y];
  if(sheet){
    $('#sheet').innerHTML = `<div class="grab"><i></i></div>` + dateMenuHTML(k);
    clearTimeout(sheetHideT);
    $('#sheetWrap').classList.remove('closing');
    $('#sheetWrap').hidden = false; ovOpen();
    return;
  }
  const m = $('#menu');
  clearTimeout(menuHideT); m.classList.remove('closing');   // 닫는 중이었으면 되살린다
  m.innerHTML = dateMenuHTML(k);
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top  = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
/* 시트가 열린 채로 뒤로 가기(갤럭시는 가장자리 쓸기)를 하면 앱이 통째로 꺼졌다.
   시트를 열 때 기록을 하나 쌓고, 뒤로 가기가 오면 그 기록을 써서 시트만 닫는다. */
let ovPushed = false, ovSkip = 0;
function ovOpen(){
  if(ovPushed) return;
  try{ history.pushState({dnOv:1}, ''); ovPushed = true; }catch{}
}
function ovDone(){                              // 화면에서 직접 닫았을 때 — 쌓아둔 기록을 되감는다
  if(!ovPushed) return;
  ovPushed = false; ovSkip++;
  history.back();
}
addEventListener('popstate', ()=>{
  if(ovSkip){ ovSkip--; return; }
  if(ovPushed){ ovPushed = false; closeMenu(); closeSheet(true); }   // 뒤로 가기로 닫힘 — 기록은 이미 되감겼다
});

let sheetHideT = null;
function closeSheet(fromBack){
  const w = $('#sheetWrap');
  if(!w.hidden){
    if(!fromBack) ovDone();
    if(reduceMo()) w.hidden = true;
    else {
      w.classList.add('closing');
      clearTimeout(sheetHideT);
      sheetHideT = setTimeout(()=>{ w.hidden = true; w.classList.remove('closing'); }, 150);
    }
  }
  if(!$('#menu').hidden) return;
  dateCtx = null; copyMode = false;
}
const reopenDate = () => openDateMenu(menuAtXY[0], menuAtXY[1], dateCtx, dateSheet);

function runDateAction(a, to){
  const k = dateCtx; if(!k) return;
  if(a === 'copy'){ copyMode = true; return reopenDate(); }
  if(a === 'cancelCopy'){ copyMode = false; return reopenDate(); }
  copyMode = false;
  closeMenu(); closeSheet();
  const ids = actionable(k).map(t => t.id);
  if(a === 'copyTo'){
    snapshot();
    const n = copyDay(k, to);
    if(n){ touch(); flash(T('copiedN')(n, md(to)), true); }
    return;
  }
  if(a === 'clear'){                                    // 완료한 일까지 이 날에서 전부 지운다
    const all = bucket(k).map(t => t.id);
    if(!all.length) return;
    if(!confirm(T('delDayAsk')(all.length))) return;     // 되돌릴 수는 있지만 기록이라 한 번 묻는다
    snapshot();
    moveTodos(k, all, null);
    delete doc.miss[k];                                  // 그날 놓친 개수도 같이 없앤다
    touch(); return flash(T('clearedN')(all.length), true);
  }
  if(!ids.length) return;
  if(a === 'del'){
    if(ids.length > 5 && !confirm(T('delAllAsk')(ids.length))) return;
    snapshot();
    moveTodos(k, ids, null);
    touch(); return flash(T('deletedN')(ids.length), true);
  }
  snapshot();
  const dest = a === 'later' ? 'later' : to;
  const n = moveTodos(k, ids, dest);
  if(!n) return;
  touch();
  flash(a === 'later' ? T('movedLater')(n) : T('movedN')(n, md(dest)), true);
}
const onDateAction = e => {
  const b = e.target.closest('button'); if(!b?.dataset.da) return;
  if(b.dataset.da === 'close') return closeSheet();
  runDateAction(b.dataset.da, b.dataset.to);
};
$('#menu').addEventListener('click', onDateAction);
$('#sheet').addEventListener('click', onDateAction);
const onBulkDate = e => {
  if(!isDateKey(e.target.value)) return;
  if(e.target.id === 'bulkDate') runDateAction('to', e.target.value);
  else if(e.target.id === 'copyDate') runDateAction('copyTo', e.target.value);
};
$('#menu').addEventListener('change', onBulkDate);
$('#sheet').addEventListener('change', onBulkDate);
$('#sheetWrap').addEventListener('click', e=>{
  if(!e.target.classList.contains('sbd')) return;
  if(todoSheet){ todoSheet = false; menuCtx = null; menuCats = false; }
  closeSheet();
});

$('#cal').addEventListener('contextmenu', e=>{
  const cell = e.target.closest('.cell, .wcard'); if(!cell) return;   // 1년 화면에는 없다
  e.preventDefault();
  openDateMenu(e.clientX, e.clientY, cell.dataset.k, false);
});
/* 길게 누르기 — 손가락이 움직이면 즉시 취소해서 스크롤을 방해하지 않는다 */
let lpTimer = null, lpAt = null, lpFired = 0;    // lpFired = 길게 누르기가 발동한 시각
$('#cal').addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse') return;
  const cell = e.target.closest('.cell, .wcard'); if(!cell) return;
  lpAt = {x:e.clientX, y:e.clientY}; lpFired = 0;
  lpTimer = setTimeout(()=>{ lpTimer = null; lpFired = Date.now(); openDateMenu(0,0,cell.dataset.k,true); }, 520);
});
$('#cal').addEventListener('pointermove', e=>{
  if(lpTimer && Math.hypot(e.clientX-lpAt.x, e.clientY-lpAt.y) > 10){ clearTimeout(lpTimer); lpTimer = null; }
});
for(const ev of ['pointerup','pointercancel','pointerleave'])
  $('#cal').addEventListener(ev, ()=>{ clearTimeout(lpTimer); lpTimer = null; });

/* 손가락으로 휙 넘기기 — 끄는 동안 달력이 손가락을 따라오고, 놓으면 넘어가거나 제자리로 돌아온다.
   왼쪽으로 휙 = 다음 기간 (종이를 왼쪽으로 넘기는 느낌 — 달력 앱들의 공통 방향).
   한 손가락만 따라가고(두 번째 손가락이 가로채지 않게),
   세로로 더 많이 움직이면 곧바로 손을 떼서 스크롤을 방해하지 않는다. */
let swAt = null, swipedAt = 0, swMoved = false;   // swipedAt = 마지막으로 넘긴 시각
const swSkin = (x, o) => {
  const cal = $('#cal');
  cal.style.transform = x === null ? '' : `translateX(${x}px)`;
  cal.style.opacity = o === null ? '' : String(o);
};
$('#cal').addEventListener('pointerdown', e=>{
  swAt = (e.pointerType === 'mouse' || !e.isPrimary) ? null
       : {id:e.pointerId, x:e.clientX, y:e.clientY, t:Date.now()};
  swMoved = false;
});
$('#cal').addEventListener('pointermove', e=>{
  if(!swAt || swAt.id !== e.pointerId) return;
  const dx = e.clientX - swAt.x, dy = e.clientY - swAt.y;
  if(!swMoved){
    if(Math.abs(dx) < 12) return;
    if(Math.abs(dx) < Math.abs(dy) * 1.2){ swAt = null; return; }   // 세로로 긋는 중 — 스크롤에 양보
    swMoved = true;
    $('#cal').style.transition = 'none';
  }
  swSkin(dx * .38, Math.max(.5, 1 - Math.abs(dx) / 380));           // 손가락을 따라오되 덜 움직인다
});
const swEnd = e => {
  const a = swAt;
  if(!a || a.id !== e.pointerId) return;
  swAt = null;
  const cal = $('#cal');
  if(!swMoved){ swSkin(null, null); return; }
  swMoved = false;
  const dx = e.clientX - a.x, dy = e.clientY - a.y;
  const go = Math.abs(dx) >= 55 && Math.abs(dx) >= Math.abs(dy) * 1.2
             && Date.now() - lpFired >= 700;
  if(!go){                                                          // 모자라면 제자리로
    cal.style.transition = 'transform .16s ease-out, opacity .16s ease-out';
    swSkin(null, null);
    setTimeout(()=>{ cal.style.transition = ''; }, 180);
    return;
  }
  swipedAt = Date.now();                                            // 넘긴 뒤 따라오는 클릭은 무시
  cal.style.transition = '';
  swSkin(null, null);
  cal.classList.add(dx > 0 ? 'slideR' : 'slideL');                  // 새 달은 반대쪽에서 들어온다
  setTimeout(()=>cal.classList.remove('slideL','slideR'), 200);
  navigatePeriod(dx < 0 ? 1 : -1);                                  // 왼쪽으로 휙 → 다음 기간
};
$('#cal').addEventListener('pointerup', swEnd);
$('#cal').addEventListener('pointercancel', e=>{
  if(swAt?.id !== e.pointerId) return;
  swAt = null; swMoved = false;
  $('#cal').style.transition = 'transform .16s ease-out, opacity .16s ease-out';
  swSkin(null, null);
});

/* 사용자가 아직 해야 하는 일 — 완료·건너뜀·기다림은 뺀다.
   달력의 ✓, 알림, 날짜 단위 정리가 모두 이 정의를 쓴다. */
const actionable = k => bucket(k).filter(t => !t.d && !t.sk && !t.w);

/* 옮기기는 여기 하나로 모은다 (개별 ⋯ · 드래그 · 날짜 단위 정리가 같은 길을 쓴다).
   한 번에 바꾸고 한 번만 저장·동기화한다. */
function moveTodos(from, ids, to){
  const list = doc.todos[from];
  if(!list || from === to) return 0;
  const set = new Set(ids);
  const moving = list.filter(t => set.has(t.id));
  if(!moving.length) return 0;
  const rest = list.filter(t => !set.has(t.id));
  if(rest.length) doc.todos[from] = rest; else delete doc.todos[from];
  if(to === null){ tomb(...ids); return moving.length; }   // 삭제 — 다시 살아 돌아오지 않게
  const tk = todayKey();
  /* mv 는 '미룬 횟수'다. 뒤로 미는 것만 센다 —
     떠오른 일·나중에에서 날짜를 정하거나, 앞당기거나, 분류만 바꾸는 것은 미룬 게 아니다. */
  const later = isPostpone(from, to);
  for(const t of moving){
    if(later){ t.mv = (t.mv||0) + 1; t.mvd = tk; }
    t.s = false;                                        // '오늘 꼭'은 그날에만 의미가 있다
    if(isDateKey(to)){ if(!t.o) t.o = to; }
    else t.rv = tk;
  }
  (doc.todos[to] ||= []).push(...moving);
  return moving.length;
}
/* 옮기기는 데이터만 옮긴다. 보고 있던 날짜는 그대로 — 계획을 정리하는 중에 화면이 튀지 않게.
   어디로 갔는지는 토스트로 알려준다. */
function moveTodo(from, id, to){
  if(!moveTodos(from, [id], to)) return;
  touch();
  if(isDateKey(to) && to !== from) flash(T('movedTo')(md(to)), true);
}
/* 그날 계획을 새 계획으로 옮겨 적는다 — 완료 기록·메모는 따라가지 않고, 반복은 제외 */
function copyDay(from, to){
  const src = bucket(from).filter(t => !t.r);
  if(!src.length) return 0;
  const tk = todayKey();
  const copies = src.map(t => ({
    id:uid(), t:t.t, d:false, c:t.c, o:to, cr:tk, mv:0,
    ...(t.sub?.length ? {sub: t.sub.map(s => ({t:s.t, d:false}))} : {})
  }));
  (doc.todos[to] ||= []).push(...copies);
  return copies.length;
}

function navigatePeriod(n){ cur = stepPeriod(calView, cur, n); render(); }
/* 보기를 바꾼다. 검색·보관함을 보고 있었다면 달력으로 돌아온다. */
function setCalView(v){
  if(!VIEWS.includes(v) || v === calView && view === 'day') return;
  smooth(() => {
    calView = v;
    localStorage.setItem('daynua.calView', v);
    view = 'day';
    render();
    fade('#cal'); fade('#side');          // 주·월·년은 좌우로 밀지 않는다 — 다른 화면이니 갈아끼운다
    scrollTo({top:0, behavior:'auto'});
  });
}
/* 모바일에서 날짜를 눌렀는데 그날 목록이 화면 밖이면 그때만 살짝 올려준다 — 스크롤을 빼앗지 않는다 */
function revealDay(){
  if(matchMedia('(min-width:720px)').matches) return;
  const el = $('#side'); if(!el?.firstElementChild) return;
  const r = el.getBoundingClientRect();
  if(r.top > (calView === 'week' ? innerHeight * .4 : innerHeight - 120))   // 주간은 7줄이 길어 패널이 접힌 아래에 있다
    el.scrollIntoView({behavior: reduceMo() ? 'auto' : 'smooth', block:'start'});
}
/* 화살표로 넘길 때만 아주 작게 이어준다 (7px). 휙 넘기기는 손가락을 따라온 만큼 제 폭이 따로 있다 */
$('#prev').onclick = ()=> smooth(()=>{ navigatePeriod(-1); calStep(-1); }, 'prev');
$('#next').onclick = ()=> smooth(()=>{ navigatePeriod(1); calStep(1); }, 'next');
/* '오늘'은 보기가 아니라 이동이다 — 보던 보기를 그대로 두고 오늘이 든 기간으로 간다 */
$('#today').onclick = ()=>{
  /* 지금 보는 기간보다 오늘이 앞이면 앞쪽에서, 뒤면 뒤쪽에서 들어온다. 같은 기간이면 날짜만 옮긴다 */
  const per = d => calView === 'year' ? String(d.getFullYear()) : calView === 'month' ? key(d).slice(0,7) : weekGrid(key(d), ws())[0];
  const now = new Date(), a = per(cur), b = per(now);
  smooth(()=>{ view='day'; cur=now; sel=key(now); render(); },
    a === b ? 'pick' : a < b ? 'next' : 'prev',
    () => { revealDay(); if(calView === 'year') $('#cal .yd.today')?.scrollIntoView({block:'center', behavior: reduceMo() ? 'auto' : 'smooth'}); });
};
$('#viewSeg').onclick = e=>{ const v = e.target.closest('button')?.dataset.v; if(v) setCalView(v); };
$('#btnIdeas').onclick = ()=> smooth(()=>{ view = view==='ideas' ? 'day' : 'ideas'; ideasFocus = view==='ideas' && canDrag; render(); fade('#side'); }, 'swap', ()=>{ if(view !== 'day') revealDay(); });
$('#btnSearch').onclick = ()=> smooth(()=>{ view = view==='search' ? 'day' : 'search'; render(); fade('#side'); }, 'swap', ()=>{ if(view !== 'day') revealDay(); });
$('#btnStats').onclick = ()=> smooth(()=>{ view = view==='stats' ? 'day' : 'stats'; render(); fade('#side'); }, 'swap', ()=>{ if(view !== 'day') revealDay(); });

/* ─── 카테고리 ─── */
let catEdit = null, catColor = PALETTE[0], catArmed = false, catForTodo = null, catForQuick = false;
function setQuickCat(id){
  quickCat = catOf(id) ? id : '';
  localStorage.setItem('daynua.qcat', quickCat);
}
function openCat(id){
  catEdit = id ? catOf(id) : null;
  catArmed = false;
  catColor = catEdit ? catEdit.c : PALETTE[doc.cats.length % PALETTE.length];
  $('#catName').value = catEdit ? catEdit.n : '';
  $('#catName').placeholder = T('catPh');
  renderCat();
  $('#cat').showModal();
  setTimeout(()=>$('#catName').focus(), 60);
}
function renderCat(){
  $('#catTitle').textContent = catEdit ? T('catEditT') : T('catNew');
  $('#catColorLbl').textContent = T('color');
  $('#catCancel').textContent = T('cancel');
  $('#catSave').textContent = T('save');
  $('#catDel').textContent = catArmed ? T('armed') : T('delCat');
  $('#catDel').classList.toggle('armed', catArmed);
  $('#catDel').hidden = !catEdit;
  $('#catSw').innerHTML = PALETTE.map(c=>
      `<button data-c="${c}" style="background:${c}" class="${catColor===c?'on':''}"></button>`).join('')
    + `<input type="color" id="catCustom" value="${/^#[0-9a-fA-F]{6}$/.test(catColor)?catColor:'#888888'}">`;
  const pv = $('#catPrev');
  pv.querySelector('.sq').style.background = catColor;
  pv.querySelector('.t').textContent = $('#catName').value.trim() || T('newCatName');
  pv.querySelector('.t').style.color = ink(catColor);
}
$('#catName').addEventListener('input', renderCat);
$('#catName').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#catSave').click(); } });
$('#catSw').addEventListener('click', e=>{ const c = e.target.dataset.c; if(c){ catColor = c; renderCat(); } });
$('#catSw').addEventListener('input', e=>{ if(e.target.id==='catCustom'){ catColor = e.target.value; renderCat(); } });
$('#catCancel').onclick = ()=>{ catForTodo = null; catForQuick = false; $('#cat').close(); };
$('#catSave').onclick = ()=>{
  const n = $('#catName').value.trim();
  if(!n) return $('#catName').focus();
  if(catEdit){ catEdit.n = n; catEdit.c = catColor; }
  else {
    const c = {id:uid(), n, c:catColor};
    doc.cats.push(c);
    if(catForTodo){                                  // 메뉴에서 바로 만든 경우 그 할 일에 붙여준다
      const t = bucket(catForTodo.from).find(x=>x.id===catForTodo.id);
      if(t) t.c = c.id;
    }
    if(catForQuick) setQuickCat(c.id);               // 적다가 만든 경우 바로 그 분류로 이어서 적는다
    animate(`#qcat [data-q="${c.id}"]`, 'pop');
  }
  catForTodo = null; catForQuick = false;
  $('#cat').close(); touch();
  if(quickCat) $('#qd')?.focus();
};
/* 분류를 지우는 것은 '분류'만 지우는 것이다 — 할 일도 반복 할 일도 살아남고 분류만 풀린다 */
function deleteCat(id){
  doc.cats = doc.cats.filter(x=>x.id!==id);
  tomb(id);
  for(const r of doc.rout) if(r.c === id) delete r.c;
  if(quickCat === id) setQuickCat('');
  for(const k in doc.todos) for(const t of doc.todos[k]) if(t.c===id) delete t.c;
}
$('#catDel').onclick = ()=>{
  if(!catArmed){ catArmed = true; return renderCat(); }
  snapshot();
  deleteCat(catEdit.id);
  $('#cat').close(); touch(); flash(T('del'), true);
};

/* ─── 분류 칩 자체 관리 (우클릭 · 꾹 누르기) ─── */
let catCtx = null, chipLp = null, chipLpFired = 0;
function openCatMenu(x, y, id){
  const c = catOf(id); if(!c) return;
  catCtx = id;
  const i = doc.cats.findIndex(v => v.id === id);
  const m = $('#menu');
  clearTimeout(menuHideT); m.classList.remove('closing');   // 닫는 중이었으면 되살린다
  m.innerHTML = `<div class="mh"><span class="sq" style="background:${stripColor(c.c)};width:9px;height:9px;
      border-radius:3px;display:inline-block"></span> ${esc(c.n)}</div>
    <button data-ca="edit">${T('edit')}</button>
    ${i > 0 ? `<button data-ca="up">${T('moveUp')}</button>` : ''}
    ${i < doc.cats.length-1 ? `<button data-ca="down">${T('moveDown')}</button>` : ''}
    <div class="sep"></div>
    <button data-ca="del" class="rm">${T('del')}</button>`;
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top  = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
}
$('#menu').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b?.dataset.ca || !catCtx) return;
  const id = catCtx, a = b.dataset.ca;
  closeMenu();
  if(a === 'edit') return openCat(id);
  if(a === 'del'){ snapshot(); deleteCat(id); touch(); return flash(T('del'), true); }
  const i = doc.cats.findIndex(c => c.id === id), j = a === 'up' ? i-1 : i+1;
  if(j < 0 || j >= doc.cats.length) return;
  [doc.cats[i], doc.cats[j]] = [doc.cats[j], doc.cats[i]];
  touch();
});
$('#side').addEventListener('contextmenu', e=>{
  const chip = e.target.closest('#qcat button[data-q]');
  if(!chip || !chip.dataset.q || chip.dataset.q === '+') return;
  e.preventDefault();
  openCatMenu(e.clientX, e.clientY, chip.dataset.q);
});
$('#side').addEventListener('pointerdown', e=>{
  if(e.pointerType === 'mouse') return;
  const chip = e.target.closest('#qcat button[data-q]');
  if(!chip || !chip.dataset.q || chip.dataset.q === '+') return;
  const at = {x:e.clientX, y:e.clientY};
  chipLpFired = 0;
  chipLp = setTimeout(()=>{
    chipLp = null; chipLpFired = Date.now();
    const r = chip.getBoundingClientRect();
    openCatMenu(r.left, r.bottom + 6, chip.dataset.q);
  }, 520);
  const cancel = ev => {
    if(ev.type === 'pointermove' && Math.hypot(ev.clientX-at.x, ev.clientY-at.y) <= 10) return;
    clearTimeout(chipLp); chipLp = null;
    for(const n of ['pointermove','pointerup','pointercancel']) $('#side').removeEventListener(n, cancel);
  };
  for(const n of ['pointermove','pointerup','pointercancel']) $('#side').addEventListener(n, cancel);
});

/* ─── 설정 ─── */
let COUNTRIES = null;
async function countries(){
  if(COUNTRIES) return COUNTRIES;
  const c = localStorage.getItem('daynua.countries');
  if(c) return COUNTRIES = JSON.parse(c);
  try{
    const r = await fetch('https://date.nager.at/api/v3/AvailableCountries');
    COUNTRIES = await r.json();
    localStorage.setItem('daynua.countries', JSON.stringify(COUNTRIES));
  }catch{ COUNTRIES = [{countryCode:'KR',name:'South Korea'},{countryCode:'US',name:'United States'},
                       {countryCode:'JP',name:'Japan'},{countryCode:'GB',name:'United Kingdom'}]; }
  return COUNTRIES;
}

function openImport(){

  $('#impPick').onclick = ()=>$('#impFile').click();
