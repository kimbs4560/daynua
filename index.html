<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8f1">
<title>Daynua</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#faf9f6; --card:#fff; --ink:#1b1b20; --sub:#63626c; --faint:#8a877f;
  --line:#e3e0d9; --fill:#efece5; --accent:#c9502f; --accent-ink:#b4441f; --on-accent:#fff;
  --sat:#35619f; --sun:#b4441f; --danger:#c93f2b;
  --r:14px;
  color-scheme:light;                 /* 날짜/시간 입력 같은 기본 위젯도 테마를 따르게 */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131316; --card:#1c1c21; --ink:#edece8; --sub:#a2a1ac; --faint:#78777f;
    --line:#33333c; --fill:#26262d; --accent:#e8714d; --accent-ink:#e8714d; --on-accent:#111;
    --sat:#7ea6e8; --sun:#e8714d; --danger:#f2705a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131316; --card:#1c1c21; --ink:#edece8; --sub:#a2a1ac; --faint:#78777f;
  --line:#33333c; --fill:#26262d; --accent:#e8714d; --accent-ink:#e8714d; --on-accent:#111;
  --sat:#7ea6e8; --sun:#e8714d; --danger:#f2705a;
  color-scheme:dark;
}
/* ── 움직임 ──
   장식이 아니라 '무엇이 바뀌었는지' 를 잇는 선이다. 작게 · 빠르게 · 눈에 띄지 않게.
   같은 종류의 것은 같은 시간을 쓴다 — 그래야 앱이 한 덩어리로 느껴진다.
   다시 그릴 때마다 반복되면 안 되는 등장 효과는 CSS 가 아니라 animate() 가 한 번만 붙인다. */
:root{ --mo-fast:120ms; --mo:180ms; --mo-slow:240ms; --ease:cubic-bezier(.2,0,0,1) }
@keyframes moIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes moFade{from{opacity:0}to{opacity:1}}
@keyframes moPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes moCk{from{transform:scale(.86)}to{transform:none}}
@keyframes moStepL{from{opacity:.55;transform:translateX(7px)}to{opacity:1;transform:none}}
@keyframes moStepR{from{opacity:.55;transform:translateX(-7px)}to{opacity:1;transform:none}}
@keyframes moMenu{from{opacity:0;transform:translateY(-3px) scale(.985)}to{opacity:1;transform:none}}
@keyframes moDlg{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes moSheet{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes moToast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
.in{animation:moIn var(--mo) var(--ease)}
.pop{animation:moPop 170ms var(--ease)}
.vfade{animation:moIn 170ms var(--ease)}
#cal.stepL{animation:moStepL var(--mo) var(--ease)}
#cal.stepR{animation:moStepR var(--mo) var(--ease)}
/* 사라지는 것은 사라지는 게 보여야 한다 — 그래야 '뭐가 없어졌지' 가 안 된다 */
li.out,.subs .s.out{opacity:0;transform:scale(.985);
  transition:opacity var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}
.toast.out{opacity:0;transform:translate(-50%,6px);
  transition:opacity var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}

input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{opacity:.75;cursor:pointer}
input[type=date]:hover::-webkit-calendar-picker-indicator,
input[type=time]:hover::-webkit-calendar-picker-indicator{opacity:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

#app{max-width:560px;margin:0 auto;padding:18px 16px 84px}
/* 오른쪽 아래 설정 단추가 목록의 마지막 줄을 덮고 있었다 */
@media (max-width:899px){ #app{padding-bottom:116px} }
@media (min-width:900px){
  #app{max-width:1180px;padding:26px 24px 40px;display:grid;gap:0 20px;
    grid-template-columns:1fr 400px;grid-template-areas:"top top" "bar bar" "cal side";align-items:start}
  .top{grid-area:top} .bar2{grid-area:bar;margin-bottom:14px}
  #cal{grid-area:cal;margin:0;padding:16px;min-width:0}
  #side{grid-area:side;position:sticky;top:26px;max-height:calc(100vh - 52px);overflow-y:auto;padding:16px}
  /* 주간은 7칸이 나란히 서야 하므로 달력 쪽에 조금 더 준다 */
  @media (min-width:1100px){ #app.v-week{grid-template-columns:1fr 366px} }
  /* 1년 화면은 옆칸 없이 전체 폭 — 그래야 날짜 칸이 누를 만한 크기가 된다 */
  #app.overview{grid-template-columns:1fr;grid-template-areas:"top" "bar" "cal"}
  #app.overview #side{display:none}
  .bar2 h1{font-size:30px}
  .grid{gap:6px}
  li{padding:8px 2px}
}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:6px}
.brand{font-size:15px;font-weight:800;letter-spacing:3px;flex:1;min-width:0}
.brand b{color:var(--accent-ink)}
.iconbtn{width:34px;height:34px;border-radius:10px;color:var(--sub);font-size:15px;flex:none;
  display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn,.nav,.chip,.acct,.vseg button,.dnbtn,.ch,.res .again,.nudge .acts button,
.impbox,.qcat button,.danger,#menu button,.ymt,.fold{
  transition:background var(--mo-fast) var(--ease),color var(--mo-fast) var(--ease),
             border-color var(--mo-fast) var(--ease),transform var(--mo-fast) var(--ease)}
/* 눌렸다는 것만 알려주면 된다. 달력 칸이나 할 일 줄 전체에는 쓰지 않는다 — 화면이 들썩인다 */
.iconbtn:active,.nav:active,.chip:active,.acct:active,.vseg button:active,
.dnbtn:active,.row button:active,#sheet button:active,.days button:active{transform:scale(.97)}
.iconbtn:hover{background:var(--fill);color:var(--ink)}
.iconbtn.on{background:var(--ink);color:var(--bg)}
.iconbtn .cnt{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;
  background:var(--accent);color:var(--on-accent);font-size:9.5px;font-weight:800;line-height:15px;padding:0 3px}
.acct{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--sub);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;max-width:170px;flex:none}
.acct:hover{border-color:var(--faint)}
.acct .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 좁은 화면에서는 이름이 윗줄을 다 먹지 않게 아바타만 — 누르면 계정 창에서 보인다.
   단, 로그인하지 않았을 때는 글자를 남긴다. 이건 상태가 아니라 해야 할 일이다. */
@media (max-width:560px){ .acct{padding:4px;max-width:none} .acct:not(.out) .nm{display:none}
  .acct.out{padding:4px 10px 4px 4px} }
.acct.out{border-color:var(--accent);color:var(--accent)}
.acct.out .av{background:transparent;border:1px dashed var(--accent);color:var(--accent)}

#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:17px;background:var(--ink);border:0;
  box-shadow:0 8px 24px rgba(0,0,0,.22);line-height:0;color:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:5;transition:transform .18s}
#fab svg{width:23px;height:23px}
#fab:hover{transform:rotate(45deg) scale(1.06)}
#fab:active{transform:scale(.96)}

.bar2{display:flex;align-items:center;gap:8px;row-gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* '오늘'과 보기 선택기는 한 덩어리로 오른쪽 끝. 자리가 모자라면 둘이 함께 아랫줄로 내려가고,
   제목이 점 세 개로 잘리는 일은 없다 (영어는 Week/Month/Year 라 한국어보다 넓다) */
.vgroup{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
/* 좁은 화면에서는 한 줄을 지키되 여백부터 줄인다 — 제목이 잘리는 것보다 낫다.
   연도는 접는다 ('년' 보기에서 본다). 영어는 Week/Month/Year 라 한국어보다 넓어 더 조인다. */
@media (max-width:420px){
  .bar2{gap:4px}
  .bar2 h1 small{display:none}
  .nav{width:26px;height:28px;font-size:18px}
  .vseg button{padding:6px 6px}
  #today{padding:6px 7px}
}
.bar2 h1{font-size:clamp(17px, 5.2vw, 25px);margin:0;font-weight:800;letter-spacing:-.6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:92px}
.bar2 h1 small{font-size:.54em;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:5px}
.nav{width:30px;height:32px;border-radius:9px;color:var(--sub);font-size:19px;line-height:1;flex:none}
.nav:hover{background:var(--fill)}
.chip{font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:9px;padding:6px 10px;flex:none}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 주 · 월 · 년 — 지금 보고 있는 것만 강조. '오늘'과 역할이 다르므로 생김새도 다르다.
   (설정 안의 토글도 .seg 를 쓰므로 이름을 따로 둔다 — 스타일이 새지 않게) */
.vseg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px}
.vseg button{font-size:12px;font-weight:700;color:var(--sub);padding:6px 10px;line-height:1.1;
  border-right:1px solid var(--line);white-space:nowrap}
.vseg button:first-child{border-radius:8px 0 0 8px}
.vseg button:last-child{border-right:0;border-radius:0 8px 8px 0}
.vseg button:hover{background:var(--fill);color:var(--ink)}
.vseg button.on{background:var(--accent);color:var(--on-accent)}
@media (max-width:359px){ .vseg button{padding:6px 5px;font-size:11.5px} .chip{padding:6px 6px;font-size:11.5px} }

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
#cal{margin-bottom:12px;touch-action:pan-y pinch-zoom}
/* 쓸어 넘길 때 아주 짧게 따라 움직인다 — 넘어갔다는 걸 손이 알아채게 */
@keyframes slideL{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-26px);opacity:.4}to{transform:none;opacity:1}}
#cal.slideL{animation:slideL .2s cubic-bezier(.2,.9,.3,1)}
#cal.slideR{animation:slideR .2s cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion:reduce){ #cal.slideL,#cal.slideR{animation:none} }
#app.overview #side{display:none}

/* ── 달력 ──
   색 = 무슨 종류의 일인가 · 취소선 = 그 할 일을 했는가 · ✓ = 그날 계획을 다 끝냈는가.
   셋은 서로 의미를 겹치지 않는다. 배경을 완료율로 채우던 방식은 없앴다. */
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.wk span{text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{position:relative;min-height:62px;user-select:none;-webkit-touch-callout:none;border-radius:8px;background:var(--fill);overflow:hidden;
  cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;
  padding:4px 4px 5px;
  transition:border-color var(--mo) var(--ease),background var(--mo-fast) var(--ease)}
.cell:hover{background:var(--line)}
/* 폰에서는 달력이 첫 화면의 절반을 먹어 할 일이 한 줄도 안 보였다 */
@media (max-width:899px){ .cell{min-height:52px} }
/* 길게 누르기 — 500ms 동안 아무 반응이 없으면 이상하다. 살짝 눌린 티만 낸다 */
@media (hover:none){ .cell:active,.wcard:active{background:var(--line);transition-delay:90ms} }
.cellTop{position:relative;display:flex;align-items:center;justify-content:center;min-height:17px}
.cell .n{font-size:12px;font-weight:700;line-height:17px;text-align:center}
/* ✓ 는 날짜를 밀어내지 않게 오른쪽 위에 얹는다 */
/* 그날 계획을 다 끝냈다는 표시.
   10px 짜리 갈고리는 있어도 눈에 안 들어왔다 — 채운 동그라미로 바꾼다.
   (✓ 는 다시 그릴 때마다 튀면 안 된다 — 끝낸 그 순간에만 animate 가 .pop 을 붙인다) */
.chk{position:absolute;right:-1px;top:2px;width:17px;height:17px;padding:3.5px;
  border-radius:50%;background:var(--accent);color:var(--on-accent)}
/* 온전히 끝낸 날은 꽉 찬 배지, 미룬 게 있어 '남은 것만 없는' 날은 테두리만.
   둘을 같은 모양으로 그리면 ✓ 가 거짓말이 되고, 하나만 그리면 며칠씩 아무 표시도 안 남는다. */
.fin.soft .chk{background:none;border:2px solid var(--accent);color:var(--accent-ink)}
/* 폰에서는 '남은 개수'가 서던 줄이 완료한 날엔 비어 있다 — 그 자리를 쓴다.
   달력 배경을 완료율로 칠하던 방식은 예전에 없앴다(색은 '분류'의 몫). 자리만 빌린다. */
@media (max-width:899px){
  .cell .chk{left:50%;right:auto;top:20px;transform:translateX(-50%);width:16px;height:16px;padding:3px}
  /* 배지가 들어선 만큼 분류 띠를 내린다 — 개수가 서던 자리를 빌렸으니 자리값도 치른다 */
  .cell.fin .strip{margin-top:21px}
}
/* 숫자 색은 건드리지 않는다. 지금도 일요일·공휴일·오늘이 강조색을 쓰고 있어서
   완료까지 같은 색을 쓰면 무엇을 뜻하는 색인지 알 수 없게 된다 — 뜻은 배지 하나로 족하다. */
.cell.out{background:none}                     /* 다른 달은 '옅게'가 아니라 '비워서' 구분 */
.cell.out:hover{background:var(--fill)}
.cell.out .n{color:var(--sub)}                 /* 흐려 보여도 며칠인지는 읽혀야 한다 */
.cell.out .left,.cell.out .strip{display:none} /* 다른 달 잔여 개수·구성 막대는 군더더기 */
.cell.out .e,.cell.out .more{opacity:.7}
/* 오늘과 '고른 날'은 다른 것을 말한다 — 둘이 겹쳐도 둘 다 보이게 테두리와 숫자로 나눈다 */
.cell.sel,.wcard.sel{border-color:var(--ink)}
.cell.today .n,.wcard.today .wn{color:var(--accent-ink)!important;font-weight:800}
.cell.today .n::after,.wcard.today .wn::after{content:"";position:absolute;left:50%;bottom:-3px;
  transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cell .n,.wcard .wn{position:relative}
/* 끄는 중인 칸은 테두리로만 말한다 — 달력이 커졌다 작아지면 어디에 놓는지 알 수 없다 */
.cell.over{border-color:var(--accent);border-style:dashed;background:var(--line)}
.cell .left{font-size:9.5px;font-weight:800;color:var(--sub);text-align:center;margin-top:1px}
.cell .hn,.cell .dn,.ev,.more{display:none}
/* 그날의 구성 — 완료 여부와 무관하게 '무엇을 계획했는지'만 말한다 */
.strip{margin:5px 3px 0;display:flex;gap:1px;height:3px;border-radius:2px;overflow:hidden}
.strip i{display:block;background:var(--c)}
.strip i.none{background:var(--faint)}
@media (min-width:900px){
  .cell{min-height:96px;padding:5px 7px 7px;border-radius:10px}
  .cellTop{justify-content:flex-start}
  .cell .n{font-size:13px}
  .chk{top:1px;right:0;width:18px;height:18px;padding:4px}
  .cell .left{display:none}
  .cell .hn{display:block;font-size:9px;font-weight:700;color:var(--sun);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
  .cell .dn{display:block;font-size:9px;color:var(--sub);font-style:italic;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev{display:flex;flex-direction:column;gap:2px;margin-top:3px;align-items:stretch}
  .e{font-size:10.5px;line-height:1.45;font-weight:600;padding-left:5px;color:var(--ink);
    border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .e.done{opacity:.75;text-decoration:line-through;text-decoration-thickness:1px}
  .more{display:block;font-size:9.5px;font-weight:700;color:var(--sub);padding-left:7px;margin-top:1px}
  .strip{height:4px;margin:7px 4px 0}
}

/* ── 주간 ──
   모바일은 7줄 카드, PC 는 7칸. 시간축은 없다 — 그 날에 '무엇을' 하기로 했는지만 본다. */
.week{display:flex;flex-direction:column;gap:5px;min-width:0}
.wcard{background:var(--fill);border:1.5px solid transparent;border-radius:10px;cursor:pointer;
  padding:7px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;
  min-height:46px;user-select:none;-webkit-touch-callout:none;
  transition:border-color var(--mo) var(--ease),background var(--mo-fast) var(--ease)}
.wcard:hover{background:var(--line)}
.wcard.over{border-color:var(--accent);border-style:dashed}
.wh{display:flex;align-items:center;gap:5px;min-width:74px}
.wh .wd{font-size:11px;font-weight:700;color:var(--sub)}
.wh .wn{font-size:15px;font-weight:800;line-height:1.1}
.wh .wsp{flex:1}
.wh .wleft{font-size:10px;font-weight:800;color:var(--sub);background:var(--card);
  border-radius:7px;padding:1px 6px;line-height:1.5}
.wcard .chk{position:static}
.wcard .strip{grid-column:1/-1;margin:3px 0 0;height:3px}
.wl{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.wl .e{font-size:12px;font-weight:600;color:var(--ink);padding-left:6px;border-left:2px solid var(--c);
  overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.4}
.wl .e.done{opacity:.72;text-decoration:line-through}
.wl .e[data-i="2"],.wl .e[data-i="3"],.wl .e[data-i="4"]{display:none}
.wl .more{display:inline;font-size:10.5px;font-weight:700;color:var(--sub);flex:none}
.wl .more.d{display:none}
.whn{grid-column:2;font-size:10.5px;font-weight:700;color:var(--sun)}
/* 넉넉한 폭에서는 한 줄에 더 보여준다 (가로 카드 그대로) */
@media (min-width:600px){
  .wl .e[data-i="2"],.wl .e[data-i="3"]{display:block}
  .wl .more.m{display:none}
  .wl .more.d{display:inline}
}
/* 7칸이 나란히 서도 글자가 읽히는 폭부터 세로 칸으로 — 1024 에서 억지로 7칸을 만들지 않는다 */
@media (min-width:1100px){
  .week{flex-direction:row;gap:6px;align-items:stretch}
  .wcard{flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;
    gap:0;min-height:236px;padding:8px 8px 10px;border-radius:12px}
  .wh{min-width:0}
  .wh .wd{font-size:11.5px}
  .wcard .chk{margin-left:auto}
  .wcard .strip{margin:7px 0 0}
  .wl{flex-direction:column;align-items:stretch;gap:3px;margin-top:7px;white-space:normal;overflow:hidden}
  .wl .e{font-size:11px;white-space:nowrap}
  .whn{font-size:10px;margin-top:3px}
}

/* ── 1년 ──
   12개의 작은 달력. 색은 '그날 끝낸 일의 수' 하나만 말한다 (분류 색은 월·주의 몫).
   여기서는 할 일을 적지 않는다 — 날짜를 누르면 그 달로 내려간다. */
.year{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 20px}
.ym{min-width:0}
.ymt{display:block;width:100%;text-align:left;font-size:13px;font-weight:800;padding:0 2px 5px;
  color:var(--ink);border-radius:6px}
.ymt:hover{color:var(--accent-ink)}
.ywd,.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ywd span{text-align:center;font-size:9px;font-weight:700;color:var(--sub);padding-bottom:2px}
.yd{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;color:var(--sub);border-radius:5px;background:var(--fill);
  min-height:22px;isolation:isolate}
.yd.out{background:none}
.yd::before{content:"";position:absolute;inset:0;border-radius:5px;background:var(--accent);
  opacity:0;z-index:-1;transition:opacity var(--mo-slow) var(--ease)}
.yd.a1::before{opacity:.45}
.yd.a2::before{opacity:.62}
.yd.a3::before{opacity:.92}
.yd.a1,.yd.a2{color:var(--ink)}
.yd.a3{color:var(--on-accent)}
.yd{transition:box-shadow var(--mo-fast) var(--ease),color var(--mo-slow) var(--ease)}
.yd[data-k]:hover{box-shadow:0 0 0 1.5px var(--faint)}
.yd.today{box-shadow:0 0 0 2px var(--accent);font-weight:800}
@media (min-width:600px){ .year{grid-template-columns:repeat(3,1fr);gap:20px 24px} }
@media (min-width:900px){
  .year{grid-template-columns:repeat(4,1fr);gap:22px 20px}
  .yd{font-size:12px;min-height:26px}
  .ywd span{font-size:10px}
  .ymt{font-size:14.5px}
}
@media (max-width:359px){ .year{grid-template-columns:1fr;gap:14px} }
/* 1년 화면 아래 범례 — 색이 무슨 뜻인지만 한 줄로 */
.ylegend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--sub)}
.ylegend .sp{flex:1;min-width:8px}
.ylegend .n{font-weight:700}
.ylegend i{width:11px;height:11px;border-radius:3px;display:block;background:var(--fill);flex:none}
.ylegend i.a1{background:var(--accent);opacity:.45}
.ylegend i.a2{background:var(--accent);opacity:.62}
.ylegend i.a3{background:var(--accent);opacity:.92}

/* ── 오른쪽 패널 ── */
.dh{display:flex;align-items:baseline;gap:8px;margin:2px 2px 6px;flex-wrap:wrap}
.dh b{font-size:17px}
.dh .meta{font-size:12.5px;color:var(--sub)}
.dh .pct{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.hol{font-size:12px;font-weight:700;color:var(--sun);margin:0 2px 6px}
.daynote{display:flex;align-items:center;gap:6px;margin:0 2px 8px;font-size:12.5px;color:var(--sub)}
.daynote input{flex:1;border:0;outline:none;background:none;font-size:12.5px;font-style:italic;padding:3px 0}
.daynote input::placeholder{color:var(--faint);font-style:normal}
.daynote.ro{font-style:italic;cursor:pointer}
.daynote.ro:hover{color:var(--ink)}
.dnbtn{font-size:12px;color:var(--faint);padding:0 4px;line-height:1}
.dnbtn.on,.dnbtn:hover{color:var(--accent-ink)}
.qadd.main{background:none;border:1.5px dashed var(--line);border-radius:12px;margin:0 0 2px;padding:2px 13px}
.qadd.main input{font-size:15.5px;padding:12px 0;font-weight:500}
.qadd.main{transition:border-color var(--mo) var(--ease),background var(--mo) var(--ease)}
.qadd.main:focus-within{border-color:var(--accent);border-style:solid;background:var(--card)}
.qadd.main span{color:var(--faint);font-weight:700;font-size:17px}
/* 분류가 많아도 빠른 입력 위를 여러 줄로 덮지 않게 — 모바일은 한 줄 가로 스크롤 */
.qcat{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:-9px 0 -2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:9px 0}
.qcat::-webkit-scrollbar{display:none}
/* 옆으로 더 있다는 걸 잘린 단면이 아니라 흐려짐으로 알린다 (칩이 적으면 흐려질 것도 없다) */
.qcat{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
      mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
.qcat button{flex:none}
@media (min-width:900px){ .qcat{flex-wrap:wrap;overflow:visible} }
.qcat button{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  color:var(--sub);background:var(--fill);border-radius:999px;padding:5px 11px;line-height:1.3}
.qcat button i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
.qcat button:hover{color:var(--ink)}
.qcat button.on{background:var(--ink);color:var(--bg)}
.qcat button.on i{box-shadow:0 0 0 1px var(--bg)}
.qcat button.newc{background:none;border:1px dashed var(--line);color:var(--faint)}
.qcat button.newc:hover{border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:1600px){ .qcat button{font-size:12.5px;padding:6px 13px} }
.tip{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:11px;
  padding:10px 13px;margin:8px 0 2px;font-size:12.5px;color:var(--sub);line-height:1.5}
.tip button{flex:none;font-size:12px;font-weight:800;color:var(--accent-ink)}
.note.ro{cursor:default}
.pbar{height:4px;background:var(--fill);border-radius:4px;margin:0 2px 8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);
  transition:width var(--mo-slow) var(--ease)}

.sec{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--sub);
  margin:14px 2px 4px;display:flex;align-items:center;gap:6px}
.must{background:var(--fill);border-radius:12px;padding:4px 8px 6px;margin:10px 0 4px}
.must .sec{margin:6px 2px 2px;color:var(--accent-ink)}

.nudge{background:var(--fill);border-radius:12px;padding:11px 12px;margin:10px 0 4px}
.nudge .h{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5}
.nudge .h span{color:var(--accent-ink)}
.nudge .acts{display:flex;gap:6px;flex-wrap:wrap}
.nudge .acts button{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.nudge .acts button:hover{border-color:var(--faint);color:var(--ink)}

.cat{margin-top:12px}
.ch{display:flex;align-items:center;gap:7px;border-radius:8px;cursor:pointer;margin:0 -4px;padding:4px 6px 5px}
.ch:hover{background:var(--fill)}
.ch .sq{width:9px;height:9px;border-radius:3px;flex:none}
.ch .nm{font-size:12.5px;font-weight:700}
.cat.over{outline:1.5px dashed var(--accent);outline-offset:5px;border-radius:10px}
.qcat button.over{box-shadow:0 0 0 2px var(--accent)}
.qcat button.drag{opacity:.35}
.qcat button[draggable]{cursor:grab}
.ch .edit{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;opacity:0;
  transition:opacity var(--mo-fast) var(--ease)}
.ch:hover .edit{opacity:1}
@media (hover:none){.ch .edit{opacity:1}}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:9px;padding:6px 2px;border-radius:8px;flex-wrap:wrap;
  transition:background var(--mo-fast) var(--ease),opacity var(--mo-fast) var(--ease)}
li.drag{opacity:.6}
/* 끌어서 순서를 바꿀 때 어디에 놓이는지 — 줄 위/아래에 선 하나 */
li.dropA{box-shadow:inset 0 2px 0 var(--accent)}
li.dropB{box-shadow:inset 0 -2px 0 var(--accent)}
/* 휴대폰에서 할 일을 꾹 누르면 iOS 가 글자 선택(돋보기·복사 메뉴)을 먼저 띄워
   앱의 꾹 누르기를 가로챈다. 달력 칸에는 있던 보호가 할 일 줄에는 없었다.
   글자를 직접 고치는 중일 때만 선택할 수 있게 둔다. */
@media (hover:none){
  li .tx,li .took,li .lag,li .subn{-webkit-touch-callout:none;user-select:none}
  li.editing .tx{-webkit-touch-callout:default;user-select:text}
  /* 500ms 동안 아무 반응이 없으면 고장난 걸로 보인다 — 눌리고 있다는 것만 알려준다 */
  li:active{background:var(--fill);transition-delay:90ms}
}
/* 체크한 그 순간에만. 클래스는 animate() 가 그 render 한 번만 붙인다 */
li.ckd .ck{animation:moCk 140ms var(--ease)}
li.ckd .tx{animation:moFade 190ms var(--ease)}
li.edin{animation:moFade 150ms var(--ease)}
/* 윗줄 버튼도 마찬가지 — 보이는 크기는 그대로 두고 위아래로만 넓힌다.
   (좌우로 넓히면 나란히 선 주/월/년이 서로의 터치를 가져간다) */
@media (hover:none){
  .nav,.chip,.acct,.vseg button,.qcat button{position:relative}
  .nav::after,.chip::after,.iconbtn::after,.acct::after,
  .vseg button::after,.qcat button::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
}
/* 보이는 크기는 그대로 두고 누르는 범위만 넓힌다 — 손가락으로도 빗나가지 않게 */
li .ck,li .st,li .mv,.dnbtn,li .subn,.subs .s .sck,.subs .s .sx{position:relative}
li .ck::before,li .st::before,li .mv::before,.dnbtn::before,li .subn::before,
.subs .s .sck::before,.subs .s .sx::before{content:"";position:absolute;inset:-10px -8px}
li .ck{width:18px;height:18px;border-radius:6px;border:2px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:background-color var(--mo-fast) var(--ease),border-color var(--mo-fast) var(--ease),
             transform var(--mo-fast) var(--ease)}
li .ck:active,.subs .s .sck:active{transform:scale(.9)}
li.done .ck{background:currentColor;border-color:currentColor}
li.done .ck::after{content:"✓";color:var(--card);font-size:11px;font-weight:800;line-height:1}
li.skip .ck{border-style:dashed}
li.skip .ck::after{content:"–";color:var(--faint);font-size:12px;font-weight:800}
li .tx{flex:1;min-width:90px;font-size:15px;outline:none;word-break:break-all;padding:1px 0;color:var(--ink);
  transition:color var(--mo) var(--ease),opacity var(--mo) var(--ease)}
li.editing{background:var(--fill)}
li.editing .tx{box-shadow:inset 0 -1.5px 0 var(--accent);cursor:text}
li.done .tx,li.skip .tx{color:var(--sub);text-decoration:line-through}
li.wait .tx{color:var(--sub)}
li .rp,li .wi{color:var(--faint);flex:none;display:flex;align-items:center;line-height:0}
.ch .edit,.dnbtn{line-height:0;display:flex;align-items:center}
.iconbtn svg,.qadd span svg{display:block}
.lag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;flex:none;
  background:var(--fill);color:var(--sub)}
.lag.hot{background:var(--accent);color:var(--on-accent)}
li .st,li .mv{color:var(--faint);font-size:15px;padding:0 4px;flex:none;line-height:1;
  transition:color var(--mo-fast) var(--ease)}
li .st.on{color:var(--accent-ink)}
li .st:hover,li .mv:hover{color:var(--accent-ink)}
li .mv{opacity:0;font-weight:800;transition:opacity var(--mo-fast) var(--ease)}
/* 손가락으로 쓸 때는 줄마다 점 세 개가 떠 있을 이유가 없다 — 꾹 누르면 같은 메뉴가 나온다.
   (iOS 의 할 일 앱들이 쓰는 방식. 대신 아래 안내가 그 동작을 한 번 가르쳐준다) */
@media (hover:none){ li .mv{display:none} }
li:hover .mv{opacity:1}
@media (hover:none){li .mv{opacity:1}}
.note{flex-basis:100%;margin-left:27px;font-size:11.5px;color:var(--sub);outline:none;
  padding:1px 0 2px;min-height:15px;text-decoration:none!important}
.note:empty::before{content:attr(data-ph);color:var(--faint)}
.note:focus{color:var(--ink)}
li .subn{font-size:10.5px;font-weight:800;color:var(--sub);background:var(--fill);
  border-radius:5px;padding:2px 6px;flex:none;text-decoration:none!important}
li .subn:hover{color:var(--ink)}
.subs{flex-basis:100%;margin:2px 0 4px 27px;text-decoration:none!important}
.subs .s{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:var(--ink)}
.subs .s.d span{color:var(--sub);text-decoration:line-through}
.subs .s button.sck{width:14px;height:14px;border-radius:4px;border:2px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;color:currentColor}
.subs .s.d button.sck{background:currentColor;border-color:currentColor}
.subs .s.d button.sck::after{content:"✓";color:var(--card);font-size:9px;font-weight:800;line-height:1}
.subs .s span{flex:1;outline:none;word-break:break-all}
.subs .s .sx{color:var(--faint);font-size:13px;padding:0 3px}
.subs .s .sx:hover{color:var(--accent-ink)}
.subs input{width:100%;border:0;outline:none;background:none;font-size:13px;padding:4px 0 4px 22px;color:var(--ink)}
.subs input::placeholder{color:var(--faint)}
.add{width:100%;border:0;outline:none;background:none;font-size:15px;padding:6px 2px 6px 27px}
.add::placeholder{color:var(--faint)}

/* 끝낸 일은 목록 맨 아래 접어둔다 — Google Tasks·Microsoft To Do 와 같은 자리.
   위로 올리면 '끝낸 일'이 '남은 일'보다 먼저 읽혀 순서가 뒤집힌다.
   대신 흘러가는 꼬리처럼 보이지 않게 위의 분류 제목(.sec)과 같은 무게로 맞춘다. */
.fold{width:100%;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;
  letter-spacing:.3px;color:var(--sub);padding:11px 4px 10px;margin-top:10px;
  border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.fold:hover{color:var(--ink);background:var(--fill)}
.fold .ar{line-height:0;display:flex;transition:transform var(--mo) var(--ease)}
.fold.open .ar{transform:rotate(180deg)}      /* 펼치면 위를 가리킨다 (접기) */
.fold .k{margin-left:auto;font-weight:800;color:var(--faint);
  background:var(--fill);border-radius:6px;padding:1px 7px;line-height:1.6}
.fold:hover .k{color:var(--sub)}

.qadd{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:2px 12px;margin-bottom:6px}
.qadd input{flex:1;border:0;outline:none;background:none;font-size:15px;padding:11px 0}
.qadd input::placeholder{color:var(--faint)}
.empty{font-size:13px;color:var(--sub);padding:14px 4px;line-height:1.6}
/* 빈 화면도 안내다 — '아무것도 없는 날'과 '다 끝낸 날'을 구분해서 말한다 */
.dayempty{display:flex;flex-direction:column;gap:3px;padding:16px 4px 10px;font-size:13px;color:var(--sub)}
.dayempty b{font-weight:700;color:var(--ink);font-size:13.5px}
.dayempty.done{flex-direction:row;align-items:center;gap:7px}
.dayempty.done .chk{position:static;flex:none}
li .took{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--fill);
  border-radius:6px;padding:1px 6px;flex:none;white-space:nowrap}

.res{padding:10px 2px;border-bottom:1px solid var(--line)}
.res .t{font-size:15px;font-weight:700;margin-bottom:3px}
.res .last{font-size:12px;color:var(--accent-ink);font-weight:700}
.res .last.none{color:var(--faint)}
.res .hist{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.res .hist div{display:flex;gap:8px}
.res .hist b{font-weight:700;cursor:pointer;flex:none}
.res .hist b:hover{color:var(--accent-ink);text-decoration:underline}
.res .hist i{font-style:normal;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .open{font-size:11.5px;color:var(--sub);margin-top:4px}
.res .again{font-size:11.5px;font-weight:700;color:var(--accent-ink);margin-top:7px;
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.res .again:hover{border-color:var(--accent)}

.tiles{display:flex;gap:8px;margin:8px 0 4px}
.tile{flex:1;background:var(--fill);border-radius:12px;padding:12px 10px;text-align:center}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
.tile span{font-size:10.5px;font-weight:700;color:var(--sub)}
.barrow{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:13px}
.barrow .nm{width:78px;flex:none;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bg{flex:1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.barrow .bg i{display:block;height:100%;border-radius:4px}
.barrow .v{width:28px;text-align:right;font-size:12px;color:var(--sub);font-weight:700}

/* ── 빠른 이동 메뉴 ── */
#menu{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:13px;box-shadow:0 12px 34px rgba(0,0,0,.24);padding:6px;min-width:184px;
  animation:moMenu 140ms var(--ease)}
/* 닫히는 동안에도 클릭을 먹지 않게 — 안 보이는 판이 남으면 다음 클릭이 사라진다 */
#menu.closing{opacity:0;transform:translateY(-2px) scale(.99);pointer-events:none;animation:none;
  transition:opacity 110ms var(--ease),transform 110ms var(--ease)}
#menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  font-size:13.5px;font-weight:600;text-align:left}
#menu button:hover{background:var(--fill)}
#menu button .k{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700}
#menu .sep{height:1px;background:var(--line);margin:5px 4px}
#menu input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);outline:none;font-size:13px;margin:2px 0}
#menu .rm,#sheet .rm{color:var(--danger)}

#sheetWrap{position:fixed;inset:0;z-index:25}

#sheetWrap.closing{pointer-events:none}
#sheetWrap.closing .sbd{opacity:0;animation:none;transition:opacity 150ms var(--ease)}
#sheetWrap.closing #sheet{opacity:0;transform:translateY(10px);animation:none;
  transition:opacity 150ms var(--ease),transform 150ms var(--ease)}
/* 분류가 많으면 시트가 화면보다 길어진다 — 시트 안에서 굴러가게 (버튼이 화면 밖에 숨지 않게) */
#sheet{max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

#sheet button .k{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:700}
#sheet .sep{height:1px;background:var(--line);margin:5px 6px}
#sheet .mh{padding:12px 12px 10px;font-size:16px}
#sheet input[type=date]{padding:13px 12px;font-size:15px;margin:4px 0}

/* ── 다이얼로그: 화면이 넓으면 넓게 ── */
dialog{border:1px solid var(--line);border-radius:18px;padding:20px;width:min(88vw,340px);
  background:var(--card);color:var(--ink);max-height:86vh;box-shadow:0 18px 50px rgba(0,0,0,.28)}
dialog[open]{animation:moDlg 200ms var(--ease)}

dialog.closing{opacity:0;transform:translateY(2px) scale(.99);pointer-events:none;animation:none;
  transition:opacity 130ms var(--ease),transform 130ms var(--ease)}
dialog.closing::backdrop{opacity:0;transition:opacity 130ms var(--ease);animation:none}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 14px;font-size:12.5px;color:var(--sub);line-height:1.55}

dialog input[type=number],dialog input[type=time],dialog select{

.row{display:flex;gap:8px;margin-top:4px}
.row button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700}
.primary{background:var(--accent);color:var(--on-accent)}
.plain{background:var(--fill);color:var(--sub)}

/* ─── 순수 함수 (#test 로 자가검사) ─── */
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dOf = k => new Date(k + 'T00:00:00');
const isDateKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
const shift = (k, n) => { const d = dOf(k); d.setDate(d.getDate()+n); return key(d); };
const daysBetween = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);

/* ‹ › 의 뜻은 보기마다 다르다 — 주는 ±7일, 월은 ±1달, 년은 ±1년.
   달·해를 옮길 때 날짜를 1일로 맞춘다 (1월 31일에서 +1달 하면 3월로 튀는 걸 막는다).
   해를 넘길 때도 '보던 달'은 유지한다 — 년에서 월로 돌아올 자리가 되도록. */
function stepPeriod(view, d, n){
  if(view === 'week') return dOf(shift(key(d), n * 7));
  if(view === 'year') return new Date(d.getFullYear() + n, d.getMonth(), 1);
  return new Date(d.getFullYear(), d.getMonth() + n, 1);
}
/* 뒤로 미룬 것만 '미룬 횟수'로 센다 — 떠오른 일에서 날짜를 정하거나 앞당기는 건 미룬 게 아니다 */
const isPostpone = (from, to) =>
  isDateKey(from) && (to === 'later' || (isDateKey(to) && to > from));

/* 1년 화면의 색 단계 — '그날 끝낸 일의 수'만 말한다 (성적이 아니다) */
const actLevel = n => n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : 3;

/* 그 날이 속한 주의 첫날 — 주 시작 요일 설정을 따른다 */
function weekStart(k, ws = 0){
  const d = dOf(k);
  d.setDate(d.getDate() - ((d.getDay() - ws + 7) % 7));
  return key(d);
}
const weekGrid = (k, ws = 0) => { const s0 = weekStart(k, ws);
  return Array.from({length:7}, (_, i) => shift(s0, i)); };

function monthGrid(y, m, ws = 0){
  const lead = (new Date(y,m,1).getDay() - ws + 7) % 7;
  const days = new Date(y,m+1,0).getDate();
  return Array.from({length:Math.ceil((lead+days)/7)*7}, (_,i)=>new Date(y,m,1-lead+i));
}
function yearGrid(y, ws = 0){
  const d = new Date(y,0,1);
  d.setDate(d.getDate() - ((d.getDay()-ws+7)%7));
  const end = new Date(y,11,31), out = [];
  while(d<=end || ((d.getDay()-ws+7)%7)!==0){ out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function lagDays(fromK, toK, offSet){            // 주말·공휴일은 빼고 센다
  let n = 0;
  const d = dOf(fromK), end = dOf(toK);
  for(d.setDate(d.getDate()+1); d<=end; d.setDate(d.getDate()+1)){
    const w = d.getDay();
    if(w===0 || w===6 || offSet.has(key(d))) continue;
    n++;
  }
  return n;
}
/* 못 끝낸 일은 오늘로 따라온다. 반복(r)·건너뜀(sk)은 그날에 남기고,
   기다리는 일(w)은 따라오되 '놓침'으로는 세지 않는다. */
function rollover(todos, miss, todayK){
  let moved = 0;
  for(const k of Object.keys(todos)){
    if(!isDateKey(k) || k >= todayK) continue;
    const movers = todos[k].filter(t => !t.d && !t.r && !t.sk);
    if(!movers.length) continue;
    const rest = todos[k].filter(t => t.d || t.r || t.sk);
    if(rest.length) todos[k] = rest; else delete todos[k];
    for(const t of movers){ t.mv = (t.mv||0)+1; t.mvd = todayK; }
    (todos[todayK] ||= []).push(...movers);
    const missed = movers.filter(t => !t.w).length;
    if(missed) miss[k] = (miss[k]||0) + missed;
    moved += movers.length;
  }
  return moved;
}
/* 하루를 한 번만 센다. 달력 ✓ · 주간 ✓ · 진행 막대 · 알림 · 날짜 메뉴 · 기록이 전부 이걸 쓴다.
   '기다리는 중'은 지금 내가 할 수 있는 일이 아니므로 남은 일에도 분모에도 넣지 않는다. */
function daySummary(list, miss = 0){
  let done = 0, actionable = 0, waiting = 0, skipped = 0;
  for(const t of list){
    if(t.d) done++;
    else if(t.sk) skipped++;
    else if(t.w) waiting++;
    else actionable++;
  }
  return {done, actionable, waiting, skipped, missed:miss|0,
          total: done + actionable + (miss|0), all: list.length,
          /* cleared = 이 날에 더 할 게 남지 않았다 (날짜 패널이 '다 끝냈어요' 라고 말하는 기준).
             complete = 거기에 더해 다른 날로 미룬 것도 없다 — 온전히 끝낸 날.
             달력은 둘 다 표시하되 무게를 달리한다. 그래야 ✓ 가 거짓말을 하지 않는다. */
          cleared: actionable === 0 && done > 0,
          complete: actionable === 0 && done > 0 && !miss};
}
const dayComplete = (list, miss = 0) => daySummary(list, miss).complete;
/* 그날 '무엇을 계획했는지'의 구성 — 완료 여부로 다시 계산하지 않는다.
   분류가 많으면 상위 3개만 남기고 나머지는 분류 없음과 함께 묶는다. */
function catDist(list, cats, max = 4){
  const total = list.length;
  if(!total) return [];
  const n = new Map();
  for(const t of list){
    const id = cats.some(c => c.id === t.c) ? t.c : '';
    n.set(id, (n.get(id) || 0) + 1);
  }
  const named = [...n.entries()].filter(([id]) => id)
    .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const top = named.slice(0, max);
  const rest = (n.get('') || 0) + named.slice(max).reduce((s,[,v]) => s + v, 0);
  const out = top.map(([id, v]) => ({id, color: cats.find(c => c.id === id).c, ratio: v/total, n: v}));
  if(rest) out.push({id:'', color:null, ratio: rest/total, n: rest});
  return out;
}

/* 제목이 같은 것을 한 흐름으로 — 완료 날짜와 그때 메모까지 */
const norm = s => String(s).toLowerCase().replace(/\s+/g,' ').trim();
function searchTodos(todos, q){
  const nq = norm(q); if(!nq) return [];
  const by = new Map();
  for(const [k, list] of Object.entries(todos)){
    for(const t of list){
      if(!norm(t.t).includes(nq) && !norm(t.nt||'').includes(nq)) continue;
      const g = by.get(norm(t.t)) || {title:t.t, cat:t.c, done:[], open:[]};
      if(t.d) g.done.push({k: t.dd || (isDateKey(k) ? k : null), nt: t.nt || ''});
      else if(isDateKey(k)) g.open.push(k);
      if(t.c) g.cat = t.c;
      by.set(norm(t.t), g);
    }
  }
  return [...by.values()].map(g=>{
    g.done = g.done.filter(x=>x.k).sort((a,b)=>b.k.localeCompare(a.k));
    g.open.sort().reverse();
    g.last = g.done[0]?.k || null;
    return g;
  }).sort((a,b)=>(b.last||'').localeCompare(a.last||'') || b.done.length-a.done.length);
}
/* 나중에 함의 '조용한 재발견' — 오래 묵었고 최근에 들여다보지 않은 것부터 */
function rediscover(later, todayK, n = 3){
  return [...(later||[])]
    .map(t => ({t, age: daysBetween(t.rv || t.cr || t.o || todayK, todayK)}))
    .filter(x => x.age >= 14)
    .sort((a,b)=>b.age-a.age)
    .slice(0, n)
    .map(x => x.t);
}
/* CSV — 따옴표와 줄바꿈까지 (RFC4180) */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const DONE_WORDS = new Set(['1','true','yes','y','x','o','done','completed','complete','completed.','2']);
/* 어떤 앱의 파일인지 알아보고 공통 모양으로 바꾼다. 새 앱은 여기 한 갈래만 추가하면 된다. */
function readImport(name, text){
  if(/^\s*[{[]/.test(text)){
    let j; try{ j = JSON.parse(text); }catch{ return null; }
    if(j && j.todos) return {src:'daynua', doc:j};
    const lists = Array.isArray(j?.items) ? j.items : Array.isArray(j) ? j : null;
    if(lists?.some(l => Array.isArray(l?.items))){          // Google Takeout 의 Tasks.json
      const out = [];
      for(const l of lists) for(const t of (l.items || [])){
        const title = (t.title || '').trim();
        if(!title) continue;
        out.push({t:title,
          date: /^\d{4}-\d{2}-\d{2}/.test(t.due||'') ? t.due.slice(0,10) : null,
          done: t.status === 'completed',
          dd: /^\d{4}-\d{2}-\d{2}/.test(t.completed||'') ? t.completed.slice(0,10) : null,
          cat: (l.title || '').trim(),
          nt: (t.notes || '').trim().slice(0,200)});
      }
      if(out.length) return {src:'google', items:out};
    }
    return null;
  }
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const hi = rows.findIndex(r => r.some(c => /^(title|content|task name|name|subject)$/i.test(c.trim())));
  if(hi < 0) return null;
  const head = rows[hi].map(c => c.trim());
  const body = rows.slice(hi+1);
  /* 앞에 적은 이름을 먼저 쓴다 — TickTick 은 'Folder Name'(상위 폴더)보다 'List Name'이 카테고리 */
  const col = (...res) => { for(const re of res){ const i = head.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  const src = col(/^TYPE$/i) >= 0 && col(/^CONTENT$/i) >= 0 ? 'todoist'
            : col(/^List Name$/i) >= 0 ? 'ticktick' : 'csv';
  const iT = col(/^title$/i, /^content$/i, /^task name$/i, /^name$/i, /^subject$/i);
  const iD = col(/^due date$/i, /^date$/i, /^due$/i, /^deadline$/i);
  const iC = col(/^list name$/i, /^project$/i, /^category$/i, /^list$/i, /^folder name$/i);
  const iS = col(/^status$/i, /^completed$/i, /^is completed$/i, /^done$/i);
  const iDone = col(/^completed time$/i, /^completed at$/i, /^completion date$/i, /^date completed$/i);
  const iN = col(/^description$/i, /^note$/i, /^notes$/i, /^memo$/i, /^content$/i);
  const iType = col(/^TYPE$/i);
  const out = [];
  for(const r of body){
    if(iType >= 0 && !/^task$/i.test((r[iType]||'').trim())) continue;
    const t = (r[iT]||'').trim();
    if(!t) continue;
    const dd = iDone >= 0 ? (r[iDone]||'').slice(0,10) : '';
    const st = iS >= 0 ? (r[iS]||'').trim().toLowerCase() : '';
    const done = !!(dd && /^\d{4}-\d{2}-\d{2}$/.test(dd)) || DONE_WORDS.has(st);
    const date = iD >= 0 ? (r[iD]||'').slice(0,10) : '';
    out.push({
      t,
      date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null,
      done,
      dd: /^\d{4}-\d{2}-\d{2}$/.test(dd) ? dd : (done && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null),
      cat: iC >= 0 ? (r[iC]||'').trim() : (src === 'todoist' ? name.replace(/\.csv$/i,'') : ''),
      nt: iN >= 0 && iN !== iT ? (r[iN]||'').trim().slice(0,200) : ''
    });
  }
  return out.length ? {src, items:out} : null;
}

  /* 순서 바꾸기 — 배열만 손대므로 순수 함수로 확인한다 */
  {

    const move = (l, id, toId, before) => {      // reorderTo 의 알맹이
      const t = l.find(x=>x.id===id), g = l.find(x=>x.id===toId);
      l.splice(l.indexOf(t),1); const j = l.indexOf(g); l.splice(before?j:j+1,0,t); return l;
    };
    console.assert(ids(move([mk('a'),mk('b'),mk('c')],'c','a',true))==='cab','위에 놓기');

    console.assert(ids(move([mk('a'),mk('b'),mk('c')],'a','b',true))==='abc','제자리는 그대로');
    const step = (l, id, dir) => {               // nudgeOrder 의 알맹이 (같은 분류만)
      const t = l.find(x=>x.id===id);
      const same = l.filter(x=>(x.c||'')===(t.c||''));
      const q = same.indexOf(t)+dir; if(q<0||q>=same.length) return l;
      const o = same[q]; l.splice(l.indexOf(t),1);
      const j = l.indexOf(o); l.splice(dir>0?j+1:j,0,t); return l;
    };
    console.assert(ids(step([mk('a','x'),mk('b','y'),mk('c','x')],'c',-1))==='cab','다른 분류는 건너뛴다');
    console.assert(ids(step([mk('a','x'),mk('b','x')],'a',-1))==='ab','맨 위에서 위로는 무해');

  console.assert(isPostpone('2026-09-17','2026-09-20') === true,  '뒤로 미루면 센다');
  console.assert(isPostpone('2026-09-17','later')      === true,  '나중에로 보내면 센다');

  console.assert(isPostpone('later','2026-09-17')      === false, '나중에서 꺼내는 건 미룬 게 아니다');

  /* ── 문서 합치기: 한쪽을 통째로 버리지 않는다 ── */
  const A = {ts:100, rev:1, cats:[{id:'c1',n:'A'}], todos:{'2026-09-17':[{id:'a',t:'A'}]},
             rout:[], imports:[], del:{}, ui:{}, notes:{}, miss:{}};
  const B = {ts:200, rev:2, cats:[{id:'c2',n:'B'}], todos:{'2026-09-18':[{id:'b',t:'B'}]},
             rout:[], imports:[], del:{}, ui:{}, notes:{}, miss:{}};
  const M = mergeDocs(A, B);

  const moved = mergeDocs({...A, todos:{'2026-09-17':[{id:'a',t:'A'}]}},

  /* 시계가 미래로 틀어진 기기가 영원히 이기지 않는다 — 순서는 rev 가 정한다 */

                    lang: /^ko/i.test(NAV) ? 'ko' : 'en',
                    country: (NAV.split('-')[1] || (/^ko/i.test(NAV) ? 'KR' : '')).toUpperCase(),
                    weekStart: /^ko|^ja|^zh|^en-US|^pt-BR/i.test(NAV) ? 0 : 1,

const FRESH = () => ({ts:0, rev:0, ui:{...UI_DEFAULT},
  cats:[], todos:{}, rout:[], miss:{}, notes:{}, imports:[], del:{}});

/* 옛 데이터도 그대로 열리게 — 없는 것만 채우고 기존 값은 손대지 않는다 */
const TOMB_TTL = 90 * 864e5;                 // 지운 기록은 90일이면 잊는다
function migrate(d){
  d.ui = {...UI_DEFAULT, ...(d.ui||{})};
  d.cats ||= []; d.todos ||= {}; d.rout ||= []; d.miss ||= {}; d.notes ||= {}; d.imports ||= [];
  d.rev |= 0; d.del ||= {};
  const cut = Date.now() - TOMB_TTL;
  for(const [id, at] of Object.entries(d.del)) if(!(at > cut)) delete d.del[id];
  if(d.todos.inbox && !d.todos.ideas){ d.todos.ideas = d.todos.inbox; delete d.todos.inbox; }
  for(const [k,list] of Object.entries(d.todos)){
    if(!Array.isArray(list)){ delete d.todos[k]; continue; }
    for(const t of list){
      t.mv ??= 0;
      if(t.d && !t.dd && isDateKey(k)) t.dd = k;
    }
  }
  for(const r of d.rout) r.mode ||= 'always';     // 이미 쓰던 반복은 동작이 바뀌면 안 된다
  return d;
}

   게스트와 계정은 서로 다른 칸을 쓴다. A 로 쓰던 내용이 B 로 로그인했을 때
   화면에 남거나 B 의 서버로 올라가는 일이 없게. */

/* 두 문서를 합친다 — 한쪽을 통째로 버리지 않는다.
   같은 id 는 새 쪽 것만 · 한쪽에만 있는 것은 살린다 · 지운 기록이 부활을 막는다.
   새 쪽 판정은 rev(개정 번호) 우선 — 기기 시계가 틀려도 한쪽이 영원히 이기지 않게. */
function mergeDocs(a, b){
  const newer = ((b.rev|0) > (a.rev|0) || ((b.rev|0) === (a.rev|0) && (b.ts||0) >= (a.ts||0))) ? b : a;
  const older = newer === b ? a : b;
  const del = {...(older.del||{})};
  for(const [id, t] of Object.entries(newer.del||{})) if(t > (del[id]||0)) del[id] = t;

  const out = {ts: Math.max(a.ts||0, b.ts||0), rev: Math.max(a.rev|0, b.rev|0),
    ui: {...(older.ui||{}), ...(newer.ui||{})},
    notes: {...(older.notes||{}), ...(newer.notes||{})},
    miss: {...(older.miss||{}), ...(newer.miss||{})},
    cats: [], todos: {}, rout: [], imports: [], del};

  const seen = new Set();
  for(const src of [newer, older])
    for(const [k, list] of Object.entries(src.todos||{})){
      if(!Array.isArray(list)) continue;
      for(const t of list){
        if(!t?.id || seen.has(t.id) || del[t.id]) continue;
        seen.add(t.id); (out.todos[k] ||= []).push(t);
      }
    }
  const once = (key, arr) => {
    const got = new Set();
    for(const x of arr){ if(!x?.id || got.has(x.id) || del[x.id]) continue; got.add(x.id); out[key].push(x); }
  };
  once('cats', [...(newer.cats||[]), ...(older.cats||[])]);
  once('rout', [...(newer.rout||[]), ...(older.rout||[])]);
  once('imports', [...(newer.imports||[]), ...(older.imports||[])]);
  return out;
}

/* ─── 색 대비 보정 ─── */
const rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b] = rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; });
                   return .2126*r + .7152*g + .0722*b; };
const mix = (h, to, amt) => '#' + rgb(h).map((v,i)=>
  Math.round(v + (rgb(to)[i]-v)*amt).toString(16).padStart(2,'0')).join('');
const isDarkMode = () => doc.ui.theme === 'dark' ||
  (doc.ui.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
const ratio = (a, b) => { const x = lum(a), y = lum(b);
  return (Math.max(x,y) + .05) / (Math.min(x,y) + .05); };
/* 대비를 재는 기준 배경. 달력 칸·'오늘 꼭' 등이 --fill 위에 앉는데
   라이트에서도 다크에서도 --fill 이 --card 보다 불리하므로 이쪽에 맞춘다.
   (테마 + 배경색 물들이기까지 반영. applyUI 가 갱신한다) */
let BASE = '#efece5';
function readBase(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--fill').trim();
  BASE = /^#[0-9a-fA-F]{3}$/.test(v) ? '#' + [...v.slice(1)].map(c=>c+c).join('')
       : /^#[0-9a-fA-F]{6}$/.test(v) ? v
       : (isDarkMode() ? '#26262d' : '#efece5');
}
/* 사용자가 고른 색을 최소한으로만 건드린다 — 배경과 4.5:1 이 되는 순간 멈춘다 */
const away = () => lum(BASE) < .18 ? '#ffffff' : '#000000';   // 배경 반대쪽으로 민다
function ink(h, target = 4.5){
  if(!/^#[0-9a-fA-F]{6}$/.test(h||'')) return 'var(--sub)';
  const to = away();
  for(let a = 0; a < 1; a += .04){
    const c = mix(h, to, a);
    if(ratio(c, BASE) >= target) return c;
  }
  return to;
}

/* ─── 반복 할 일 ─── */
const lastDoneOf = rid => {
  let last = null;
  for(const list of Object.values(doc.todos))
    for(const t of list) if(t.r === rid && t.d && t.dd && (!last || t.dd > last)) last = t.dd;
  return last;
};
const hasOpenOf = rid => Object.values(doc.todos)
  .some(list => list.some(t => t.r === rid && !t.d && !t.sk));

/* ponytail: 보이는 날 + 오늘 ±1년만 만든다. 커지면 가상 렌더로. */
function materialize(days){
  const now = Date.now(), tk = todayKey(); let added = 0;
  const blocked = new Set(doc.rout.filter(r => r.mode === 'once' && hasOpenOf(r.id)).map(r => r.id));
  for(const d of days){
    const k = key(d);
    /* 지나간 날에는 반복 할 일을 새로 만들지 않는다.
       달력을 뒤로 넘길 때마다 "못 한 일"이 과거에 새로 생기면 기록이 아니라 빚이 된다.
       (이미 만들어져 있던 것은 그대로 둔다 — 지우지 않는다) */
    if(k < tk) continue;
    if(Math.abs(dOf(k) - now) > 400*864e5) continue;
    const wd = d.getDay(), list = doc.todos[k];
    for(const r of doc.rout){
      if(r.every) continue;                                  // 주기형은 달력에 미리 깔지 않는다
      if(!r.days?.includes(wd) || (r.from && k < r.from)) continue;
      if(blocked.has(r.id) || (list||[]).some(t=>t.r===r.id)) continue;
      (doc.todos[k] ||= []).push({id:uid(), t:r.t, d:false, c:r.c, o:k, cr:k, r:r.id, mv:0});
      if(r.mode === 'once') blocked.add(r.id);
      added++;
    }
  }
  if(added){ doc.ts = Date.now(); save(); push(); }
  return added;
}
/* 주기형(약 N일마다): 마지막 완료로부터 N일이 지나면 조용히 알려준다 */
function dueGaps(todayK){
  return doc.rout.filter(r => r.every).map(r=>{
    const last = lastDoneOf(r.id) || r.from;
    const since = daysBetween(last, todayK);
    return {r, since, due: since >= r.every};
  }).filter(x => x.due && !hasOpenOf(x.r.id)).sort((a,b)=>b.since-a.since).slice(0,2);
}

/* ─── 공휴일 ─── */
async function loadHolidays(year){
  const c = doc.ui.country;
  if(!c) return;
  const ck = `${c}-${year}`;
  if(holLoaded.has(ck)) return;
  holLoaded.add(ck);
  const cached = localStorage.getItem('daynua.hol.'+ck);
  if(cached){ Object.assign(hol, JSON.parse(cached)); return render(); }
  try{
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${c}`);
    if(!r.ok) throw new Error('http');
    const m = {};
    for(const h of await r.json()) m[h.date] = [h.localName, h.name];
    localStorage.setItem('daynua.hol.'+ck, JSON.stringify(m));
    Object.assign(hol, m);
    render();
  }catch{ holLoaded.delete(ck); }
}
function resetHolidays(){
  hol = {}; holLoaded.clear();
  for(const k of Object.keys(localStorage)) if(k.startsWith('daynua.hol.')) localStorage.removeItem(k);
}

/* ─── 공통 UI ─── */
/* 배경을 강조색 쪽으로 물들이는 정도만 조절하면, 손대는 값은 하나인데 분위기는 다 바뀐다 */
const TINT_BASE = {
  light:{bg:'#faf9f6', card:'#ffffff', fill:'#efece5', line:'#e3e0d9'},
  dark: {bg:'#131316', card:'#1c1c21', fill:'#26262d', line:'#33333c'}
};
/* 배경을 물들이면 이 글자색들이 무너질 수 있다. 물들인 배경에 맞춰 되돌린다.
   [변수, 목표 대비] — 본문 7, 보조 4.5, 아이콘 3 */
const INK_BASE = {
  light:{'--ink':['#1b1b20',7], '--sub':['#63626c',4.5], '--faint':['#8a877f',3],
         '--sun':['#b4441f',4.5], '--sat':['#35619f',4.5]},
  dark: {'--ink':['#edece8',7], '--sub':['#a2a1ac',4.5], '--faint':['#78777f',3],
         '--sun':['#e8714d',4.5], '--sat':['#7ea6e8',4.5]}
};
function applyUI(){
  const root = document.documentElement;
  root.dataset.theme = doc.ui.theme === 'auto' ? '' : doc.ui.theme;
  root.lang = doc.ui.lang;
  const dark = isDarkMode();
  const acc = /^#[0-9a-fA-F]{6}$/.test(doc.ui.accent||'') ? doc.ui.accent : (dark ? '#e8714d' : '#c9502f');
  if(doc.ui.accent) root.style.setProperty('--accent', acc);
  else root.style.removeProperty('--accent');
  const tint = Math.max(0, Math.min(100, doc.ui.tint|0)) / 100;
  for(const [k, v] of Object.entries(TINT_BASE[dark ? 'dark' : 'light'])){
    if(!tint) root.style.removeProperty('--' + k);
    else root.style.setProperty('--' + k, mix(v, acc, tint * (dark ? .22 : .17) * (k === 'card' ? .45 : 1)));
  }
  readBase();
  for(const [v, [base, target]] of Object.entries(INK_BASE[dark ? 'dark' : 'light'])){
    if(tint) root.style.setProperty(v, ink(base, target)); else root.style.removeProperty(v);
  }
  root.style.setProperty('--accent-ink', ink(acc));
  root.style.setProperty('--on-accent',
    ratio('#ffffff', acc) >= ratio('#111111', acc) ? '#ffffff' : '#111111');
  document.querySelector('meta[name=theme-color]')
    ?.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim() || '#fff8f1');
  const [a,b] = T('brand');
  $('#brand').innerHTML = `${a}<b>${b}</b>`;
  $('#today').textContent = T('today');
  $('#fab').title = T('settings');
  $('#fab').innerHTML = ICON.gear;
  $('#fab').setAttribute('aria-label', T('settings'));
  $('#btnSearch').title = T('search');
  $('#btnIdeas').title = T('archive');
  $('#btnStats').title = T('stats');
  setAcct();
}
const wdNames = () => {
  const f = new Intl.DateTimeFormat(loc(), {weekday:'short'});
  return Array.from({length:7},(_,i)=>f.format(new Date(2024,0,7+i+ws())));
};
const canDrag = matchMedia('(hover:hover) and (pointer:fine)').matches;

/* 아이콘 한 벌 — 굵기·끝모양·크기를 하나로. 이모지는 OS 마다 모양이 달라 제품처럼 보이지 않는다. */
const svg = (d, n = 17) => `<svg viewBox="0 0 16 16" width="${n}" height="${n}" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  search: svg('<circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>'),
  inbox:  svg('<path d="M5.6 12.2a4.6 4.6 0 1 1 4.8 0v1.1a1 1 0 0 1-1 1H6.6a1 1 0 0 1-1-1z"/><path d="M6.4 11.9h3.2"/>'),
  gear:   svg('<circle cx="8" cy="8" r="3.1"/><path d="M8 1.7v1.3M8 13v1.3M14.3 8H13M3 8H1.7M12.45 3.55l-.92.92M4.47 11.53l-.92.92M12.45 12.45l-.92-.92M4.47 4.47l-.92-.92"/>'),
  pencil: svg('<path d="M11.1 2.5 13.5 4.9 5.7 12.7 2.6 13.4 3.3 10.3z"/>', 14),
  wait:   svg('<path d="M4.6 2h6.8M4.6 14h6.8M5.6 2v2.5L8 6.9l2.4-2.4V2M5.6 14v-2.5L8 9.1l2.4 2.4V14"/>', 13),
  repeat: svg('<path d="M2.8 6.6A4 4 0 0 1 6.8 3H12"/><path d="M10.2 1.2 12.4 3l-2.2 1.8"/><path d="M13.2 9.4A4 4 0 0 1 9.2 13H4"/><path d="M5.8 15 3.6 13l2.2-1.8"/>', 13),
  /* 접힌 것을 여는 표시. 홑화살괄호(›) 는 글자라서 크기도 굵기도 옆 글씨와 따로 논다 */
  chev:   svg('<path d="M4 6.2 8 10.2l4-4"/>', 15),
};

/* 요약은 한 번 그리는 동안 한 번만 센다 — 칸마다 전체 기록을 다시 훑지 않게 */
let sumCache = new Map();
const sumOf = k => { let v = sumCache.get(k);
  if(!v){ v = daySummary(bucket(k), doc.miss[k] || 0); sumCache.set(k, v); } return v; };

/* 칸에 자리가 모자랄 때의 순서 — 오늘 꼭 > 아직 할 일 > 끝낸 일 > 기다림·건너뜀 */
const cellRank = t => (t.s && !t.d) ? 0 : (!t.d && !t.sk && !t.w) ? 1 : t.d ? 2 : 3;
const cellOrder = list => [...list].sort((a,b) => cellRank(a) - cellRank(b));
const monthName = m => new Intl.DateTimeFormat(loc(), {month:'long'}).format(new Date(2024, m, 1));
const evHTML = (t, i) => { const c = catOf(t.c);
  return `<span class="e ${t.d||t.sk?'done':''}" data-i="${i}"
    style="--c:${c?stripColor(c.c):'var(--faint)'}">${esc(t.t)}</span>`; };

/* 제목은 보기마다 다르다 — 주는 기간, 월은 달, 년은 해 */
function viewTitle(){
  const y = cur.getFullYear();
  if(calView === 'year') return `${y}`;
  if(calView === 'month')
    return `${new Intl.DateTimeFormat(loc(),{month:'long'}).format(cur)}<small>${y}</small>`;
  const w = weekGrid(key(cur), ws()), a = dOf(w[0]), b = dOf(w[6]);
  const ko = doc.ui.lang !== 'en';
  const mo = d => ko ? `${d.getMonth()+1}월` : new Intl.DateTimeFormat('en-US',{month:'short'}).format(d);
  const same = w[0].slice(0,7) === w[6].slice(0,7);
  const head = ko ? (same ? `${mo(a)} ${a.getDate()}–${b.getDate()}일`
                          : `${mo(a)} ${a.getDate()}일 – ${mo(b)} ${b.getDate()}일`)
                  : (same ? `${mo(a)} ${a.getDate()}–${b.getDate()}`
                          : `${mo(a)} ${a.getDate()} – ${mo(b)} ${b.getDate()}`);
  const yr = a.getFullYear() === b.getFullYear() ? `${a.getFullYear()}`
                                                 : `${a.getFullYear()}–${b.getFullYear()}`;
  return `${head}<small>${yr}</small>`;
}

/* ─── 움직임 ───
   다시 그릴 때마다 반복되면 안 되는 효과(등장·체크·사라짐)는 CSS 로 상시 걸지 않는다.
   사용자가 뭔가 한 그 순간에만 여기에 쌓아두고, 바로 다음 render 한 번에만 붙인다.
   그래서 다른 기기에서 동기화가 들어와도 화면이 춤추지 않는다. */
const reduceMo = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let animQ = [];
const animate = (sel, cls = 'in') => { if(!reduceMo()) animQ.push([sel, cls]); };
function flushAnim(){
  for(const [sel, cls] of animQ)
    for(const el of document.querySelectorAll(sel)) el.classList.add(cls);
  animQ = [];
}
/* 없어지는 것은 없어지는 게 보인 다음에 없앤다 */
function vanish(el, fn){
  if(!el || reduceMo()) return fn();
  el.classList.add('out');
  setTimeout(fn, 130);
}
/* 한 번만 재생하는 효과 — 연달아 눌러도 앞의 것이 남지 않게 매번 다시 건다 */
function once(el, cls, ms = 200){
  if(!el || reduceMo()) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), ms);
}
const fade = sel => once($(sel), 'vfade', 200);
const calStep = n => once($('#cal'), n > 0 ? 'stepL' : 'stepR', 220);

/* 다이얼로그는 다 사라진 뒤에 닫는다. 닫는 중에 다시 열면 닫기를 취소한다 —
   그래야 애니메이션이 안 보이거나 InvalidStateError 가 나는 일이 없다. */
for(const d of document.querySelectorAll('dialog')){
  const nClose = d.close.bind(d), nShow = d.showModal.bind(d);
  let t = null;
  d.close = v => {
    if(!d.open || d.classList.contains('closing')) return;
    if(reduceMo()) return nClose(v);
    d.classList.add('closing');
    t = setTimeout(()=>{ d.classList.remove('closing'); nClose(v); }, 130);
  };
  d.showModal = () => { clearTimeout(t); d.classList.remove('closing'); if(!d.open) nShow(); };
}

function render(){
  const tk = todayKey();
  sumCache = new Map();
  readBase();          // 대비 보정의 기준 배경은 '지금' 배경이어야 한다
                       // (테마가 바뀐 직후 applyUI 보다 render 가 먼저 와도 색이 틀어지지 않게)
  loadHolidays(cur.getFullYear());
  $('#title').innerHTML = viewTitle();
  $('#prev').setAttribute('aria-label', T('aPrev')[calView]);
  $('#next').setAttribute('aria-label', T('aNext')[calView]);
  $('#today').setAttribute('aria-label', T('aToday'));
  $('#viewSeg').setAttribute('aria-label', T('aViews'));
  for(const b of $('#viewSeg').children){
    const v = b.dataset.v, on = v === calView;
    b.textContent = T(v === 'week' ? 'vWeek' : v === 'month' ? 'vMonth' : 'vYear');
    b.className = on ? 'on' : '';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', T(v === 'week' ? 'aWeek' : v === 'month' ? 'aMonth' : 'aYear'));
  }
  $('#btnIdeas').classList.toggle('on', view==='ideas');
  $('#btnSearch').classList.toggle('on', view==='search');
  $('#btnStats').classList.toggle('on', view==='stats');
  $('#btnSearch').setAttribute('aria-label', T('search'));
  $('#btnIdeas').setAttribute('aria-label', T('archive'));
  $('#btnStats').setAttribute('aria-label', T('stats'));
  const n = bucket('ideas').length;
  $('#btnIdeas').innerHTML = '💡' + (n ? `<span class="cnt">${n}</span>` : '');

  /* 1년은 훑어보는 화면이다 — 날짜 패널도 빠른 입력도 DOM 에서 아예 비운다
     (숨기기만 하면 Tab 으로 닿는 입력칸이 남는다). 검색·보관함을 연 동안만 옆칸이 살아난다. */
  const overview = calView === 'year' && view === 'day';
  const app = $('#app');
  app.classList.toggle('overview', overview);
  for(const v of VIEWS) app.classList.toggle('v-' + v, v === calView);
  calView === 'week' ? renderWeek(tk) : calView === 'year' ? renderYear(tk) : renderMonth(tk);
  if(overview) $('#side').innerHTML = '';
  else view === 'ideas' ? renderIdeas(tk) : view === 'search' ? renderSearch()
     : view === 'stats' ? renderStats() : renderDay(tk);
  flushAnim();                 // 이번 변화에만 해당하는 효과를 붙인다 (그리고 비운다)
  writeSummary();
}

const CHK = `<svg class="chk" width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path
  d="M3 8.6l3.3 3.3L13 5" fill="none" stroke="currentColor" stroke-width="2.3"
  stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* 사용자가 고른 색을 지우지 않되, 배경에 묻히거나 네온처럼 튀지 않을 만큼만 손본다 */
function stripColor(h, target = 3){
  if(!/^#[0-9a-fA-F]{6}$/.test(h||'')) return 'var(--faint)';
  const to = away();
  const from = to === '#ffffff' && lum(h) > .72 ? mix(h,'#000000',.22) : h;  // 어두운 배경에서 네온처럼 튀지 않게
  for(let a = 0; a < 1; a += .04){
    const c = mix(from, to, a);
    if(ratio(c, BASE) >= target) return c;
  }
  return to;
}
/* 한 칸에 필요한 것만 한 번에 계산한다 */
function cellData(k){
  const list = bucket(k), s = sumOf(k);
  return {list, complete:s.complete, cleared:s.cleared, left:s.actionable,
          dist:catDist(list, doc.cats), visible:cellOrder(list).slice(0,3)};
}
let monthHasComplete = false;

function renderMonth(tk){
  const days = monthGrid(cur.getFullYear(), cur.getMonth(), ws());
  materialize(days);
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  monthHasComplete = false;
  const cells = days.map(d=>{
    const k = key(d), s = cellData(k);
    if(s.complete && d.getMonth() === cur.getMonth()) monthHasComplete = true;
    const hn = holName(k), dn = doc.notes[k], w = d.getDay();
    const cls = ['cell', d.getMonth()!==cur.getMonth()?'out':'',
      k===tk?'today':'', k===sel?'sel':'',
      s.cleared ? (s.complete ? 'fin' : 'fin soft') : ''].join(' ');
    const nc = hn || w===0 ? 'var(--sun)' : w===6 ? 'var(--sat)' : '';
    const ev = s.visible.map(evHTML).join('')
      + (s.list.length>3 ? `<span class="more">${T('more')(s.list.length-3)}</span>` : '');
    const label = !s.list.length ? fmtDay.format(d)
      : s.complete ? `${fmtDay.format(d)}, ${T('aTasks')(s.list.length)}, ${T('aAllDone')}`
      : s.cleared ? `${fmtDay.format(d)}, ${T('aTasks')(s.list.length)}, ${T('aCleared')}`
      : `${fmtDay.format(d)}, ${T('aSomeDone')(s.list.length, s.list.filter(t=>t.d).length)}`;
    return `<div class="${cls}" data-k="${k}" role="button" tabindex="0"
        aria-pressed="${k===sel}" aria-label="${esc(label)}">
      <div class="cellTop"><span class="n mono" ${nc?`style="color:${nc}"`:''}>${d.getDate()}</span>${s.cleared?CHK:''}</div>
      ${hn?`<div class="hn" title="${esc(hn)}">${esc(hn)}</div>`:''}
      ${!hn && dn?`<div class="dn" title="${esc(dn)}">${esc(dn)}</div>`:''}
      ${!s.cleared && s.left?`<span class="left">${s.left}</span>`:''}
      <div class="ev">${ev}</div>
      ${s.dist.length?`<div class="strip">${s.dist.map(x=>
        `<i class="${x.color?'':'none'}" style="--c:${x.color?stripColor(x.color):'var(--faint)'};flex:${x.ratio}"></i>`).join('')}</div>`:''}
    </div>`;
  }).join('');
  $('#cal').innerHTML = `<div class="wk">${wdNames().map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>`;
}

/* ── 주간: 이번 주 7일에 무엇을 하기로 했는지. 시간축은 만들지 않는다. ── */
function renderWeek(tk){
  const days = weekGrid(key(cur), ws());
  materialize(days.map(dOf));
  const wdS = new Intl.DateTimeFormat(loc(), {weekday:'short'});
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  const MAX = 4, MOBILE = 2;
  const cards = days.map(k=>{
    const d = dOf(k), s = sumOf(k), list = bucket(k);
    const hn = holName(k), w = d.getDay();
    const nc = hn || w===0 ? 'var(--sun)' : w===6 ? 'var(--sat)' : '';
    const dist = catDist(list, doc.cats);
    const ord = cellOrder(list);
    const label = !list.length ? fmtDay.format(d)
      : s.complete ? `${fmtDay.format(d)}, ${T('aTasks')(list.length)}, ${T('aAllDone')}`
      : s.cleared ? `${fmtDay.format(d)}, ${T('aTasks')(list.length)}, ${T('aCleared')}`
      : `${fmtDay.format(d)}, ${T('aSomeDone')(list.length, s.done)}`;
    const restD = Math.max(0, ord.length - MAX), restM = Math.max(0, ord.length - MOBILE);
    return `<div class="wcard${k===tk?' today':''}${k===sel?' sel':''}${
        s.cleared ? (s.complete ? ' fin' : ' fin soft') : ''}" data-k="${k}" role="button"
        tabindex="0" aria-pressed="${k===sel}" aria-label="${esc(label)}">
      <div class="wh"><span class="wd">${esc(wdS.format(d))}</span>
        <span class="wn mono" ${nc?`style="color:${nc}"`:''}>${d.getDate()}</span>
        <span class="wsp"></span>
        ${s.cleared ? CHK : s.actionable ? `<span class="wleft">${s.actionable}</span>` : ''}</div>
      ${dist.length?`<div class="strip">${dist.map(x=>
        `<i class="${x.color?'':'none'}" style="--c:${x.color?stripColor(x.color):'var(--faint)'};flex:${x.ratio}"></i>`).join('')}</div>`:''}
      <div class="wl">${ord.slice(0, MAX).map(evHTML).join('')}
        ${restM?`<span class="more m">${T('more')(restM)}</span>`:''}
        ${restD?`<span class="more d">${T('more')(restD)}</span>`:''}</div>
      ${hn?`<div class="whn">${esc(hn)}</div>`:''}
    </div>`;
  }).join('');
  $('#cal').innerHTML = `<div class="week">${cards}</div>`;
}

/* ── 1년: 성적표가 아니라 활동 기록. 12개의 작은 달력 + 그 해의 기록. ──
   색은 '그날 끝낸 일의 수' 하나만 말한다 (분류 색은 월/주의 몫). */
/* 연도 전체를 한 번만 훑어 날짜별 완료 수를 만든다 (날짜마다 다시 세지 않게) */
function doneMap(y){
  const pre = String(y), m = new Map();
  for(const [k, list] of Object.entries(doc.todos)){
    for(const t of list){
      if(!t.d) continue;
      const day = t.dd || (isDateKey(k) ? k : null);
      if(day && day.startsWith(pre)) m.set(day, (m.get(day) || 0) + 1);
    }
  }
  return m;
}

function renderYear(tk){
  const y = cur.getFullYear();
  const dm = doneMap(y);
  const wd = wdNames().map(w => w.replace(/요일$/, '').slice(0, 1));
  const fmtDay = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'});
  const months = Array.from({length:12}, (_, m)=>{
    const cells = monthGrid(y, m, ws()).map(d=>{
      if(d.getMonth() !== m) return '<span class="yd out"></span>';
      const k = key(d), n = dm.get(k) || 0, lv = actLevel(n);
      const lab = `${fmtDay.format(d)}${n ? ` · ${T('impDone')} ${n}` : ''}`;
      return `<button class="yd${lv?' a'+lv:''}${k===tk?' today':''}" data-k="${k}" tabindex="-1"
        title="${esc(lab)}" aria-label="${esc(lab)}">${d.getDate()}</button>`;
    }).join('');
    return `<section class="ym">
      <button class="ymt" data-m="${m}">${monthName(m)}</button>
      <div class="ywd">${wd.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <div class="yg">${cells}</div></section>`;
  }).join('');
  $('#cal').innerHTML = `<div class="year">${months}</div>${yearRecord(y, dm)}`;
  /* 날짜 수백 개를 전부 Tab 에 넣지 않는다 — 달마다 한 칸만 들어가고 안에서는 방향키로 */
  for(const g of $('#cal').querySelectorAll('.yg')){
    (g.querySelector('.yd.today') || g.querySelector('.yd[data-k]'))?.setAttribute('tabindex', '0');
  }
}

/* 한 줄 — 세 화면이 같은 모양을 쓴다. 부가 정보는 필요할 때만 붙는다. */
/* 한 줄. 제목이 주인공이고, 나머지는 있을 때만·약하게 붙는다.
   미룬 날수 배지는 줄에 달지 않는다 — 필요하면 안내 카드와 기록 화면에서 한 번만 말한다. */
function rowHTML(t, from, opt = {}){
  const c = catOf(t.c);
  const col = c ? ink(c.c) : 'var(--sub)';
  const cls = ['', t.d?'done':'', t.sk?'skip':'', t.w?'wait':''].join(' ').trim();
  const subs = t.sub || [];
  const subOpen = openSubs.has(t.id), noteOpen = openNotes.has(t.id);
  /* 평소엔 그냥 글자. 끌 수 있다. 수정은 더블클릭이나 ⋯ → 수정 으로 들어간다. */
  const canMove = canDrag && !t.d && !t.sk && !subOpen && editId !== t.id;
  return `<li class="${cls}" data-id="${t.id}" data-from="${from}" style="color:${col}"
      ${canMove ? 'draggable="true"' : ''}>
    <button class="ck"></button>
    <span class="tx" spellcheck="false">${esc(t.t)}</span>
    ${t.r?`<span class="rp" title="${T('routines')}">${ICON.repeat}</span>`:''}
    ${t.w?`<span class="wi" title="${T('waiting')}">${ICON.wait}</span>`:''}
    ${t.d && t.dd && t.o && daysBetween(t.o, t.dd) >= 1
        ? `<span class="took">${T('tookN')(daysBetween(t.o, t.dd))}</span>` : ''}
    ${subs.length ? `<button class="subn">${subs.filter(s=>s.d).length}/${subs.length}</button>` : ''}
    ${opt.star ? `<button class="st ${t.s?'on':''}">${t.s?'★':'☆'}</button>` : ''}
    <button class="mv" title="${T('moveTo')}" aria-label="${T('moveTo')}">⋯</button>
    ${subOpen ? `<div class="subs">
        ${subs.map((s,i)=>`<div class="s ${s.d?'d':''}" data-i="${i}">
          <button class="sck"></button>
          <span contenteditable="plaintext-only" spellcheck="false">${esc(s.t)}</span>
          <button class="sx">×</button></div>`).join('')}
        <input class="subadd" maxlength="120" placeholder="${T('subPh')}"></div>` : ''}
    ${noteOpen ? `<span class="note" contenteditable="plaintext-only" spellcheck="false"
          data-ph="${T('notePh')}">${esc(t.nt||'')}</span>`
      : t.nt ? `<span class="note ro">${esc(t.nt)}</span>` : ''}
  </li>`;
}

/* 날짜 화면. 순서 = 날짜 → 적기 → 오늘 꼭 → 할 일 → (있을 때만) 안내·기다림·완료.
   ★ 오늘 꼭은 위에서 한 번만 보여주고 아래 목록에서는 뺀다 (같은 줄이 두 번 보이지 않게). */
function renderDay(tk){
  materialize([dOf(sel)]);
  const d = dOf(sel);
  const list = bucket(sel);
  const done = list.filter(t=>t.d), skipped = list.filter(t=>t.sk && !t.d);
  const waiting = list.filter(t=>!t.d && !t.sk && t.w);
  const open = list.filter(t=>!t.d && !t.sk && !t.w);
  const sm = sumOf(sel), miss = sm.missed, tot = sm.total;
  const hn = holName(sel), note = doc.notes[sel] || '';
  const must = open.filter(t=>t.s);
  const rest = open.filter(t=>!t.s);
  const nag = rest.filter(t=>(t.mv||0) >= 5).sort((a,b)=>(b.mv||0)-(a.mv||0))[0];
  const gaps = sel === tk ? dueGaps(tk) : [];

  /* 완료한 일도 제 분류 안에 그대로 둔다 — 아래 '완료 N' 으로 접었다 폈다만 한다 */
  const everything = doneOpen ? [...rest, ...done, ...skipped] : rest;
  /* 한동안 앱을 안 쓰면 못 끝낸 일이 전부 오늘로 밀려온다. 천 줄을 한 번에 그리면
     화면도 손도 느려지므로 먼저 이만큼만 보여주고, 나머지는 눌러서 부른다.
     데이터는 하나도 건드리지 않는다 — 그리는 양만 줄인다. */
  const capped = dayAll !== sel && everything.length > DAY_CAP;
  const inGroups = capped ? everything.slice(0, DAY_CAP) : everything;
  const bucketOf = c => inGroups.filter(t => c ? t.c === c.id : !catOf(t.c))
    .sort((a,b) => (a.d||a.sk ? 1 : 0) - (b.d||b.sk ? 1 : 0));
  const groups = [{c:null, items:bucketOf(null)}, ...doc.cats.map(c=>({c, items:bucketOf(c)}))];
  const cats = groups.filter(g=>g.items.length).map(({c, items})=>`
    <div class="cat" data-c="${c?c.id:''}">
      ${c ? `<div class="ch"><span class="sq" style="background:${stripColor(c.c)}"></span>
              <span class="nm" style="color:${ink(c.c)}">${esc(c.n)}</span>
              <span class="edit">${ICON.pencil}</span></div>` : ''}
      <ul>${items.map(t=>rowHTML(t, sel, {star:true})).join('')}</ul>
    </div>`).join('');

  const fmt = new Intl.DateTimeFormat(loc(), {month:'long', day:'numeric'}).format(d);
  const wd = new Intl.DateTimeFormat(loc(), {weekday:'long'}).format(d);

  $('#side').innerHTML = `
    <div class="dh"><b>${fmt}</b>
      <span class="meta">${[calView === 'week' ? '' : wd, sel===tk ? T('today') : ''].filter(Boolean).join(' · ')
        }${hn?` · <i style="color:var(--sun);font-style:normal">${esc(hn)}</i>`:''}</span>
      <button class="dnbtn ${note||noteShow?'on':''}" id="dnToggle" title="${T('dayNotePh')}"
        aria-label="${T('dayNotePh')}">${ICON.pencil}</button>
      ${tot?`<span class="pct mono">${done.length}/${tot}</span>`:''}</div>
    ${tot?`<div class="pbar"><i style="width:${barPct}%"></i></div>`:''}
    ${note && !noteShow ? `<div class="daynote ro" id="dnRead">${esc(note)}</div>` : ''}
    ${noteShow ? `<div class="daynote"><input id="dayNote" maxlength="120"
        placeholder="${T('dayNotePh')}" value="${esc(note)}"></div>` : ''}
    <div class="qcat" id="qcat">
      ${doc.cats.length ? `<button data-q="" class="${quickCat?'':'on'}">${T('noCat')}</button>` : ''}
      ${doc.cats.map(c=>`<button data-q="${c.id}" class="${quickCat===c.id?'on':''}"
          ${canDrag ? 'draggable="true"' : ''}><i style="background:${stripColor(c.c)}"></i>${esc(c.n)}</button>`).join('')}
      <button data-q="+" class="newc">${doc.cats.length ? '+' : T('addCat')}</button>
    </div>
    <div class="qadd main"><span>+</span><input id="qd" maxlength="200" placeholder="${T('quickAdd')}"></div>
    ${tipNow() ? `<div class="tip" id="tip${tipNow().id}"><span>${tipNow().text}</span>
        <button data-tip="${tipNow().id}">${T('gotIt')}</button></div>` : ''}
    ${!sm.all ? `<div class="dayempty"><b>${T('dayEmpty')}</b><span>${T('dayEmptyHint')}</span></div>`
      : !sm.actionable && sm.done ? `<div class="dayempty done">${CHK}<b>${sel===tk?T('dayAllDoneToday'):T('dayAllDone')}</b></div>`
      : !sm.actionable && sm.waiting ? `<div class="dayempty"><b>${T('dayOnlyWait')}</b></div>` : ''}
    ${must.length ? `<div class="must"><div class="sec">★ ${T('mustDo')}</div>
      <ul>${must.map(t=>rowHTML(t, sel, {star:true})).join('')}</ul></div>` : ''}
    ${cats}
    ${capped ? `<button class="fold" id="showAll">
        <span class="ar">${ICON.chev}</span>${T('showAllN')(everything.length - DAY_CAP)}</button>` : ''}
    ${gaps.map(({r,since})=>`<div class="nudge" data-gap="${r.id}">
      <div class="h">${T('sinceDone')(esc(r.t), since)}</div>
      <div class="acts"><button data-a="do">${T('doIt')}</button>
        <button data-a="tomorrow">${T('tomorrow')}</button></div></div>`).join('')}
    ${nag ? `<div class="nudge" data-id="${nag.id}">
      <div class="h"><span>${esc(nag.t)}</span> — ${T('snoozed')(nag.mv)}. ${T('snoozeSub')}</div>
      <div class="acts">
        <button data-a="tomorrow">${T('tomorrow')}</button>
        <button data-a="d2">${T('dayAfter')}</button>
        <button data-a="later">${T('later')}</button>
        <button data-a="del">${T('del')}</button>
      </div></div>` : ''}
    ${waiting.length ? `<div class="sec">${T('waiting')} · ${waiting.length}</div>
      <ul>${waiting.map(t=>rowHTML(t, sel, {})).join('')}</ul>` : ''}
    ${done.length + skipped.length ? `<button class="fold ${doneOpen?'open':''}" id="foldDone"
        aria-expanded="${doneOpen?'true':'false'}">
        <span class="ar">${ICON.chev}</span>${T('doneLbl')}
        <span class="k">${done.length + skipped.length}</span></button>` : ''}`;

  /* 2/5 → 3/5 가 순간이동하지 않게 지난 비율에서 출발시킨다 (움직임 축소면 1ms 라 그대로 보인다) */
  const pct = tot ? done.length / tot * 100 : 0;
  requestAnimationFrame(()=>{ const bar = $('.pbar i'); if(bar) bar.style.width = pct + '%'; });
  barPct = pct;

  if(subFocus){ $(`li[data-id="${subFocus}"] .subadd`)?.focus(); subFocus = null; }
  if(noteFocus){ $('#dayNote')?.focus(); noteFocus = false; }
}

/* 기록 = 평가가 아니라 회고. 연속 일수·달성률처럼 압박을 주는 숫자는 두지 않는다. */
function statsOf(){
  const tk = todayKey(), yr = tk.slice(0,4);
  let done30 = 0, doneYear = 0, doneAll = 0;
  const byCat = new Map(), oldest = [], recent = [];
  for(const [k, list] of Object.entries(doc.todos)){
    for(const t of list){
      if(t.d){
        doneAll++;
        byCat.set(t.c||'', (byCat.get(t.c||'')||0) + 1);
        const day = t.dd || (isDateKey(k) ? k : null);
        if(day){
          if(day.startsWith(yr)) doneYear++;
          if(daysBetween(day, tk) < 30 && day <= tk) done30++;
          recent.push({t, day});
        }
      } else if(t.o && isDateKey(k) && !t.sk && !t.w) oldest.push(t);
    }
  }
  oldest.sort((a,b)=>(a.o||'').localeCompare(b.o||''));
  recent.sort((a,b)=>b.day.localeCompare(a.day));
  return {done30, doneYear, doneAll,
          byCat:[...byCat.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6),
          oldest: oldest.slice(0,3), recent: recent.slice(0,6)};
}

/* 1년 화면의 주인공은 12개월 달력이다. 기록은 그 아래에 사실만 — 점수도 연속 일수도 없다. */
/* 1년 화면 아래에는 색이 무슨 뜻인지만 — 숫자 읽기는 기록(📊) 화면의 몫 */

/* 기록 = 평가가 아니라 회고. 연속 일수·점수처럼 압박을 주는 숫자는 두지 않는다. */

        ${t.nt?`<span class="note ro">${esc(t.nt)}</span>`:''}</li>`).join('')}</ul>
    <div class="sec">${T('byCat')}</div>
