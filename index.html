$('#impClose').onclick = ()=>$('#imp').close();
$('#impFile').onchange = async e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  const text = await f.text();
  const r = readImport(f.name, text);
  if(!r) return $('#impBody').innerHTML = `<div class="err">${T('impBad')}</div>`;
  if(r.src === 'daynua'){
    $('#impBody').innerHTML = `<div class="impstat">${T('impSrc').daynua}</div>`;
    if(!confirm(T('importAsk'))) return;
    snapshot(); snapRing('restore');            // 통째 덮어쓰기 — 되돌릴 길을 두 겹으로
    doc = migrate(r.doc);
    applyUI(); touch(); $('#imp').close();
    return flash(T('impDone2'), true);
  }
  /* 같은 제목이라도 날짜·완료 여부·분류가 다르면 다른 일이다 (9/20 운동과 9/23 운동은 둘 다 들어온다) */
  const sig = (title, date, done, dd, cat) =>
    [norm(title), date||'', done?'1':'0', dd||'', norm(cat||'')].join('|');
  const have = new Set();
  for(const [k, list] of Object.entries(doc.todos))
    for(const t of list)
      have.add(sig(t.t, isDateKey(k) ? k : '', t.d, t.dd, catOf(t.c)?.n));
  const items = r.items.filter(x => {          // 파일 안에서 똑같이 겹치는 줄도 한 번만
    const k = sig(x.t, x.done ? (x.dd || x.date || '') : (x.date || ''), x.done, x.dd, x.cat);
    if(have.has(k)) return false;
    have.add(k); return true;
  });
  const dup = r.items.length - items.length;
  const cats = [...new Set(items.map(x=>x.cat).filter(Boolean))];
  pending = {src:r.src, items, cats};
  $('#impBody').innerHTML = `
    <div class="impstat">
      <div>${T('impSrc')[r.src]} · ${T('impFound')}</div>
      <div><b>${items.filter(x=>!x.done).length}</b> ${T('impTodos')} ·
           <b>${items.filter(x=>x.done).length}</b> ${T('impDone')} ·
           <b>${cats.length}</b> ${T('impCats')}</div>
      <div style="color:var(--sub)">${items.filter(x=>!x.date && !x.done).length} ${T('impNoDate')}
        ${dup ? ` · ${T('impDup')(dup)}` : ''}</div>
    </div>
    <div class="hint"><b>${T('impLost')}:</b> ${esc(T('impLostList')[r.src])}</div>`;
  $('#impGo').hidden = !items.length;
  if(!items.length) $('#impBody').innerHTML += `<div class="err">${T('impEmpty')}</div>`;
};
$('#impGo').onclick = ()=>{
  if(!pending) return;
  const im = uid(), tk = todayKey();
  const map = new Map();
  for(const name of pending.cats){
    const found = doc.cats.find(c => norm(c.n) === norm(name));
    if(found){ map.set(name, found.id); continue; }
    const c = {id:uid(), n:name.slice(0,20), c:PALETTE[doc.cats.length % PALETTE.length], im};
    doc.cats.push(c); map.set(name, c.id);
  }
  for(const x of pending.items){
    const t = {id:uid(), t:x.t.slice(0,200), d:!!x.done, c:map.get(x.cat), mv:0, cr:tk, im};
    if(x.nt) t.nt = x.nt;
    if(x.done && x.dd) t.dd = x.dd;
    const k = x.done ? (x.dd || x.date || tk) : (x.date || 'later');
    if(isDateKey(k)) t.o = k;
    (doc.todos[k] ||= []).push(t);
  }
  doc.imports.push({id:im, at:Date.now(), app:pending.src, n:pending.items.length});
  snapRing('import');
  pending = null;
  $('#imp').close(); touch();
  flash(T('impDone2'));
};
function undoImport(){
  const last = doc.imports[doc.imports.length - 1];
  if(!last) return;
  snapshot();                                   // 바꾸기 '전' 을 찍는다
  doc.imports.pop();
  for(const k of Object.keys(doc.todos)){
    const gone = doc.todos[k].filter(t => t.im === last.id);
    if(gone.length) tomb(...gone.map(t => t.id));
    doc.todos[k] = doc.todos[k].filter(t => t.im !== last.id);
    if(!doc.todos[k].length) delete doc.todos[k];
  }
  tomb(...doc.cats.filter(c => c.im === last.id).map(c => c.id));
  doc.cats = doc.cats.filter(c => c.im !== last.id);
  touch(); flash(T('impUndone'), true);
}

/* ─── 알림 ───
   앱이 꺼져 있어도 울린다: 서버가 그 시각에 빈 푸시를 보내고,
   문구는 서비스워커가 이 기기에 저장해 둔 요약으로 만든다 → 할 일 내용이 서버를 거치지 않는다. */
let notifyTimer = null, pushOn = false, pushWhy = '';   // pushWhy: 서버 알림이 안 켜진 이유 (설정 화면에 보여준다)
const urlB64 = s => {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
};
const permDefault = () => APP ? !APP.notifyAllowed()
  : typeof Notification !== 'undefined' && Notification.permission === 'default';
async function askNotify(){
  if(APP){                                               // 안드로이드 13+ 는 앱이 직접 허용을 받는다
    if(APP.notifyAllowed()) return true;
    return new Promise(res => {
      const done = () => { window.__nativePerm = null; res(APP.notifyAllowed()); };
      window.__nativePerm = done; setTimeout(done, 20000);
      APP.askNotify();
    });
  }
  if(typeof Notification === 'undefined') return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  return (await Notification.requestPermission()) === 'granted';
}
async function writeSummary(){
  if(!('caches' in window)) return;
  try{
    const open = actionable(todayKey());
    const stars = open.filter(t=>t.s).map(t=>'★ '+t.t);
    const body = [...stars, ...open.filter(t=>!t.s).map(t=>t.t)].slice(0,5).join(' · ');
    const sum = {
      date: todayKey(), count: open.length,
      title: open.length ? T('notifyTitle')(open.length) : 'Daynua',
      body: body || T('notifyEmpty'), stale: T('notifyStale')
    };
    if(APP) try{ APP.setSummary(JSON.stringify(sum)); }catch{}
    const c = await caches.open('daynua-state');
    await c.put('/__summary', new Response(JSON.stringify(sum), {headers:{'Content-Type':'application/json'}}));
  }catch{}
}
async function syncPush(){
  pushOn = false; pushWhy = '';
  if(APP){                                               // 앱 안: 서버 푸시 없이 폰의 알람으로 울린다
    const on = !!doc.ui.notify, ok = on && APP.notifyAllowed();
    try{ APP.setReminder(ok, doc.ui.notifyAt || '09:00'); }catch{}
    pushOn = ok; pushWhy = on && !ok ? 'noperm' : '';
    return;
  }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){ pushWhy = 'nosub'; return; }
  const reg = await navigator.serviceWorker.ready.catch(()=>null);
  if(!reg){ pushWhy = 'nosub'; return; }
  let sub = await reg.pushManager.getSubscription();
  if(!doc.ui.notify || !sb || !user || Notification.permission !== 'granted'){
    if(doc.ui.notify) pushWhy = !user ? 'nologin' : 'noperm';
    if(sub){
      if(sb && user) await sb.from('push_subs').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe().catch(()=>{});
    }
    return;
  }
  if(!sub) sub = await reg.pushManager.subscribe(
    {userVisibleOnly:true, applicationServerKey:urlB64(VAPID_PUBLIC)}).catch(()=>null);
  if(!sub){ pushWhy = 'nosub'; return; }
  const j = sub.toJSON();
  const [h,m] = (doc.ui.notifyAt||'09:00').split(':').map(Number);
  const tzOff = -new Date().getTimezoneOffset();
  const { error } = await sb.from('push_subs').upsert({
    endpoint: sub.endpoint, user_id: user.id,
    p256dh: j.keys.p256dh, auth: j.keys.auth,
    utc_min: (((h||0)*60 + (m||0)) - tzOff + 1440) % 1440,
    tz_off: tzOff, lang: doc.ui.lang, updated_at: new Date().toISOString()
  });
  if(error){ pushWhy = 'dberr'; return console.warn(error); }
  pushOn = true;
}
function scheduleNotify(){
  clearTimeout(notifyTimer);
  writeSummary();
  if(pushOn) return;
  if(!doc.ui.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const [h,m] = (doc.ui.notifyAt||'09:00').split(':').map(Number);
  const now = new Date();
  const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h||0, m||0, 0);
  if(at <= now) at.setDate(at.getDate()+1);
  notifyTimer = setTimeout(()=>{ fireNotify(); scheduleNotify(); }, at - now);
}
async function fireNotify(force){
  if(APP){
    if(!APP.notifyAllowed()) return;
    runRollover();
    const open = actionable(todayKey());
    if(!open.length && !force) return;
    const stars = open.filter(t=>t.s).map(t=>'★ '+t.t);
    const body = [...stars, ...open.filter(t=>!t.s).map(t=>t.t)].slice(0,5).join(' · ') || T('notifyEmpty');
    try{ APP.notifyNow(T('notifyTitle')(open.length), body); }catch{}
    return;
  }
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  runRollover();
  const open = actionable(todayKey());
  if(!open.length && !force) return;
  const stars = open.filter(t=>t.s).map(t=>'★ '+t.t);
  const body = [...stars, ...open.filter(t=>!t.s).map(t=>t.t)].slice(0,5).join(' · ') || T('notifyEmpty');
  const opts = {body, icon:'icon-192.png', badge:'icon-192.png', tag:'daynua-daily', renotify:true};
  const reg = await navigator.serviceWorker?.getRegistration();
  if(reg?.showNotification) reg.showNotification(T('notifyTitle')(open.length), opts);
  else new Notification(T('notifyTitle')(open.length), opts);
}

/* ─── 동기화 ───
   문서 전체를 한 줄 JSON 으로 저장하되, 덮어쓰지 않고 합친다(mergeDocs).
   순서는 rev(개정 번호)로 정한다 — 기기 시계는 믿지 않는다. */
let sb = null, user = null, timer = null, syncAt = 0;
let pulling = false;                       // 아래 함수들이 부팅 중에 먼저 불린다 —
let chan = null, live = false, pullTimer = null;   // 선언이 그보다 앞에 있어야 한다
/* 실시간 반영 — 다른 기기가 서버에 쓰면 기다리지 않고 바로 받아온다.
   RLS 가 그대로 걸려 있어서 내 행의 변경만 온다. 연달아 오면 한 번만 읽는다. */
const pullSoon = () => { clearTimeout(pullTimer); pullTimer = setTimeout(pull, 350); };
function watch(){
  if(chan){ try{ sb.removeChannel(chan); }catch{} chan = null; }
  live = false;
  if(!sb || !user) return setAcct();
  chan = sb.channel('state-' + user.id)
    .on('postgres_changes',
        {event:'*', schema:'public', table:'state', filter:'user_id=eq.' + user.id},
        pullSoon)
    .subscribe(st => { live = (st === 'SUBSCRIBED'); setAcct(); });
}
/* 동기화는 '있으면 좋은 것'이다. CDN 이 막히거나 인터넷이 없어도
   할 일 앱 본체는 반드시 뜬다 — 그래서 여기서 실패해도 조용히 넘어간다. */
try{
  if(SUPABASE_URL && SUPABASE_ANON_KEY){
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange(async (ev, ses)=>{
      const was = user;
      user = ses?.user || null;
      if(ev === 'PASSWORD_RECOVERY'){ gateEnter(); openPw('recover'); }
      if((was?.id || '') !== (user?.id || '')) await useSlot();
      setAcct();
      watch();
      if(user){ pull(); syncPush().then(scheduleNotify); }
    });
    user = (await sb.auth.getSession()).data.session?.user || null;
    if(user){ await useSlot(); pull(); watch(); }
  }
}catch(e){ console.warn('동기화를 쓸 수 없습니다 (오프라인이어도 앱은 그대로 동작합니다)', e); sb = null; }
setAcct();

/* 계정이 바뀌면 저장 칸도 바뀐다. 게스트로 적어둔 것은 처음 로그인할 때 한 번만 넘어간다. */
async function useSlot(){
  const next = slotOf(user);
  if(next === slot) return;
  save();
  const carry = slot === GUEST_SLOT && hasContent(doc) ? doc : null;
  slot = next;
  localStorage.setItem('daynua.slot', slot);
  doc = migrate(readSlot(slot) || FRESH());
  if(carry){
    snapRing('merge');
    doc = migrate(mergeDocs(doc, carry));
    localStorage.removeItem(GUEST_SLOT);          // 다음 계정으로 또 따라가지 않게
    doc.ts = Date.now();
  }
  quickCat = catOf(quickCat) ? quickCat : '';
  applyUI(); runRollover(); render();
}

let lastTz = -new Date().getTimezoneOffset();
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  runRollover();
  scheduleNotify();
  const tz = -new Date().getTimezoneOffset();     // 여행·서머타임 뒤에도 제 시각에 울리게
  if(tz !== lastTz){ lastTz = tz; syncPush(); }
  if(user && !live) watch();                     // 자는 동안 끊긴 연결을 되살린다
  if(user) pull(); else render();
});

function setAcct(){
  const on = !!(user && sb);
  const name = on ? user.email.split('@')[0] : (sb ? T('login') : T('guest'));
  $('#acct').classList.toggle('out', !on);
  $('#acct').innerHTML =
    `<span class="av">${on ? esc(name[0].toUpperCase()) : '·'}</span><span class="nm">${esc(name)}</span>`;
}
/* 서버 문서를 통째로 덮어쓰지 않는다. 합친다.
   한쪽에만 있는 할 일은 살아남고, 지운 것만 지운 채로 남는다. */
/* 서버(jsonb)는 키 순서를 바꿔 돌려준다. 순서가 달라도 '같은 문서'로 읽어야 한다 —
   그렇지 않으면 내가 쓴 것의 메아리가 올 때마다 화면을 다시 그려, 적던 입력칸이 끊긴다. */
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v)
  ? Object.fromEntries(Object.entries(v).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : v);
const sameDoc = (a, b) => canon({...a, rev:0, ts:0}) === canon({...b, rev:0, ts:0});
/* 동기화가 화면을 다시 그려야 할 때도, 적던 칸(빠른 추가·검색)의 포커스·글자·커서는 그대로 둔다 */
function renderKeepInput(){
  const a = document.activeElement;
  const keep = a && ['qd','qi','sq'].includes(a.id)
    ? {id:a.id, v:a.value, s:a.selectionStart, e:a.selectionEnd} : null;
  if(keep) a.value = '';                      // 사라지는 칸이 빠져나가며 반쯤 쓴 글을 할 일로 만들지 않게
  render();
  if(keep){
    const n = document.getElementById(keep.id); if(!n) return;
    n.value = keep.v; n.focus({preventScroll:true});
    try{ n.setSelectionRange(keep.s, keep.e); }catch{}
  }
}
async function pull(){
  if(!sb || !user || pulling) return;
  pulling = true;
  try{
    const { data, error } = await sb.from('state').select('doc').eq('user_id', user.id).maybeSingle();
    if(error) return console.warn(error);
    syncAt = Date.now();
    const srv = data?.doc;
    if(!srv?.todos){ if(hasContent(doc)) push(); return; }
    const merged = migrate(mergeDocs(doc, migrate(srv)));
    if(sameDoc(merged, doc)){                          // 내용이 같다 — 개정 번호만 맞추고 화면은 그대로
      if((merged.rev|0) > (doc.rev|0)){ doc.rev = merged.rev; save(); }
      return;
    }
    if(hasContent(doc)) snapRing('sync');
    doc = merged;
    save(); applyUI(); runRollover(); renderKeepInput();
    push();
  }catch(e){ console.warn(e); }
  finally{ pulling = false; }
}
function push(){
  if(!sb || !user) return;
  clearTimeout(timer);
  timer = setTimeout(pushNow, 800);
}

/* 쓰기 직전에 서버를 한 번 더 본다. 그 사이 다른 기기가 썼으면 합치고 나서 쓴다.
   순서 판정은 시계가 아니라 rev — 기기 시간이 틀려도 한쪽이 영원히 이기지 않는다. */
async function pushNow(){
  if(!sb || !user) return;
  try{
    /* 쓰기 전에 서버의 개정 번호만 본다 — 문서 전체(수백 KB)를 매번 내려받지 않는다.
       내가 최신이면 그대로 쓰고, 뒤처졌을 때만 받아서 합친다.
       개정 번호만 읽는 게 실패하면 예전처럼 통째로 읽는다 (안전이 먼저). */
    const full = () => sb.from('state').select('doc').eq('user_id', user.id).maybeSingle();
    let srv = null, srvRev = 0;
    const head = await sb.from('state').select('rev:doc->rev').eq('user_id', user.id).maybeSingle();
    if(head.error){
      srv = (await full()).data?.doc; srvRev = srv?.rev|0;
    }else{
      srvRev = head.data?.rev|0;
      if(srvRev > (doc.rev|0)) srv = (await full()).data?.doc;
    }
    if(srv?.todos && (srv.rev|0) > (doc.rev|0)){
      const merged = migrate(mergeDocs(doc, migrate(srv)));
      const changed = !sameDoc(merged, doc);
      doc = merged;
      save(); if(changed) renderKeepInput();
    }
    doc.rev = Math.max(doc.rev|0, srvRev) + 1;
    const { error } = await sb.from('state')
      .upsert({ user_id:user.id, doc, updated_at:new Date().toISOString() });
    if(error) return console.warn(error);
    syncAt = Date.now();
    save();
  }catch(e){ console.warn(e); }
}

/* ─── 계정 ─── */
let delArmed = false;
const syncWhen = () => {
  if(!syncAt) return T('syncNever');
  const m = Math.floor((Date.now() - syncAt) / 60000);
  return m < 1 ? T('syncJust') : m < 60 ? T('syncMin')(m) : T('syncHour')(Math.floor(m/60));
};
function acctMsg(s, ok){ const e = $('#acctMsg'); e.textContent = s; e.hidden = !s; e.classList.toggle('ok', !!ok); }
function renderAcct(){
  $('#acctTitle').textContent = T('account');
  $('#acctSub').textContent = !sb ? T('localOnly') : user ? T('acctSubIn') : T('loggedOut');
  $('#acctCloseBtn').textContent = T('close');
  $('#acctBody').innerHTML = !sb ? ''
    : user
      ? `<div class="preview"><span class="sq" style="border-radius:50%;background:var(--accent)"></span>
           <span class="t">${esc(user.email)}</span></div>
         <div class="syncline"><i class="${live?'on':''}"></i>${live?T('syncLive'):T('syncIdle')}
           <span>${syncWhen()}</span></div>
         <div class="row"><button class="plain" id="pwBtn">${T('changePw')}</button>
           <button class="primary" id="outBtn">${T('logout')}</button></div>
         <div class="alt"><button class="danger ${delArmed?'armed':''}" id="delAcct">
             ${delArmed ? T('delAcctArmed') : T('delAcct')}</button>
           <a href="privacy.html" target="_blank" style="font-size:12px;color:var(--sub)">${T('privacy')}</a></div>`
      : `<div class="row"><button class="plain" id="upBtn">${T('signup')}</button>
           <button class="primary" id="inBtn">${T('login')}</button></div>
         <div class="alt"><span></span>
           <a href="privacy.html" target="_blank" style="font-size:12px;color:var(--sub)">${T('privacy')}</a></div>`;
  $('#outBtn')?.addEventListener('click', async ()=>{
    doc.ui.notify = false; await syncPush();
    save();                                   // 계정 칸을 제대로 닫고 나간다
    await sb.auth.signOut(); $('#acctDlg').close();
    if(APP) try{ APP.logoutWidget(); }catch{}
    gateReopen();
  });
  $('#pwBtn')?.addEventListener('click', ()=>{ $('#acctDlg').close(); openPw('change'); });
  $('#delAcct')?.addEventListener('click', async ()=>{
    if(!delArmed){ delArmed = true; return renderAcct(); }
    $('#delAcct').disabled = true;
    const tok = (await sb.auth.getSession()).data.session?.access_token;
    const r = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`,
      {method:'POST', headers:{Authorization:`Bearer ${tok}`, apikey:SUPABASE_ANON_KEY}}).catch(()=>null);
    $('#delAcct').disabled = false;
    if(!r?.ok){ delArmed = false; return acctMsg(T('delAcctFail')); }
    await sb.auth.signOut();
    localStorage.removeItem(slot);
    localStorage.removeItem('daynua.slot');
    slot = GUEST_SLOT;
    localStorage.removeItem(GUEST_SLOT);
    doc = migrate(FRESH());
    delArmed = false;
    $('#acctDlg').close(); applyUI(); save(); render();
    flash(T('delAcctDone'));
    if(APP) try{ APP.logoutWidget(); }catch{}
    gateReopen();
  });
  $('#inBtn')?.addEventListener('click', ()=>{ $('#acctDlg').close(); openAuth('in'); });
  $('#upBtn')?.addEventListener('click', ()=>{ $('#acctDlg').close(); openAuth('up'); });
}
$('#acct').onclick = ()=>{ acctMsg(''); delArmed = false; renderAcct(); $('#acctDlg').showModal(); };
$('#acctCloseBtn').onclick = ()=>$('#acctDlg').close();

/* ─── 비밀번호: 앱 안에서 바꾼다 (메일 왕복 없음) ─── */
let pwMode = 'change';
function pwMsg(s, ok){ const e = $('#pwMsg'); e.textContent = s; e.hidden = !s; e.classList.toggle('ok', !!ok); }
function openPw(m){
  pwMode = m;
  pwMsg('');
  $('#pwTitle').textContent = T('changePw');
  $('#pwSub').textContent = m === 'recover' ? T('pwRecover') : T('pwSub');
  $('#pwCancel').textContent = T('cancel');
  $('#pwGo').textContent = T('save');
  $('#pwBody').innerHTML =
    `${m === 'change' ? `<input type="password" id="pwCur" autocomplete="current-password" placeholder="${T('pwCur')}">` : ''}
     <input type="password" id="pwA" autocomplete="new-password" placeholder="${T('pwNew')}">
     <input type="password" id="pwB" autocomplete="new-password" placeholder="${T('pwNew2')}">`;
  $('#pwDlg').showModal();
  setTimeout(()=>$('#pwBody input').focus(), 60);
}
$('#pwCancel').onclick = ()=>$('#pwDlg').close();
$('#pwGo').onclick = async ()=>{
  const a = $('#pwA').value, b = $('#pwB').value;
  if(a.length < 6) return pwMsg(T('pwShort'));
  if(a !== b) return pwMsg(T('pwMismatch'));
  $('#pwGo').disabled = true;
  try{
    if(pwMode === 'change'){
      const cur = $('#pwCur').value;
      const { error } = await sb.auth.signInWithPassword({email:user.email, password:cur});
      if(error) return pwMsg(T('pwWrong'));
    }
    const { error } = await sb.auth.updateUser({password:a});
    if(error) return pwMsg(trErr(error.message));
    $('#pwDlg').close();
    flash(T('pwDone'));
  } finally { $('#pwGo').disabled = false; }
};
$('#pwDlg').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#pwGo').click(); } });

/* ─── 로그인 / 회원가입 ─── */
let authMode = 'in';
function openAuth(m){ authMode = m; authMsg(''); renderAuth(); $('#auth').showModal(); }
function authMsg(s, ok){ const e = $('#authErr'); e.textContent = s; e.hidden = !s; e.classList.toggle('ok', !!ok); }
function renderAuth(){
  const up = authMode === 'up';
  $('#authTitle').textContent = up ? T('signup') : T('login');
  $('#authSub').textContent = T('authSub');
  $('#authGo').textContent = up ? T('signup') : T('login');
  $('#authClose').textContent = T('close');
  $('#authSwap').textContent = up ? T('toLogin') : T('toSignup');
  $('#authReset').textContent = T('forgot');
  $('#email').placeholder = T('emailPh');
  $('#pw').placeholder = T('pwPh');
  $('#pw').autocomplete = 'new-password';
}
$('#authSwap').onclick = ()=>{ authMode = authMode==='up' ? 'in' : 'up'; authMsg(''); renderAuth(); };
$('#authClose').onclick = ()=>$('#auth').close();
$('#authGo').onclick = async ()=>{
  const email = $('#email').value.trim(), pw = $('#pw').value;
  if(!email || !pw) return authMsg(T('needBoth'));
  $('#authGo').disabled = true;
  const opts = { emailRedirectTo: location.origin + location.pathname };
  const { data, error } = authMode==='up'
    ? await sb.auth.signUp({ email, password:pw, options:opts })
    : await sb.auth.signInWithPassword({ email, password:pw });
  $('#authGo').disabled = false;
  if(error) return authMsg(trErr(error.message));
  if(authMode==='up' && !data.session) return authMsg(T('confirmSent'), true);
  sessionStorage.setItem('daynua.sess', '1'); localStorage.removeItem('daynua.guest');
  if(APP) try{ APP.loginWidget(email, pw); }catch{}
  $('#auth').close();
};
$('#authReset').onclick = async ()=>{
  const email = $('#email').value.trim();
  if(!email) return authMsg(T('needEmail'));
  const { error } = await sb.auth.resetPasswordForEmail(email,
    { redirectTo: location.origin + location.pathname });
  authMsg(error ? trErr(error.message) : T('sent'), !error);
};
$('#auth').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#authGo').click(); } });

/* ─── 시작 ─── */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ applyUI(); render(); });
applyUI();
runRollover();
render();

/* ─── 첫 화면 ───
   로고가 써지는 동안(≈1.5초) 로그인 상태를 확인한다.
   · 로그인돼 있고(자동 로그인 켬 또는 이번 실행에서 로그인) → 로고가 다 써지면 앱으로
   · 자동 로그인을 끈 채 새로 켰다 → 로그아웃시키고 로그인 화면
   · 로그인 안 함 → 로그인 화면 ('로그인 없이 시작'을 한 번 골랐으면 그대로 앱으로) */
const gate = $('#gate'), gE = $('#gEmail'), gP = $('#gPw'), gA = $('#gAuto'), gGo = $('#gGo');
const GATE_DRAW = 1500, gateT0 = performance.now();
const wait = ms => new Promise(r => setTimeout(r, ms));
const autoOn = () => localStorage.getItem('daynua.auto') !== '0';   // 예전부터 로그인돼 있던 기기는 그대로 자동
let gateMode = 'in';
if(reduceMo()) gate.classList.add('reduce');
function gateMsg(s, ok){ const e = $('#gErr'); e.textContent = s || ''; e.hidden = !s; e.classList.toggle('ok', !!ok); }
function gateRender(){
  const up = gateMode === 'up';
  gE.placeholder = T('emailPh'); gP.placeholder = T('pwPh');
  gGo.textContent = up ? T('signup') : T('login');
  $('#gSwap').textContent = up ? T('toLogin') : T('toSignup');
  $('#gReset').textContent = T('forgot'); $('#gReset').hidden = up;
  $('#gAutoTx').textContent = T('autoLogin'); $('#gAutoRow').hidden = up;
  $('#gGuest').textContent = T('guestGo'); $('#gGuest').hidden = up;
  gP.autocomplete = 'new-password';                    // 브라우저가 저장된 비밀번호를 끼워 넣지 않게
}
function gateEnter(){
  if(gate.hidden && !document.documentElement.classList.contains('gating')) return;
  const root = document.documentElement, calm = reduceMo();
  root.classList.remove('gating');
  if(!calm){ root.classList.add('entering'); setTimeout(()=>root.classList.remove('entering'), 900); }
  gate.classList.add('out');
  setTimeout(()=>{ gate.hidden = true; gate.classList.remove('out', 'show-card', 'static'); }, calm ? 0 : 650);
}
function gateLogin(instant){
  gateMode = 'in'; gateRender();
  gE.value = localStorage.getItem('daynua.email') || ''; gP.value = '';
  gA.checked = localStorage.getItem('daynua.auto') === '1';
  gate.hidden = false; gate.classList.remove('out');
  const show = () => { gate.classList.add('show-card'); if(canDrag && !gE.value) gE.focus({preventScroll:true}); };
  if(instant) show(); else wait(Math.max(0, GATE_DRAW - (performance.now() - gateT0) + 150)).then(show);
}
function gateReopen(){                                   // 로그아웃·탈퇴 뒤
  sessionStorage.removeItem('daynua.sess'); localStorage.removeItem('daynua.guest');
  document.documentElement.classList.add('gating');
  gate.classList.add('static'); gateMsg('');
  gateLogin(true);
}
async function gateStart(){
  window.__gate = 1;
  if(user && ARRIVED_BY_LINK) sessionStorage.setItem('daynua.sess', '1');
  const sessOK = sessionStorage.getItem('daynua.sess') === '1';
  const left = () => Math.max(0, GATE_DRAW - (performance.now() - gateT0));
  if(user && sb){
    if(autoOn() || sessOK){ sessionStorage.setItem('daynua.sess', '1'); await wait(left()); return gateEnter(); }
    await sb.auth.signOut().catch(()=>{});               // 자동 로그인을 끈 채 다시 켰다
    if(APP) try{ APP.logoutWidget(); }catch{}
  } else if(!sb || localStorage.getItem('daynua.guest') === '1'){
    await wait(left()); return gateEnter();
  }
  gateLogin(false);
}
$('#gSwap').onclick = ()=>{ gateMode = gateMode === 'up' ? 'in' : 'up'; gateMsg(''); gateRender(); };
$('#gGuest').onclick = ()=>{ localStorage.setItem('daynua.guest', '1'); gateEnter(); };
$('#gReset').onclick = async ()=>{
  const email = gE.value.trim();
  if(!email) return gateMsg(T('needEmail'));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  gateMsg(error ? trErr(error.message) : T('sent'), !error);
};
gGo.onclick = async ()=>{
  const email = gE.value.trim(), pw = gP.value;
  if(!email || !pw) return gateMsg(T('needBoth'));
  gGo.disabled = true; gateMsg('');
  try{
    if(gateMode === 'up'){
      const { data, error } = await sb.auth.signUp({ email, password:pw,
        options:{ emailRedirectTo: location.origin + location.pathname } });
      if(error) return gateMsg(trErr(error.message));
      if(data.session) await sb.auth.signOut();          // 가입 뒤에는 로그인 화면으로 — 한 번 더 로그인한다
      localStorage.setItem('daynua.email', email);
      gateMode = 'in'; gateRender(); gP.value = '';
      return gateMsg(data.session ? T('signedUp') : T('confirmSent'), true);
    }
    const { error } = await sb.auth.signInWithPassword({ email, password:pw });
    if(error) return gateMsg(trErr(error.message));
    if(APP) try{ APP.loginWidget(email, pw); }catch{}     // 위젯이 쓸 별도 세션 (비밀번호는 저장하지 않는다)
    localStorage.setItem('daynua.auto', gA.checked ? '1' : '0');
    localStorage.setItem('daynua.email', email);
    localStorage.removeItem('daynua.guest');
    sessionStorage.setItem('daynua.sess', '1');
    gP.value = '';
    gateEnter();
  }catch(e){ gateMsg(T('needBoth')); }
  finally{ gGo.disabled = false; }
};
$('#gCard').addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); gGo.click(); } });
gateRender();
gateStart();
if(APP) syncPush();

if(location.hash === '#test'){                     // 색 대비는 DOM 이 있어야 재므로 여기서
  const was = doc.ui.theme;
  for(const th of ['light','dark']){
    doc.ui.theme = th; applyUI();
    for(const h of ['#d9a020','#2f9e6b','#c9502f','#000000','#ffffff','#3f6fb5']){
      const got = ink(h);
      console.assert(ratio(got, BASE) >= 4.49, `대비 ${th} ${h} → ${got} (${ratio(got,BASE).toFixed(2)})`);
    }
    for(const h of ['#eaff00','#101014','#ffffff','#000000','#d9a020']){
      const got = stripColor(h);
      console.assert(ratio(got, BASE) >= 2.99, `분류 점 ${th} ${h} → ${got} (${ratio(got,BASE).toFixed(2)})`);
    }
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent-ink').trim();
    console.assert(ratio(acc, BASE) >= 4.49, `강조색 글자 ${th} ${acc}`);
    for(const [n, v] of [['sub','--sub'],['faint','--faint']]){
      const c = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      console.assert(ratio(c, BASE) >= (n === 'sub' ? 4.5 : 3), `${v} ${th} ${c} ${ratio(c,BASE).toFixed(2)}`);
    }
  }
  console.assert(ink('#c9502f') !== '#c9502f' || ratio('#c9502f', BASE) >= 4.5, '이미 충분하면 그대로');
  doc.ui.theme = was; applyUI(); render();
  console.log('색 대비 자가검사 끝');
}
/* 앱 아이콘을 꾹 눌렀을 때 나오는 바로가기(manifest 의 shortcuts)로 들어온 경우 */
{
  const a = new URLSearchParams(location.search).get('a');
  if(a){
    history.replaceState(null, '', location.pathname + location.hash);   // 새로고침해도 또 열리지 않게
    if(a === 'search') $('#btnSearch').click();
    else{
      view = 'day'; cur = new Date(); sel = key(cur); render();
      if(a === 'add') setTimeout(()=>{ const q = $('#qd'); q?.focus(); q?.scrollIntoView({block:'center'}); }, 250);
    }
  }
}
navigator.serviceWorker?.register('sw.js').then(()=>syncPush()).catch(()=>{}).finally(scheduleNotify);
</script>
